<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07120d" />
    <title>识别成功 · 交互预览</title>
    <style>*{box-sizing:border-box}[hidden]{display:none!important}html,body{width:100%;height:100%;margin:0}body{color:#eef8f1;background:#07120d;font-family:system-ui,sans-serif;overflow:hidden}#preview{position:fixed;inset:0}#preview canvas{touch-action:none;width:100%;height:100%;display:block}.status{top:max(14px, env(safe-area-inset-top));z-index:5;color:#dfffea;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap;background:#07120dc9;border:1px solid #67f3a044;border-radius:999px;margin:0;padding:8px 14px;font-size:13px;position:fixed;left:50%;transform:translate(-50%)}.status:before{content:"";background:#32e879;border-radius:50%;width:8px;height:8px;margin-right:7px;display:inline-block;box-shadow:0 0 12px #32e879}.controls{left:50%;bottom:max(20px, env(safe-area-inset-bottom));z-index:5;gap:8px;width:min(88vw,360px);display:grid;position:fixed;transform:translate(-50%)}button{color:#f3fff6;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);background:#173526e8;border:1px solid #ffffff28;border-radius:999px;min-height:48px;font:700 16px/1 system-ui,sans-serif}#blow-test-button{color:#bfe8cb;background:#0c2118d9;min-height:38px;font-size:12px;font-weight:500}#gesture-status{left:50%;bottom:calc(max(20px, env(safe-area-inset-bottom)) + 102px);z-index:5;color:#b8cabf;text-align:center;width:min(88vw,420px);font-size:11px;position:fixed;transform:translate(-50%)}.controls{grid-template-columns:1fr 1fr}#photo-button{grid-column:1/-1;min-height:42px}#replay-button{min-height:38px;font-size:12px;font-weight:500}</style>
    <script type="module" crossorigin src="./assets/preview-D1_r9sgK.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/photo-flow-CaZ3Qqtg.js">
  </head>
  <body>
    <main id="preview" aria-label="识别完成后的三只精灵交互预览"></main>
    <p class="status">识别成功 · 预览模式</p>
    <span id="gesture-status" aria-live="polite">可在角色上滑动测试摸头、转身和弹动</span>
    <div class="controls">
      <button id="photo-button" type="button">去合影</button>
      <button id="blow-test-button" type="button">开启吹气互动</button>
      <button id="replay-button" type="button">重播开场</button>
    </div>
  </body>
</html>
