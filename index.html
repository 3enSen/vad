<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:,">
<title>接住星星 · AR 互动</title>
<style>
  :root{
    --ink:#14100E;
    --ink2:#5A524C;
    --ink3:#9C938A;
    --line:#EBE5DE;
    --paper:#FFFFFF;
    --accent:#FF7A45;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:#fff;color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#F5F1EC}

  /* ---------- 背景 / 摄像头 ---------- */
  /* 摄像头不可用时的兜底背景：原来是接近纯白，视觉上像"白色底图"，改成暖米色 */
  #fallback{
    position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #F7F1E8 0%, #EEE5D9 56%, #E3D8C8 100%);
  }
  #fallback::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(20,16,14,.055) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #cam{
    position:absolute;inset:0;width:100%;height:100%;
    min-width:100%;min-height:100%;
    object-fit:cover;object-position:center;
    display:none;z-index:1;
  }
  /* 上下白雾只给扫描页用；游戏界面要求背景全透，playing 时直接关掉 */
  #camMask{
    position:absolute;inset:0;display:none;pointer-events:none;z-index:2;
    background:linear-gradient(180deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,0) 22%,
                                        rgba(255,255,255,0) 72%, rgba(255,255,255,.20) 100%);
  }
  body.cam-on #cam,body.cam-on #camMask{display:block}
  body.cam-on.playing #camMask{display:none}
  body.cam-on #fallback{display:none}

  /* 3D 形象层（必须在 2D 画布之上：地面阴影/暖光画在 2D 上，压在模型身上会变成一道横线） */
  canvas#three{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;display:block;
  }
  canvas#game{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;z-index:4;display:block;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    pointer-events:none;z-index:6;
    opacity:0;transition:opacity .35s ease;
  }
  body.playing #hud{opacity:1}
  #slots{
    display:flex;gap:7px;padding:7px 10px;border-radius:99px;
    background:rgba(255,255,255,.88);
    box-shadow:0 6px 18px rgba(20,16,14,.10);
  }
  .slot{
    width:24px;height:24px;border-radius:8px;
    background:rgba(20,16,14,.05);
    display:grid;place-items:center;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .slot svg{width:15px;height:15px}
  .slot svg path{fill:#D9D2CA;transition:fill .2s}
  .slot.on{background:rgba(255,176,32,.16);transform:scale(1.14)}
  .slot.on svg path{fill:#FFAE18}
  #tip{
    font-size:12.5px;letter-spacing:.05em;color:var(--ink2);
    padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.88);
    box-shadow:0 4px 14px rgba(20,16,14,.08);
  }

  /* ---------- 覆盖页 ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);
    text-align:center;
    transition:opacity .3s ease, visibility .3s;
  }
  .sheet.light{background:#fff}
  .sheet.clear{background:transparent}
  /* 彻底移出渲染树：只靠 opacity/visibility 隐藏时，部分移动端浏览器会残留子元素合成层，
     拍照页的取景框会以"中间一块"的形式留在游戏画面上 */
  .sheet.hide{opacity:0;visibility:hidden;pointer-events:none;display:none}

  .eyebrow{
    font-size:11px;letter-spacing:.30em;text-transform:uppercase;
    color:var(--ink3);margin-bottom:14px;
  }
  h1{font-size:clamp(26px,7vmin,38px);font-weight:800;letter-spacing:.02em;line-height:1.2}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{
    margin-top:10px;font-size:13.5px;line-height:1.8;
    color:var(--ink2);max-width:300px;
  }

  /* 形象选择 */
  #pickers{display:flex;gap:12px;margin:22px 0 0}
  .pick{
    width:82px;height:96px;border-radius:22px;
    border:2px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);
    font-family:inherit;
  }
  .pick img{width:60px;height:44px;object-fit:contain;display:block}
  .pick span{
    font-size:12px;font-weight:800;letter-spacing:.10em;
    color:var(--ink3);line-height:1;transition:color .2s;
  }
  .pick.sel{
    border-color:var(--ink);
    transform:translateY(-4px);
    box-shadow:0 12px 24px rgba(20,16,14,.12);
  }
  .pick.sel span{color:var(--ink)}

  .btn{
    margin-top:18px;
    padding:15px 46px;border:none;border-radius:99px;
    font-size:16px;font-weight:700;letter-spacing:.05em;
    color:#fff;cursor:pointer;font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#FF9159,#FF6B35);
    box-shadow:0 10px 24px rgba(240,97,31,.28);
    transition:transform .16s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{
    background:#fff;color:var(--ink);font-weight:600;font-size:14.5px;
    border:1.5px solid var(--line);box-shadow:none;padding:13px 34px;
  }
  .btn.ghost:active{background:#FAF7F3}
  .btn[hidden]{display:none}

  /* ---------- 识别页（无白底，全屏实景 + 取景框） ---------- */
  #scanSheet{justify-content:center;gap:28px}
  #scanFrame{
    position:relative;
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:30px;
    border:1.5px solid rgba(255,255,255,.62);
    box-shadow:0 12px 38px rgba(20,16,14,.20), inset 0 0 34px rgba(20,16,14,.10);
    flex:0 0 auto;
  }
  #scanFrame i.c{
    position:absolute;width:32px;height:32px;
    border:3px solid #fff;border-radius:7px;
    filter:drop-shadow(0 1px 3px rgba(20,16,14,.42));
    transition:border-color .16s ease, transform .16s ease;
  }
  /* 识别有进展时角标变暖色（替代原来的进度横线） */
  #scanFrame.warm i.c{border-color:#FFC24A;transform:scale(1.08)}
  #scanFrame i.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  #scanFrame i.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
  #scanFrame i.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 14px}
  #scanFrame i.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
  #scanLine{
    position:absolute;left:9%;right:9%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,122,69,.95),transparent);
    animation:scanSweep 2.2s ease-in-out infinite;
  }
  @keyframes scanSweep{
    0%{top:12%;opacity:0}
    18%{opacity:1}
    82%{opacity:1}
    100%{top:88%;opacity:0}
  }
  .scanFoot{
    display:flex;flex-direction:column;align-items:center;
    width:100%;position:relative;z-index:2;
  }
  /* 识别页底部小字与进度横线：已按要求去掉 */
  #scanDebug{display:none}
  #camFail{margin-top:0}

  /* ---------- 结算 ---------- */
  #resultTitle{font-size:clamp(21px,5.6vmin,28px);font-weight:800}
  #resultStars{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
  #resultStars .rs{width:22px;height:22px}
  #resultStars .rs svg path{fill:#E2DCD4}
  #resultStars .rs.on svg path{fill:#FFAE18}
  #photoCard{
    position:relative;
    width:min(300px,78vw);height:min(34vh,268px);
    margin:16px 0 2px;border-radius:20px;
    background:#F3EEE8;overflow:hidden;
    display:grid;place-items:center;
    color:var(--ink3);font-size:12.5px;line-height:1.9;letter-spacing:.04em;
    text-align:center;padding:0 22px;
  }
  #photoCard img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:none;
  }
  #photoCard.has-tpl img{display:block}
  #photoCard.has-tpl #photoPh{display:none}
  /* 0 星：不给模板，改成加油提示 */
  #result.zero #photoCard{
    background:#FFF7EA;border:1.5px dashed #F3D9AE;
    color:#B4802B;font-size:13px;font-weight:600;line-height:1.95;
  }
  #result.zero #shotBtn{display:none}
  #result.zero #resultHint{color:#B4802B;font-weight:600;font-size:12.5px}
  /* 再玩一次 / 更换形象 并排 */
  #resultActions{
    display:flex;gap:10px;align-items:center;justify-content:center;
    margin-top:18px;width:100%;
  }
  #resultActions .btn{margin-top:0}
  #resultActions #againBtn{padding:15px 28px}
  #resultActions #changeBtn{padding:15px 24px;font-size:14.5px}
  #resultHint{
    margin-top:14px;font-size:12px;color:var(--ink3);letter-spacing:.03em;
  }

  /* ---------- 拍照 ---------- */
  /* 取景框用固定宽高（不再靠 aspect-ratio）：切前后镜头时两边分辨率不同，
     靠比例算高度会被撑变形，这里用同一个变量锁死 3:4 */
  #capture{
    justify-content:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 16px);
    --capW: min(360px, 84vw);
  }
  /* 已获得的合照模板：一行可点的缩略图 */
  #tplStrip{
    display:flex;gap:9px;width:100%;
    padding:6px 18px 14px;
    overflow-x:auto;overflow-y:hidden;
    justify-content:center;align-items:flex-end;
    flex:0 0 auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  #tplStrip::-webkit-scrollbar{display:none}
  #tplStrip:empty{display:none}
  .tplChip{
    position:relative;flex:0 0 auto;
    width:60px;height:76px;padding:0;
    border:2px solid transparent;border-radius:13px;
    background:#F1EBE4;overflow:hidden;cursor:pointer;font-family:inherit;
    transition:transform .22s cubic-bezier(.34,1.56,.64,1), border-color .2s;
  }
  .tplChip .ph{
    position:absolute;inset:0;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;color:#B5A897;letter-spacing:.06em;
  }
  .tplChip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .tplChip .badge{
    position:absolute;left:0;right:0;bottom:0;height:15px;
    display:grid;place-items:center;
    font-size:9px;font-weight:800;letter-spacing:.08em;
    color:#7C4A12;background:rgba(255,209,102,.94);
  }
  .tplChip.sel{
    border-color:var(--ink);
    transform:translateY(-4px);
    box-shadow:0 9px 20px rgba(20,16,14,.18);
  }

  /* 取景画框：去掉原先那圈米白边框与内层虚线照片位 */
  #capStage{
    position:relative;
    width:var(--capW);
    height:calc(var(--capW) * 4 / 3);
    border-radius:20px;overflow:hidden;background:#E7DFD4;
    flex:0 0 auto;border:none;outline:none;
  }
  #capTemplate{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:none;
  }
  #capSlot{
    position:absolute;overflow:hidden;background:transparent;
    border:none;
  }
  #capVideo{
    /* 多铺 1px：照片位的百分比宽高会有亚像素，差一点点就会漏出模板底色（看起来像一条细边） */
    width:calc(100% + 2px);height:calc(100% + 2px);
    margin:-1px;object-fit:cover;display:block;
  }
  #capVideo.mirror{transform:scaleX(-1)}
  #capFlip{
    position:absolute;right:10px;top:10px;z-index:3;
    width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(20,16,14,.42);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    transition:transform .18s ease, background .2s;
  }
  #capFlip:active{transform:scale(.92)}
  #capFlip svg{width:19px;height:19px}
  .capActions{
    display:flex;gap:12px;align-items:center;justify-content:center;
    margin-top:18px;width:100%;
  }
  .capActions .btn{margin-top:0}
  #capBack{padding:15px 34px}
  #shootBtn{padding:15px 52px}

  /* 拍照结果 */
  #shotTitle{font-size:19px;font-weight:800;margin-bottom:14px}
  #shotImg{
    max-width:min(340px,86vw);max-height:52vh;
    border-radius:16px;box-shadow:0 16px 38px rgba(20,16,14,.16);
    display:block;
  }
  #saveHint{margin-top:12px;font-size:11.5px;color:var(--ink3);letter-spacing:.03em}

  /* ---------- 杂项 ---------- */
  #arToggle{
    position:absolute;z-index:15;
    top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
    width:40px;height:40px;border-radius:13px;
    border:1px solid var(--line);background:rgba(255,255,255,.9);
    color:var(--ink2);font-size:10px;font-weight:700;
    display:grid;place-items:center;cursor:pointer;letter-spacing:.06em;
    transition:all .2s;font-family:inherit;
    box-shadow:0 4px 12px rgba(20,16,14,.06);
  }
  #arToggle.on{background:var(--ink);border-color:var(--ink);color:#fff}
  body.playing #arToggle{opacity:.42}
  body:not(.playing) #arToggle{display:none}

  #toast{
    position:absolute;z-index:30;left:50%;bottom:14%;transform:translate(-50%,10px);
    padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;
    background:rgba(20,16,14,.86);color:#fff;
    opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #crash{
    position:absolute;z-index:99;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:10px 14px;border-radius:12px;
    background:rgba(214,58,48,.94);color:#fff;
    font-size:12px;line-height:1.55;word-break:break-all;
  }

  /* 矮屏（iPhone SE 等）压缩纵向占用 */
  @media (max-height: 660px){
    .eyebrow{margin-bottom:8px}
    h1{font-size:24px}
    .sub{font-size:12.5px;margin-top:6px;line-height:1.7}
    #pickers{margin-top:14px;gap:10px}
    .pick{width:70px;height:80px;border-radius:18px}
    .pick img{width:50px;height:36px}
    #scanFrame{width:min(56vmin,208px);height:min(56vmin,208px);border-radius:24px}
    .btn{padding:13px 38px;font-size:15px}
    #photoCard{height:min(30vh,190px)}
    #capture{--capW:min(300px,72vw)}
    #tplStrip{padding-bottom:9px;gap:7px}
    .tplChip{width:52px;height:66px;border-radius:11px}
    .capActions{margin-top:13px}
    #shootBtn{padding:13px 44px}
    #capBack{padding:13px 28px}
    #shotImg{max-height:44vh}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="fallback"></div>
  <video id="cam" playsinline muted autoplay></video>
  <div id="camMask"></div>

  <canvas id="three"></canvas>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="slots"></div>
    <div id="tip">拖动屏幕移动小精灵</div>
  </div>

  <button id="arToggle" type="button">AR</button>
  <div id="toast"></div>

  <!-- 第一步：纯扫描（无白底，全屏实景 + 取景框） -->
  <div class="sheet clear" id="scanSheet">
    <div id="scanFrame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div id="scanLine"></div>
    </div>

    <div class="scanFoot">
      <div id="scanDebug">正在开启摄像头…</div>
      <button class="btn ghost" id="camFail" type="button" hidden>摄像头不可用 · 先直接体验</button>
    </div>
  </div>

  <!-- 第二步：扫描成功后进入 —— 接住星星 + 挑选角色 -->
  <div class="sheet light hide" id="intro">
    <div class="eyebrow">AR · 课程互动</div>
    <h1>接住<em>星星</em></h1>
    <p class="sub">拖动小精灵，躲开炸弹，收集星星解锁不同合照</p>

    <div id="pickers">
      <button class="pick sel" data-char="v" type="button">
        <img src="chars/v.png" alt="vv"><span>vv</span>
      </button>
      <button class="pick" data-char="a" type="button">
        <img src="chars/a.png" alt="aa"><span>aa</span>
      </button>
      <button class="pick" data-char="d" type="button">
        <img src="chars/d.png" alt="dd"><span>dd</span>
      </button>
    </div>

    <button class="btn" id="startBtn" type="button">开始游戏</button>
  </div>

  <!-- 结算 -->
  <div class="sheet light hide" id="result">
    <div id="resultTitle">收集完成</div>
    <div id="resultStars"></div>

    <div id="photoCard">
      <img id="photoImg" alt="">
      <span id="photoPh">合照模板</span>
    </div>

    <div id="resultActions">
      <button class="btn" id="againBtn" type="button">再玩一次</button>
      <button class="btn ghost" id="changeBtn" type="button">更换形象</button>
    </div>
    <button class="btn ghost" id="shotBtn" type="button">去拍照</button>
    <div id="resultHint">星星收集数量越多，合照伙伴越多哟</div>
  </div>

  <!-- 拍照 -->
  <div class="sheet light hide" id="capture">
    <div id="tplStrip"></div>

    <div id="capStage">
      <img id="capTemplate" alt="">
      <div id="capSlot"><video id="capVideo" playsinline muted autoplay></video></div>
      <button id="capFlip" type="button" aria-label="反转镜头">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.4 9.2A4 4 0 0 1 8.3 5.6h1.9"/>
          <path d="M19.6 14.8a4 4 0 0 1-3.9 3.6h-1.9"/>
          <path d="M8.9 3.1 11 5.2 8.9 7.3"/>
          <path d="M15.1 16.7 13 18.8l2.1 2.1"/>
        </svg>
      </button>
    </div>

    <div class="capActions">
      <button class="btn ghost" id="capBack" type="button">返回</button>
      <button class="btn" id="shootBtn" type="button">拍照</button>
    </div>
  </div>

  <!-- 拍照结果 -->
  <div class="sheet light hide" id="shotSheet">
    <div id="shotTitle">拍好啦</div>
    <img id="shotImg" alt="合照">
    <a class="btn" id="saveBtn" download="合照.jpg">保存到相册</a>
    <div id="saveHint">没有弹出保存？长按上面的图片即可保存</div>
    <button class="btn ghost" id="shotDone" type="button">完成</button>
  </div>
</div>

<script>
/* 线上分享链接带 sharecode，网关只放行带该参数的请求；
   静态资源需要带上同一份参数，否则会被拦成 403。 */
(function(){
  var m = /[?&]sharecode=([^&]+)/.exec(location.search || '');
  window.ASSET_Q = m ? '?sharecode=' + m[1] : '';
})();
</script>
<script>
(function(){
'use strict';

/* =========================================================================
   1. 配置
   ========================================================================= */
const CONFIG = {
  starTotal: 5,
  firstStarDelay: 0.7,

  starGapFrom: 3.0,
  starGapTo:   2.0,
  starGapJitter: 0.4,

  starFallFrom: 2.75,
  starFallTo:   2.05,

  bombStartAfterStar: 2,
  bombGapFrom: 2.8,
  bombGapTo:   1.6,
  bombGapJitter: 0.4,
  bombFallFrom: 2.6,
  bombFallTo:   1.9,
  stunDuration: 1.45,

  // 炸弹贴着星星生成，形成夹击（概率与贴近度提高 = 更难）
  bombBesideChance: 0.95,
  bombBesideMin: 50,
  bombBesideMax: 92,
  bombDelayMin: 0.12,
  bombDelayMax: 0.32,

  followStiffness: 21,
  keySpeed: 720,
  spriteWidth: 96,
  spriteHeight: 88,          // 形象整体缩小（原 116，屏幕上太占地方）
  groundRatio: 0.845,
  catchTolerance: 0.86,      // 接触判定的圆补偿，也收一点
  catchBoxW: 0.56,           // 判定框宽度（占形象宽的比例）—— 原来 0.88 太大，看着还远就吃到了
  catchBoxH: 0.78,           // 判定框高度（占形象高的比例）

  // 图像识别（黑色图形）
  scanNeed: 6,               // 连续命中帧数（约 0.4s）
  scanInterval: 0.07,        // 检测间隔（秒）

  scanThresholdRatio: 0.42,  // 阈值落在暗部→亮部之间的位置（0=全暗，1=全亮）
  scanMinLum: 26,            // 阈值下限，防止全暗画面

/* 三个形象：立体建模（FBX）+ 选项缩略图 + 名字 + 性格 */
const CHARS = {
  v: { key:'v', name:'vv', persona:'cool', img:'chars/v.png', model:'models/ip_01_heart_static.fbx', accent:'#4A9EFF' },
  a: { key:'a', name:'aa', persona:'warm', img:'chars/a.png', model:'models/ip_02_bubble_static.fbx', accent:'#FF7A45' },
  d: { key:'d', name:'dd', persona:'shy',  img:'chars/d.png', model:'models/ip_03_leaf_static.fbx', accent:'#FF8FAB' },
};
const CHAR_IMG = {};

/* 三种性格：待机幅度、接到星星的动作包络都按这里分派
   cool 装酷——几乎不呼吸、慢慢转头、微微抬下巴
   warm 热情——呼吸快而大、随移动大幅侧倾
   shy  腼腆——小幅快抖、含胸低头 */
const PERSONA = {
  cool: { breath: 1.15, amp: 0.55, lean: 0.70, rotY: 0.07, tilt: -0.055 },
  warm: { breath: 2.35, amp: 1.35, lean: 1.50, rotY: 0.16, tilt:  0.000 },
  shy:  { breath: 1.75, amp: 1.00, lean: 1.00, rotY: 0.10, tilt:  0.070 },
};
const personaOf = k => PERSONA[(CHARS[k] || CHARS.v).persona] || PERSONA.warm;

/* 接到星星的动作包络：e 从 0 → 1。
   返回位移 / 旋转 / 缩放的增量，3D 与 2D 兜底共用同一套参数。 */
function hitPose(persona, e){
  const hop = Math.sin(e * Math.PI);
  const land = e > 0.72 ? Math.sin((e - 0.72) / 0.28 * Math.PI) : 0;

  if(persona === 'cool'){
    /* 装酷：不蹦，只是肩膀一顿、抬下巴、慢悠悠侧一下头 */
    return {
      dy: hop * 0.045,
      rotX: -hop * 0.10,
      rotY: hop * 0.22,
      rotZ: hop * 0.045,
      sx: 1 - hop * 0.015 + land * 0.03,
      sy: 1 + hop * 0.02 - land * 0.04,
      scale: 1 + hop * 0.018,
    };
  }
  if(persona === 'shy'){
    /* 腼腆：先缩一下、低头，然后小幅快速晃两下再慢慢放开 */
    const shrink = Math.sin(e * Math.PI);
    return {
      dy: -shrink * 0.030,
      rotX: shrink * 0.20,
      rotY: Math.sin(e * Math.PI * 2) * 0.10,
      rotZ: Math.sin(e * Math.PI * 4) * 0.085 * (1 - e),
      sx: 1 + shrink * 0.055,
      sy: 1 - shrink * 0.095,
      scale: 1 - shrink * 0.105,
    };
  }
  /* 热情：大跳 + 拉伸 + 扭身 + 落地压扁 */
  return {
    dy: hop * 0.40,
    rotX: Math.sin(e * Math.PI * 2) * 0.18,
    rotY: Math.sin(e * Math.PI * 2) * 0.46,
    rotZ: Math.sin(e * Math.PI * 3) * 0.14 * (1 - e * 0.5),
    sx: 1 - hop * 0.09 + land * 0.12,
    sy: 1 + hop * 0.18 - land * 0.15,
    scale: 1 + hop * 0.05,
  };
}

/* 合照模板：一星 ~ 五星共 5 张，小游戏拿到几颗星就解锁到第几张。
   把图片放到 templates/1.png ~ 5.png 即可自动出现；缺图时显示占位卡，不会报错。
   slot = 摄像头画面（照片位）在模板里的比例位置 */
const TEMPLATES = [
  { stars:1, src:'templates/1.png', slot:{ x:0.12, y:0.16, w:0.76, h:0.62 } },
  { stars:2, src:'templates/2.png', slot:{ x:0.12, y:0.16, w:0.76, h:0.62 } },

/* 按星数取最高的那张模板 */
function templateFor(stars){
  let best = null;
  TEMPLATES.forEach(t => { if(t.stars <= stars && (!best || t.stars > best.stars)) best = t; });
  return best;
}

/* =========================================================================
   3.6 表情层
   模型自带的眼睛是独立的浅色材质组，静态 FBX 没法用骨骼/形态改表情。
   做法是在眼睛正前方叠一张透明平面贴图，接到星星时淡入、再自动淡出。
   下面这组坐标不是估的，是逐个模型读 geometry.groups 的顶点包围盒量出来的：
     v 心形  眼睛中心 ±0.212, y 0.5048  眼白 0.179×0.091
     a 气泡  眼睛中心 ±0.179, y 0.6590  眼白 0.146×0.145
     d 叶子  眼睛中心 ±0.190, y 0.2803  眼白 0.161×0.161
   ========================================================================= */
const FACE_W = 0.84;                          // 表情平面宽度（归一化空间里模型总高 = 1）
const FACE_LAYOUT = {
  v: { cy:0.505, h:0.42, cz:0.132, ex:0.252, ew:0.213, eh:0.216 },
  a: { cy:0.659, h:0.45, cz:0.138, ex:0.213, ew:0.174, eh:0.321 },
  d: { cy:0.280, h:0.40, cz:0.148, ex:0.226, ew:0.191, eh:0.403 },
};

function heartPath(g, cx, cy, size){
  const k = size / 2;
  g.beginPath();
  g.moveTo(cx, cy + k * 0.86);
  g.bezierCurveTo(cx - k * 1.62, cy - k * 0.18, cx - k * 0.74, cy - k * 1.30, cx, cy - k * 0.40);
  g.bezierCurveTo(cx + k * 0.74, cy - k * 1.30, cx + k * 1.62, cy - k * 0.18, cx, cy + k * 0.86);
  g.closePath();
}

/* 把性格画成一张贴图：cool=墨镜 / warm=爱心眼 / shy=腮红 + 汗滴 */
function faceCanvas(persona, key){
  const L = FACE_LAYOUT[key];
  const W = 512, H = Math.round(W * L.h / FACE_W);
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  if(!g) return c;

  const eyeL = (0.5 - L.ex) * W, eyeR = (0.5 + L.ex) * W;
  const cyPx = H * 0.5;

  if(persona === 'cool'){
    /* 装酷：一副墨镜直接盖住原眼睛，天然成立，不需要跟身体颜色对齐。
       镜片要比身体亮一档、再描一圈亮边，否则整张脸会糊成一块黑 */
    const lensW = L.ew * 1.70 * W;
    const lensH = Math.max(L.eh * 1.72 * H, 30);
    const y0    = cyPx - lensH / 2;
    const rr    = lensH * 0.46;
    const lens  = [eyeL - lensW / 2, eyeR - lensW / 2];

    // 镜腿：从镜片外侧向画布边缘延伸
    g.fillStyle = '#1A1922';
    const armH = Math.max(4, lensH * 0.16);
    g.fillRect(0, cyPx - armH / 2, lens[0] + 2, armH);
    g.fillRect(lens[1] + lensW - 2, cyPx - armH / 2, W - (lens[1] + lensW) + 2, armH);

    // 镜片本体
    g.save();
    g.shadowColor = 'rgba(8,6,4,.55)';
    g.shadowBlur = lensH * 0.40;
    g.shadowOffsetY = lensH * 0.14;
    g.fillStyle = '#1A1922';
    lens.forEach(x => { roundRect(g, x, y0, lensW, lensH, rr); g.fill(); });
    g.restore();

    // 鼻梁
    const bridgeW = (eyeR - eyeL) - lensW + 4;
    if(bridgeW > 0){
      g.fillStyle = '#1A1922';
      g.fillRect(lens[0] + lensW - 2, cyPx - lensH * 0.12, bridgeW, lensH * 0.24);
    }

    lens.forEach(x => {
      // 亮边：让墨镜的轮廓从黑色身体上分离出来
      g.save();
      roundRect(g, x, y0, lensW, lensH, rr);
      g.strokeStyle = 'rgba(255,255,255,.30)';
      g.lineWidth = Math.max(1.6, lensH * 0.055);
      g.stroke();
      g.restore();

      // 镜片高光：斜向一道，读得出是玻璃
      g.save();
      roundRect(g, x, y0, lensW, lensH, rr);
      g.clip();
      const lg = g.createLinearGradient(x, y0, x + lensW * 0.92, y0 + lensH);
      lg.addColorStop(0, 'rgba(255,255,255,.30)');
      lg.addColorStop(.30, 'rgba(255,255,255,.05)');
      lg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = lg;
      g.fillRect(x, y0, lensW, lensH);

      // 底缘一点点反光，玻璃感更足
      const bg2 = g.createLinearGradient(0, y0 + lensH * 0.72, 0, y0 + lensH);
      bg2.addColorStop(0, 'rgba(255,255,255,0)');
      bg2.addColorStop(1, 'rgba(255,255,255,.16)');
      g.fillStyle = bg2;
      g.fillRect(x, y0 + lensH * 0.72, lensW, lensH * 0.28);
      g.restore();
    });
    return c;
  }

  if(persona === 'shy'){
    /* 腼腆：不遮眼睛，只在脸颊加两团晕，右边冒一颗小汗滴。
       身体是深色的，腮红必须够浓才看得见 */
    const blushR = L.ew * W * 0.80;
    const blushY = cyPx + H * 0.19;
    [eyeL - L.ew * W * 0.34, eyeR + L.ew * W * 0.34].forEach(cx => {
      const rg = g.createRadialGradient(cx, blushY, 0, cx, blushY, blushR);
      rg.addColorStop(0,   'rgba(255,74,108,.88)');
      rg.addColorStop(.45, 'rgba(255,96,126,.52)');
      rg.addColorStop(.78, 'rgba(255,120,148,.20)');
      rg.addColorStop(1,   'rgba(255,140,164,0)');
      g.fillStyle = rg;
      g.beginPath(); g.arc(cx, blushY, blushR, 0, Math.PI * 2); g.fill();
    });

    // 汗滴
    const dr = Math.min(W, H) * 0.105;
    g.save();
    g.translate(W * 0.846, H * 0.125);
    g.beginPath();
    g.moveTo(0, -dr * 1.62);
    g.bezierCurveTo( dr * 0.98, -dr * 0.34,  dr * 0.88,  dr * 0.86, 0, dr * 0.96);
    g.bezierCurveTo(-dr * 0.88,  dr * 0.86, -dr * 0.98, -dr * 0.34, 0, -dr * 1.62);
    g.closePath();
    const dg = g.createLinearGradient(0, -dr * 1.6, 0, dr);
    dg.addColorStop(0, 'rgba(220,242,255,.98)');
    dg.addColorStop(1, 'rgba(138,192,242,.96)');
    g.fillStyle = dg;
    g.fill();
    g.strokeStyle = 'rgba(255,255,255,.75)';
    g.lineWidth = Math.max(1.6, dr * 0.16);
    g.stroke();
    // 高光点
    g.fillStyle = 'rgba(255,255,255,.92)';
    g.beginPath(); g.ellipse(-dr * 0.28, -dr * 0.34, dr * 0.18, dr * 0.26, -0.4, 0, Math.PI * 2); g.fill();
    g.restore();
    return c;
  }

  /* 热情：两只爱心眼，一大一小错落，更像"眼里冒心" */
  const hs = L.ew * W * 1.58;
  [[eyeL, 1], [eyeR, 0.90]].forEach(([cx, k]) => {
    const size = hs * k;
    g.save();
    g.shadowColor = 'rgba(255,40,80,.60)';
    g.shadowBlur = size * 0.42;
    const hg = g.createLinearGradient(cx, cyPx - size * 0.7, cx, cyPx + size * 0.7);
    hg.addColorStop(0, '#FF6785');
    hg.addColorStop(1, '#D81238');
    g.fillStyle = hg;
    heartPath(g, cx, cyPx, size);
    g.fill();
    g.restore();

    // 左上一道白高光
    g.save();
    heartPath(g, cx, cyPx, size);
    g.clip();
    g.fillStyle = 'rgba(255,255,255,.72)';
    g.beginPath();
    g.ellipse(cx - size * 0.24, cyPx - size * 0.28, size * 0.12, size * 0.16, -0.55, 0, Math.PI * 2);
    g.fill();
    g.restore();
  });
  return c;
}

function makeFaceMesh(key){
  if(!window.THREE) return null;
  const L = FACE_LAYOUT[key];
  if(!L) return null;

  const tex = new THREE.CanvasTexture(faceCanvas(CHARS[key].persona, key));
  if('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;

  const mat = new THREE.MeshBasicMaterial({
    map: tex,
    transparent: true,
    opacity: 0,
    depthTest: false,        // 永远盖在模型前面，避免被眼白顶掉
    depthWrite: false,
    toneMapped: false,
  });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(FACE_W, L.h), mat);
  mesh.position.set(0, L.cy, L.cz);
  mesh.renderOrder = 20;
  mesh.visible = false;
  return mesh;
}

function loadThreeScript(){
