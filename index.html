  });

  // 选择页就开始拉模型，进游戏时已就绪
  preloadModel(G.char);
}

async function enterGame(){
  SCAN.running = false;
  scanEl.classList.add('hide');
  introEl.classList.add('hide');
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  document.body.classList.add('playing');
  resetGame();
  G.state = 'playing';
  preloadModel(G.char);

  /* 从拍照页回来时最容易在这里出现"只有中间一块有画面"，
     进游戏前统一把背景重新铺一遍 */
  if(camStream) await ensureCamBg();
}

async function prepareAndPlay(){
  ensureAudio();

  // 拍照切过镜头的话这里补一次
  if(!camStream){
    let ok = await openCam(camFacing);
    if(!ok){ await new Promise(r => setTimeout(r, 320)); ok = await openCam(camFacing); }
  } else {
    await ensureCamBg();
  }
  await enterGame();
}

function gameOver(){
  G.state = 'over';
  document.body.classList.remove('playing');

  const zero = G.score <= 0;
  if(G.score > G.best) G.best = G.score;
  /* 拿到几颗星就记下对应的那张模板；拿过的都留着，之后拍照可以来回换。
     owned 存的是模板的星数（不是得分）—— 2 星会落到 1 星那张上，避免重复。
     只存在内存里 —— 刷新页面重进就没了，正是要的效果 */
  if(G.score >= 1){
    const own = templateFor(G.score);
    if(own && G.owned.indexOf(own.stars) < 0) G.owned.push(own.stars);
  }

  if(zero) SFX.miss(); else SFX.win();

  let title;
  if(G.score >= CONFIG.starTotal) title = '满星通关';
  else if(G.score >= 3) title = '差一点点';
  else if(G.score >= 1) title = '还不错';
  else title = '加油！';
  resultTitleEl.textContent = title;

  const rs = document.getElementById('resultStars');
  rs.innerHTML = '';
  for(let i = 0; i < CONFIG.starTotal; i++){
    const s = document.createElement('div');
    s.className = 'rs' + (i < G.score ? ' on' : '');
    s.innerHTML = STAR_SVG;
    rs.appendChild(s);
  }

  /* 0 星拿不到合照模板：不显示模板卡内容，也不给「去拍照」 */
  resultEl.classList.toggle('zero', zero);

  if(zero){
    photoCard.classList.remove('has-tpl');
    photoImg.removeAttribute('src');
    photoImg.style.display = 'none';
    photoPh.style.display = 'block';
    photoPh.style.whiteSpace = 'pre-line';
    photoPh.textContent = '这次一颗都没接到\n再来一次，就能解锁合照啦';
    hintEl.textContent = '再接住星星，就有合照模板可以拍啦';
  } else {
    const tpl = templateFor(G.score);
    // 先把占位文字设好：模板图万一缺图，error 回调把图藏掉就落在这里，不会是空的
    photoPh.style.whiteSpace = 'pre-line';
    photoPh.style.display = 'block';
    photoPh.textContent = (tpl ? tpl.stars + ' 星合照' : '合照模板') + '\n等待替换';
    if(tpl){
      photoImg.style.display = 'block';
      photoImg.src = tpl.src + (window.ASSET_Q || '');
      photoCard.classList.add('has-tpl');
      photoPh.style.display = 'none';     // 有了模板图就不显示占位文字
    } else {
      photoImg.removeAttribute('src');
      photoImg.style.display = 'none';
      photoCard.classList.remove('has-tpl');
    }
    hintEl.textContent = '星星收集数量越多，合照伙伴越多哟';
  }

  resultEl.classList.remove('hide');
}

/* =========================================================================
   14. 拍照
   ========================================================================= */
const capStage = document.getElementById('capStage');
const capTpl   = document.getElementById('capTemplate');
const faceCvEl = document.getElementById('capFaceCv');
const tplStrip = document.getElementById('tplStrip');
const shotImg  = document.getElementById('shotImg');
let shotDataUrl = '';
let tplSel = null;                 // 当前选中的合照模板
let capGeo = null;                 // 模板 & 人脸圆在视口里的位置（CSS px）

/* 模板图加载完再摆位置；缺图就把整层收掉，绝不留一个空框 */
capTpl.addEventListener('load',  () => layoutCapScene());
capTpl.addEventListener('error', () => { capTpl.style.display = 'none'; layoutCapScene(); });

/* 结算页的模板图：缺图时退回文字占位，别露出一张裂图 */
photoImg.addEventListener('error', () => {
  photoImg.style.display = 'none';
  photoCard.classList.remove('has-tpl');
  photoPh.style.display = 'block';
});

/* 模板图真的加载出来了才摆；否则整层隐藏 */
function tplReady(){
  return !!(tplSel && capTpl.complete && capTpl.naturalWidth);
}

/* 提示语跟着镜头走：不是自拍时先教用户切前置，否则脸根本对不进圈 */
function syncCapTip(){
  const el = document.getElementById('capTip');
  if(!el) return;
  el.textContent = (camFacing === 'user')
    ? '把脸放进画面中间，身上直接出效果'
    : '点右上角切前置，把脸放进画面中间';
}

/* 取脸窗口：固定在屏幕中间偏上那一块（自拍时脸大致就在这儿），
   预览贴片和成片都从这里取，所以看到什么就拍到什么。
   返回视频源坐标；自拍时源坐标要翻一次（画面上是镜像的）。 */
function faceSrcRect(){
  const v = camEl;
  if(!v || v.readyState < 2 || !v.videoWidth) return null;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);            // 和 drawCamBg 同一套 cover 映射
  const offX = (W - vw * sc) / 2, offY = (H - vh * sc) / 2;

  const side = W * FACE_CROP;
  const ccx  = W * 0.5;
  const ccy  = H * FACE_CROPY;

  let sx = (ccx - side / 2 - offX) / sc;
  let sy = (ccy - side / 2 - offY) / sc;
  const sSize = side / sc;
  if(camFacing === 'user') sx = vw - (sx + sSize);

  const kx = clamp(sx, 0, Math.max(vw - 1, 0));
  const ky = clamp(sy, 0, Math.max(vh - 1, 0));
  const kw = Math.min(sSize, vw - kx);
  const kh = Math.min(sSize, vh - ky);
  if(kw < 1 || kh < 1) return null;
  return { v, kx, ky, kw, kh };
}

/* 取景区里那块脸贴片：每帧重画，用户站过去就能直接看到大致效果 */
function paintFacePatch(){
  if(!capGeo) return;
  const el = faceCvEl;
  if(!el || !el.width) return;
  const g = el.getContext('2d');
  const w = el.width, h = el.height;
  g.clearRect(0, 0, w, h);

  const src = faceSrcRect();
  if(!src){
    g.fillStyle = 'rgba(120,110,100,.55)';
    g.fillRect(0, 0, w, h);
    return;
  }
  g.save();
  if(camFacing === 'user'){ g.translate(w, 0); g.scale(-1, 1); }
  g.drawImage(src.v, src.kx, src.ky, src.kw, src.kh, 0, 0, w, h);
  g.restore();
}

/* 成片的取景窗（屏幕 CSS 坐标）：4:5，竖向套住小人。
   预览里的暗框和真正的裁切都用它，所以看到什么就拍到什么。 */
function photoCrop(){
  const ar = 1080 / 1350;
  let sw = W, sh = H, ox = 0, oy = 0;
  if(W / H < ar){
    sh = W / ar;
    const mid = capGeo ? (capGeo.y + capGeo.h * 0.5) : H * 0.5;
    oy = clamp(mid - sh / 2, 0, Math.max(0, H - sh));
  } else {
    sw = H * ar;
    ox = (W - sw) / 2;
  }
  return { sw, sh, ox, oy, ar };
}

/* 摆模板与脸贴片：
   模板只占取景区高度的 TPL_H（约半屏），四张图已归一到同一图高，所以人物一样大；
   脸贴片挂在模板脖子上，每帧由 paintFacePatch() 把实景里那块脸画进去。 */
function layoutCapScene(){
  const r = capStage.getBoundingClientRect();
  if(!tplReady() || r.width < 20 || r.height < 20){
    capGeo = null;
    capTpl.style.display = 'none';
    faceCvEl.style.display = 'none';
    return;
  }

  const t  = tplSel;
  const ar = capTpl.naturalWidth / capTpl.naturalHeight;
  // 模板高度按"成片取景框"来定：小人大概占画面一半，不把整屏塞满
  const cropH = Math.min(r.width * 1350 / 1080, r.height);
  let dh = cropH * TPL_H;
  let dw = dh * ar;
  const maxW = r.width * 0.94;              // 两侧留边，幽灵不贴屏幕边
  if(dw > maxW){ dw = maxW; dh = dw / ar; }

  const x = (r.width  - dw) / 2;
  const y = (r.height - dh) * 0.56;          // 略偏下，上面给提示语留空

  /* 脸贴片：正方形，底边压在脖子底 */
  const fb   = dh * HEAD_FB;
  const rbox = fb * HEAD_R;
  const cx   = x + t.faceX * dw;             // 脖子中轴
  const botY = y + (t.faceY + (t.seat != null ? t.seat : HEAD_SEAT)) * dh;
  const boxL = cx - fb / 2;
  const boxT = botY - fb;

  capTpl.style.left   = x + 'px';
  capTpl.style.top    = y + 'px';
  capTpl.style.width  = dw + 'px';
  capTpl.style.height = dh + 'px';
  capTpl.style.display = 'block';

  faceCvEl.style.left   = boxL + 'px';
  faceCvEl.style.top    = boxT + 'px';
  faceCvEl.style.width  = fb + 'px';
  faceCvEl.style.height = fb + 'px';
  faceCvEl.style.setProperty('--rbox', rbox + 'px');
  faceCvEl.style.display = 'block';

  // 画布像素按 DPR 放大，贴片放大后才不糊
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw  = Math.max(2, Math.round(fb * dpr));
  if(faceCvEl.width !== cw){ faceCvEl.width = cw; faceCvEl.height = cw; }

  // 存成视口坐标，拍照时直接乘缩放比
  capGeo = { x: r.left + x, y: r.top + y, w: dw, h: dh,
             bx: r.left + boxL, by: r.top + boxT,
             fb, rbox };

  /* 成片取景框：框外压暗，框内就是最终画面 */
  const cr = photoCrop();
  const fi = document.querySelector('#capFrame i');
  if(fi){
    fi.style.left   = (cr.ox - r.left) + 'px';
    fi.style.top    = (cr.oy - r.top) + 'px';
    fi.style.width  = cr.sw + 'px';
    fi.style.height = cr.sh + 'px';
  }

  paintFacePatch();
}

onResizeCapture = () => { if(G.state === 'capture') layoutCapScene(); };

/* 选中某张模板 */
function selectTemplate(t){
  tplSel = t || null;
  if(tplSel){
    capTpl.style.display = 'block';
    capTpl.src = tplSel.src + (window.ASSET_Q || '');
  } else {
    capTpl.style.display = 'none';
    capTpl.removeAttribute('src');
  }
  layoutCapScene();
  const cur = tplSel ? String(tplSel.stars) : '';
  Array.prototype.forEach.call(tplStrip.children, c => {
    c.classList.toggle('sel', c.dataset.stars === cur);
  });
}

/* 上方一行：本次游戏里拿过的模板都留着，随时可以点回来换一张拍。
   只存在内存里，刷新页面就清空（用户要的就是这个行为） */
function buildTemplateStrip(){
  const owned = (G.owned || []).slice().sort((a, b) => a - b);
  tplStrip.innerHTML = '';

  owned.forEach(stars => {
    const t = TEMPLATES.find(x => x.stars === stars);
    if(!t) return;

    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tplChip';
    b.dataset.stars = String(t.stars);

    const ph = document.createElement('span');
    ph.className = 'ph';
    ph.textContent = t.stars + ' 星';

    const img = document.createElement('img');
    img.alt = '';
    img.style.display = 'none';                 // 加载成功再显示，缺图就停在占位卡
    img.addEventListener('load', () => { img.style.display = 'block'; });
    img.addEventListener('error', () => { img.style.display = 'none'; ph.style.display = 'grid'; });
    img.src = t.src + (window.ASSET_Q || '');

    const bd = document.createElement('span');
    bd.className = 'badge';
    bd.textContent = '★'.repeat(t.stars);

    b.appendChild(ph);
    b.appendChild(img);
    b.appendChild(bd);
    b.addEventListener('click', () => { ensureAudio(); selectTemplate(t); });
    tplStrip.appendChild(b);
  });

  // 默认选中本局拿到的那张（拿过的都在）
  const pick = templateFor(G.score) || TEMPLATES.find(x => x.stars === owned[owned.length - 1]) || null;
  selectTemplate(pick);
}

async function openCapture(){
  ensureAudio();
  G.state = 'capture';
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.remove('hide');
  document.body.classList.add('capturing');

  buildTemplateStrip();
  requestAnimationFrame(() => layoutCapScene());   // 等 flex 布局稳定后再摆一次

  /* 合照要的是自己的脸。游戏里用后摄看环境，进拍照页第一次自动换到前置；
     用户自己翻过镜头（camTouched）就不再擅自切回去。 */
  if(!camTouched && camFacing !== 'user'){
    const ok = await openCam('user');
    if(!ok) await openCam('environment');        // 没有前摄就退回后摄
  } else if(!camStream){
    await openCam(camFacing);
  } else {
    await ensureCamBg();
  }
  syncCapTip();
}

async function closeCapture(){
  capEl.classList.add('hide');
  shotEl.classList.add('hide');
  document.body.classList.remove('capturing');
  resultEl.classList.remove('hide');
  G.state = 'over';
  if(!camStream){
    let ok = await openCam('environment');
    if(!ok){ await new Promise(r => setTimeout(r, 280)); ok = await openCam('environment'); }
  } else {
    await ensureCamBg();
  }
}

/* 把整屏画面合成成一张图：实景铺底 → 模板人物贴上去 → 人脸圆盖在脖子上。
   mirror = 自拍，整块按镜像画，拍出来才和取景时看到的一致。
   返回 false 表示这一段暂时没有可用画面。 */
function drawVideoCover(g, dx, dy, dw, dh, mirror){
  const v = camEl;
  if(!v || v.readyState < 2 || !v.videoWidth || !v.videoHeight) return false;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(dw / vw, dh / vh);
  const sw = dw / sc, sh = dh / sc;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;

  g.save();
  if(mirror){
    g.translate(dx + dw, dy);
    g.scale(-1, 1);
    g.drawImage(v, sx, sy, sw, sh, 0, 0, dw, dh);
  } else {
    g.drawImage(v, sx, sy, sw, sh, dx, dy, dw, dh);
  }
  g.restore();
  return true;
}

/* ---------- 人脸贴片 ---------- */

/* 把取脸窗口那块实景，平面贴到模板的脖子上。
   坐标一律用 CSS px，外层变换负责裁切 + 放大；shadow 是设备像素，得乘 k。 */
function drawFaceFlat(g, k){
  const G  = capGeo;
  const fb = G.fb, rb = G.rbox, bx = G.bx, by = G.by;
  const src = faceSrcRect();

  // 贴在身上的一点淡影，贴片才不像"挖了个洞"
  g.save();
  g.shadowColor   = 'rgba(20,16,14,.34)';
  g.shadowBlur    = fb * 0.14 * k;
  g.shadowOffsetY = fb * 0.045 * k;
  roundRect(g, bx, by, fb, fb, rb);
  g.fillStyle = '#D9CFC0';
  g.fill();
  g.restore();

  if(!src) return;

  g.save();
  roundRect(g, bx, by, fb, fb, rb);
  g.clip();
  if(camFacing === 'user'){
    // 取景里看到的是镜像画面，成片保持镜像，拍出来才和刚才看到的一致
    g.translate(bx + fb, by);
    g.scale(-1, 1);
    g.drawImage(src.v, src.kx, src.ky, src.kw, src.kh, 0, 0, fb, fb);
  } else {
    g.drawImage(src.v, src.kx, src.ky, src.kw, src.kh, bx, by, fb, fb);
  }
  g.restore();
}

/* 拍：从屏幕构图里裁一块 4:5 出来，取景窗竖向套住小人（小人半屏，它是构图中心），
   模板 / 脸贴片的位置都照搬屏幕坐标，所以拍到的东西和取景时一模一样 */
function shoot(){
  if(!capGeo) layoutCapScene();    // 刚换过模板图、还没摆位时补一次

  const OUT_W = 1080, OUT_H = 1350;
  const ar = OUT_W / OUT_H;

  // 和预览里的暗框同一个取景窗
  const cr = photoCrop();
  let sw = cr.sw, sh = cr.sh, ox = cr.ox, oy = cr.oy;
  const k = OUT_W / sw;

  const cc = document.createElement('canvas');
  cc.width = OUT_W; cc.height = OUT_H;
  const g = cc.getContext('2d');
  g.fillStyle = '#E7DFD4';
  g.fillRect(0, 0, OUT_W, OUT_H);

  // 之后所有绘制都用屏幕 CSS 坐标，变换负责裁切 + 放大
  g.save();
  g.setTransform(k, 0, 0, k, -ox * k, -oy * k);

  drawVideoCover(g, 0, 0, W, H, camFacing === 'user');

  if(capGeo && tplReady()){
    // 和预览时的 CSS drop-shadow 对得上，照片才不会跟屏幕差一截
    g.save();
    g.shadowColor = 'rgba(20,16,14,.26)';
    g.shadowBlur = 32 * k;
    g.shadowOffsetY = 16 * k;
    g.drawImage(capTpl, capGeo.x, capGeo.y, capGeo.w, capGeo.h);
    g.restore();
    drawFaceFlat(g, k);
  }

  g.restore();

  shotDataUrl = cc.toDataURL('image/jpeg', 0.92);
  shotImg.src = shotDataUrl;

  SFX.shutter();
  capEl.classList.add('hide');      // 取景页先收掉，结果页才是干净的透明底
  shotEl.classList.remove('hide');
}

/* 重新拍摄：结果页收掉、取景页放回来（实景一直开着，不用重开摄像头） */
function retake(){
  ensureAudio();
  shotEl.classList.add('hide');
  capEl.classList.remove('hide');
  layoutCapScene();                 // 回来之后按当前尺寸重摆一次
  if(!camStream) openCam(camFacing); else ensureCamBg();
}

/* =========================================================================
   15. 主循环
   ========================================================================= */
let lastTs = 0, crashed = false;

function safeRender(){
  if(crashed) return;
  try{ render(); }
  catch(err){
    crashed = true;
    console.error('[render]', err);
    const el = document.createElement('div');
    el.id = 'crash';
    el.textContent = '渲染出错：' + (err && err.message ? err.message : err);
    document.body.appendChild(el);
  }
}

function loop(ts){
  const dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
  lastTs = ts;

  ANIM.t += dt;
  ANIM.bounce = damp(ANIM.bounce, 0, 6, dt);
  ANIM.sink   = damp(ANIM.sink,   0, 5, dt);

  if(G.state === 'playing'){
    updateSprite(dt);
    updateItems(dt);
    updateTimers(dt);
    updateParticles(dt);
    if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3.2);
  } else {
    G.t += dt;
    updateParticles(dt);
    G.sprite.mood = 'idle';
    if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3.2);
  }

  if(G.state === 'scan') updateScan(dt);

  /* 摄像头自愈：切前后镜头 / 切后台之后 video 可能被挂起，或者丢了尺寸
     （丢了尺寸就会只铺一块、或者露出底下的暖米色底），两种都补一次 */
  if(camStream && (camEl.paused || !camEl.videoWidth) && G.state !== 'capture' && ts > camHealAt){
    camHealAt = ts + 1200;
    ensureCamBg().catch(() => {});
  }

  syncR3(dt);
  safeRender();
  requestAnimationFrame(loop);
}
let camHealAt = 0;

/* =========================================================================
   16. 绑定
   ========================================================================= */
document.querySelectorAll('.pick').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.pick').forEach(o => o.classList.remove('sel'));
    el.classList.add('sel');
    G.char = el.dataset.char;
    ensureAudio();
    preloadModel(G.char);
  });
});

document.getElementById('startBtn').addEventListener('click', () => { prepareAndPlay(); });
document.getElementById('againBtn').addEventListener('click', () => { prepareAndPlay(); });
document.getElementById('changeBtn').addEventListener('click', () => { ensureAudio(); showIntro(); });
document.getElementById('shotBtn').addEventListener('click', () => { openCapture(); });
document.getElementById('capBack').addEventListener('click', () => { closeCapture(); });
document.getElementById('shootBtn').addEventListener('click', () => { shoot(); });
document.getElementById('retakeBtn').addEventListener('click', () => { retake(); });
document.getElementById('shotDone').addEventListener('click', () => { closeCapture(); });
capFlipBtn.addEventListener('click', () => { ensureAudio(); flipCamera(); });
camFailBtn.addEventListener('click', () => { enterGame(); });

arBtn.addEventListener('click', () => {
  if(camStream) closeCam(); else openCam(camFacing);
});

document.addEventListener('gesturestart', e => e.preventDefault());
cvs.addEventListener('contextmenu', e => e.preventDefault());

let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

/* =========================================================================
   17. 启动
   ========================================================================= */
['v','a','d'].forEach(k => {
  const im = new Image();
  im.src = CHARS[k].img + (window.ASSET_Q || '');
  CHAR_IMG[k] = im;
});

initScan();
resize();
buildSlots();
G.sprite.x = W/2;
G.sprite.tx = W/2;
requestAnimationFrame(loop);
bootScan();

/* 3D 资源后置加载，不阻塞扫描；加载好再把形象换成建模 */
loadThreeScript().then(ok => {
  if(!ok) return;
  if(!initR3()) return;
  preloadModel(pendingChar || G.char);
});

window.__GAME = { G, CONFIG, CHARS, TEMPLATES, SCAN, ANIM, R3, modelCache,
                  enterGame, prepareAndPlay, showIntro, analyzeMarker, bootScan,
                  openCapture, shoot, closeCapture, retake, flipCamera, gameOver,
                  selectTemplate, templateFor, scanSuccess: onScanSuccess,
                  onCatch, onBomb, showFace, setEyesVisible, drawCamBg,
                  get tplSel(){ return tplSel; },
                  get camFacing(){ return camFacing; } };
})();
</script>
