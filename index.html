<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:,">
<title>接住星星 · AR 互动</title>
<style>
  :root{
    --ink:#14100E;
    --ink2:#5A524C;
    --ink3:#9C938A;
    --line:#EBE5DE;
    --paper:#FFFFFF;
    --accent:#FF7A45;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:#fff;color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#F5F1EC}

  /* ---------- 背景 / 摄像头 ---------- */
  #fallback{
    position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #FCFBF9 0%, #F2EDE7 56%, #E9E2DA 100%);
  }
  #fallback::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(20,16,14,.055) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #cam{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    display:none;z-index:1;
  }
  #camMask{
    position:absolute;inset:0;display:none;pointer-events:none;z-index:2;
    background:linear-gradient(180deg, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 24%,
                                        rgba(255,255,255,0) 68%, rgba(255,255,255,.34) 100%);
  }
  body.cam-on #cam,body.cam-on #camMask{display:block}
  body.cam-on #fallback{display:none}

  /* 3D 形象层（必须在 2D 画布之上：地面阴影/暖光画在 2D 上，压在模型身上会变成一道横线） */
  canvas#three{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;display:block;
  }
  canvas#game{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;z-index:4;display:block;
  }

  /* ---------- HUD ---------- */
  #hud{
    position:absolute;left:0;right:0;top:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    display:flex;flex-direction:column;align-items:center;gap:9px;
    pointer-events:none;z-index:6;
    opacity:0;transition:opacity .35s ease;
  }
  body.playing #hud{opacity:1}
  #slots{
    display:flex;gap:7px;padding:7px 10px;border-radius:99px;
    background:rgba(255,255,255,.88);
    box-shadow:0 6px 18px rgba(20,16,14,.10);
  }
  .slot{
    width:24px;height:24px;border-radius:8px;
    background:rgba(20,16,14,.05);
    display:grid;place-items:center;
    transition:transform .28s cubic-bezier(.34,1.56,.64,1), background .2s;
  }
  .slot svg{width:15px;height:15px}
  .slot svg path{fill:#D9D2CA;transition:fill .2s}
  .slot.on{background:rgba(255,176,32,.16);transform:scale(1.14)}
  .slot.on svg path{fill:#FFAE18}
  #tip{
    font-size:12.5px;letter-spacing:.05em;color:var(--ink2);
    padding:5px 13px;border-radius:99px;background:rgba(255,255,255,.88);
    box-shadow:0 4px 14px rgba(20,16,14,.08);
  }

  /* ---------- 覆盖页 ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);
    text-align:center;
    transition:opacity .3s ease, visibility .3s;
  }
  .sheet.light{background:#fff}
  .sheet.clear{background:transparent}
  .sheet.hide{opacity:0;visibility:hidden;pointer-events:none}

  .eyebrow{
    font-size:11px;letter-spacing:.30em;text-transform:uppercase;
    color:var(--ink3);margin-bottom:14px;
  }
  h1{font-size:clamp(26px,7vmin,38px);font-weight:800;letter-spacing:.02em;line-height:1.2}
  h1 em{font-style:normal;color:var(--accent)}
  .sub{
    margin-top:10px;font-size:13.5px;line-height:1.8;
    color:var(--ink2);max-width:300px;
  }

  /* 形象选择 */
  #pickers{display:flex;gap:12px;margin:22px 0 0}
  .pick{
    width:82px;height:96px;border-radius:22px;
    border:2px solid var(--line);background:#fff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;transition:all .22s cubic-bezier(.34,1.56,.64,1);
    font-family:inherit;
  }
  .pick img{width:60px;height:44px;object-fit:contain;display:block}
  .pick span{
    font-size:12px;font-weight:800;letter-spacing:.10em;
    color:var(--ink3);line-height:1;transition:color .2s;
  }
  .pick.sel{
    border-color:var(--ink);
    transform:translateY(-4px);
    box-shadow:0 12px 24px rgba(20,16,14,.12);
  }
  .pick.sel span{color:var(--ink)}

  .btn{
    margin-top:18px;
    padding:15px 46px;border:none;border-radius:99px;
    font-size:16px;font-weight:700;letter-spacing:.05em;
    color:#fff;cursor:pointer;font-family:inherit;text-decoration:none;
    display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#FF9159,#FF6B35);
    box-shadow:0 10px 24px rgba(240,97,31,.28);
    transition:transform .16s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{
    background:#fff;color:var(--ink);font-weight:600;font-size:14.5px;
    border:1.5px solid var(--line);box-shadow:none;padding:13px 34px;
  }
  .btn.ghost:active{background:#FAF7F3}
  .btn[hidden]{display:none}

  /* ---------- 识别页（无白底，全屏实景 + 取景框） ---------- */
  #scanSheet{justify-content:center;gap:28px}
  #scanFrame{
    position:relative;
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:30px;
    border:1.5px solid rgba(255,255,255,.62);
    box-shadow:0 12px 38px rgba(20,16,14,.20), inset 0 0 34px rgba(20,16,14,.10);
    flex:0 0 auto;
  }
  #scanFrame i.c{
    position:absolute;width:32px;height:32px;
    border:3px solid #fff;border-radius:7px;
    filter:drop-shadow(0 1px 3px rgba(20,16,14,.42));
  }
  #scanFrame i.tl{top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  #scanFrame i.tr{top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
  #scanFrame i.bl{bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 14px}
  #scanFrame i.br{bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 14px 0}
  #scanLine{
    position:absolute;left:9%;right:9%;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,122,69,.95),transparent);
    animation:scanSweep 2.2s ease-in-out infinite;
  }
  @keyframes scanSweep{
    0%{top:12%;opacity:0}
    18%{opacity:1}
    82%{opacity:1}
    100%{top:88%;opacity:0}
  }
  .scanFoot{
    display:flex;flex-direction:column;align-items:center;
    width:100%;position:relative;z-index:2;
  }
  #scanBarWrap{
    width:min(62vmin,262px);height:5px;border-radius:99px;
    background:rgba(255,255,255,.42);
    box-shadow:0 1px 6px rgba(20,16,14,.18);
    overflow:hidden;
  }
  #scanBar{
    height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,#FFD24A,#FF6B35);
    transition:width .12s linear;
  }
  /* 识别页底部小字：已按要求去掉 */
  #scanDebug{display:none}
  #camFail{margin-top:18px}

  /* ---------- 结算 ---------- */
  #resultTitle{font-size:clamp(21px,5.6vmin,28px);font-weight:800}
  #resultStars{display:flex;gap:6px;justify-content:center;margin:14px 0 6px}
  #resultStars .rs{width:22px;height:22px}
  #resultStars .rs svg path{fill:#E2DCD4}
  #resultStars .rs.on svg path{fill:#FFAE18}
  #photoCard{
    width:min(300px,80vw);height:min(38vh,290px);
    margin:16px 0 2px;border-radius:20px;
    background:transparent;border:1.5px dashed #E6DFD6;
    display:grid;place-items:center;
    color:var(--ink3);font-size:12.5px;line-height:1.9;letter-spacing:.04em;
  }
  #photoCard.has-tpl{border-style:solid;border-color:transparent;overflow:hidden;padding:0}
  #photoCard.has-tpl img{width:100%;height:100%;object-fit:cover;display:block}
  #resultHint{
    margin-top:14px;font-size:12px;color:var(--ink3);letter-spacing:.03em;
  }

  /* ---------- 拍照 ---------- */
  #capHead{font-size:14px;color:var(--ink2);margin-bottom:14px;letter-spacing:.04em}
  #capStage{
    position:relative;width:min(368px,92vw);aspect-ratio:3/4;
    border-radius:22px;overflow:hidden;background:#fff;
    border:1.5px solid var(--line);
    box-shadow:0 18px 42px rgba(20,16,14,.12);
  }
  #capTemplate{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:none;
  }
  #capSlot{
    position:absolute;overflow:hidden;
    background:#F6F2EE;
    border:1.5px dashed #D8D0C6;
    display:grid;place-items:center;
  }
  #capSlot.has-tpl{border:none;background:#EFEAE4}
  /* 还没有合照模板时，照片位直接铺满，避免周围留一圈白边 */
  #capSlot.full{border:none;background:#EFEAE4}
  #capVideo{
    width:100%;height:100%;object-fit:cover;display:block;
    transform:scaleX(-1);
  }
  #capHint{
    position:absolute;top:8px;left:50%;transform:translateX(-50%);
    font-size:10.5px;color:var(--ink2);letter-spacing:.06em;
    padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.9);
    white-space:nowrap;
  }

  /* 拍照结果 */
  #shotTitle{font-size:19px;font-weight:800;margin-bottom:14px}
  #shotImg{
    max-width:min(340px,86vw);max-height:52vh;
    border-radius:16px;box-shadow:0 16px 38px rgba(20,16,14,.16);
    display:block;
  }
  #saveHint{margin-top:12px;font-size:11.5px;color:var(--ink3);letter-spacing:.03em}

  /* ---------- 杂项 ---------- */
  #arToggle{
    position:absolute;z-index:15;
    top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;
    width:40px;height:40px;border-radius:13px;
    border:1px solid var(--line);background:rgba(255,255,255,.9);
    color:var(--ink2);font-size:10px;font-weight:700;
    display:grid;place-items:center;cursor:pointer;letter-spacing:.06em;
    transition:all .2s;font-family:inherit;
    box-shadow:0 4px 12px rgba(20,16,14,.06);
  }
  #arToggle.on{background:var(--ink);border-color:var(--ink);color:#fff}
  body.playing #arToggle{opacity:.42}
  body:not(.playing) #arToggle{display:none}

  #toast{
    position:absolute;z-index:30;left:50%;bottom:14%;transform:translate(-50%,10px);
    padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;
    background:rgba(20,16,14,.86);color:#fff;
    opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #crash{
    position:absolute;z-index:99;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:10px 14px;border-radius:12px;
    background:rgba(214,58,48,.94);color:#fff;
    font-size:12px;line-height:1.55;word-break:break-all;
  }

  /* 矮屏（iPhone SE 等）压缩纵向占用 */
  @media (max-height: 660px){
    .eyebrow{margin-bottom:8px}
    h1{font-size:24px}
    .sub{font-size:12.5px;margin-top:6px;line-height:1.7}
    #pickers{margin-top:14px;gap:10px}
    .pick{width:70px;height:80px;border-radius:18px}
    .pick img{width:50px;height:36px}
    #scanFrame{width:min(56vmin,208px);height:min(56vmin,208px);border-radius:24px}
    #scanBarWrap{width:min(56vmin,208px)}
    .btn{padding:13px 38px;font-size:15px}
    #photoCard{height:min(34vh,200px)}
    #capStage{width:min(300px,74vw)}
    #shotImg{max-height:44vh}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="fallback"></div>
  <video id="cam" playsinline muted autoplay></video>
  <div id="camMask"></div>

  <canvas id="three"></canvas>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="slots"></div>
    <div id="tip">拖动屏幕移动小精灵</div>
  </div>

  <button id="arToggle" type="button">AR</button>
  <div id="toast"></div>

  <!-- 第一步：纯扫描（无白底，全屏实景 + 取景框） -->
  <div class="sheet clear" id="scanSheet">
    <div id="scanFrame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div id="scanLine"></div>
    </div>

    <div class="scanFoot">
      <div id="scanBarWrap"><div id="scanBar"></div></div>
      <div id="scanDebug">正在开启摄像头…</div>
      <button class="btn ghost" id="camFail" type="button" hidden>摄像头不可用 · 先直接体验</button>
    </div>
  </div>

  <!-- 第二步：扫描成功后进入 —— 接住星星 + 挑选角色 -->
  <div class="sheet light hide" id="intro">
    <div class="eyebrow">AR · 课程互动</div>
    <h1>接住<em>星星</em></h1>
    <p class="sub">拖动小精灵，躲开炸弹，收集星星解锁不同合照</p>

    <div id="pickers">
      <button class="pick sel" data-char="v" type="button">
        <img src="chars/v.png" alt="vv"><span>vv</span>
      </button>
      <button class="pick" data-char="a" type="button">
        <img src="chars/a.png" alt="aa"><span>aa</span>
      </button>
      <button class="pick" data-char="d" type="button">
        <img src="chars/d.png" alt="dd"><span>dd</span>
      </button>
    </div>

    <button class="btn" id="startBtn" type="button">开始游戏</button>
  </div>

  <!-- 结算 -->
  <div class="sheet light hide" id="result">
    <div id="resultTitle">收集完成</div>
    <div id="resultStars"></div>

    <div id="photoCard">合照模板<br>等待替换</div>

    <button class="btn" id="againBtn" type="button">再玩一次</button>
    <button class="btn ghost" id="shotBtn" type="button">去拍照</button>
    <div id="resultHint">星星收集数量越多，合照伙伴越多哟</div>
  </div>

  <!-- 拍照 -->
  <div class="sheet light hide" id="capture">
    <div id="capHead">调整一下位置，按下快门</div>
    <div id="capStage">
      <img id="capTemplate" alt="">
      <div id="capSlot"><video id="capVideo" playsinline muted autoplay></video><span id="capHint">照片位</span></div>
    </div>
    <button class="btn" id="shootBtn" type="button">拍照</button>
    <button class="btn ghost" id="capBack" type="button">返回</button>
  </div>

  <!-- 拍照结果 -->
  <div class="sheet light hide" id="shotSheet">
    <div id="shotTitle">拍好啦</div>
    <img id="shotImg" alt="合照">
    <a class="btn" id="saveBtn" download="合照.jpg">保存到相册</a>
    <div id="saveHint">没有弹出保存？长按上面的图片即可保存</div>
    <button class="btn ghost" id="shotDone" type="button">完成</button>
  </div>
</div>

<script>
/* 线上分享链接带 sharecode，网关只放行带该参数的请求；
   静态资源需要带上同一份参数，否则会被拦成 403。 */
(function(){
  var m = /[?&]sharecode=([^&]+)/.exec(location.search || '');
  window.ASSET_Q = m ? '?sharecode=' + m[1] : '';
})();
</script>
<script>
(function(){
'use strict';

/* =========================================================================
   1. 配置
   ========================================================================= */
const CONFIG = {
  starTotal: 5,
  firstStarDelay: 0.7,

  starGapFrom: 3.0,
  starGapTo:   2.0,
  starGapJitter: 0.4,

  starFallFrom: 2.75,
  starFallTo:   2.05,

  bombStartAfterStar: 2,
  bombGapFrom: 2.8,
  bombGapTo:   1.6,
  bombGapJitter: 0.4,
  bombFallFrom: 2.6,
  bombFallTo:   1.9,
  stunDuration: 1.45,

  // 炸弹贴着星星生成，形成夹击（概率与贴近度提高 = 更难）
  bombBesideChance: 0.95,
  bombBesideMin: 50,
  bombBesideMax: 92,
  bombDelayMin: 0.12,
  bombDelayMax: 0.32,

  followStiffness: 21,
  keySpeed: 720,
  spriteWidth: 96,
  spriteHeight: 116,
  groundRatio: 0.85,
  catchTolerance: 0.92,

  // 图像识别（黑色图形）
  scanNeed: 6,               // 连续命中帧数（约 0.4s）
  scanInterval: 0.07,        // 检测间隔（秒）
  scanMinContrast: 48,       // 画面最暗↔最亮的落差，低于此认为没有可用图形
  scanThresholdRatio: 0.42,  // 阈值落在暗部→亮部之间的位置（0=全暗，1=全亮）
  scanMinLum: 26,            // 阈值下限，防止全暗画面
  scanMaxLum: 132,           // 阈值上限，防止强光下把灰墙面算成黑
  scanMinAreaPct: 0.6,       // 候选块最小占画幅比例
  scanMaxAreaPct: 90,
  scanMinFill: 0.34,         // 包围盒填充率（实心度）
  scanMinSide: 8,            // 最小边像素（检测画布上）
  scanMinCount: 34,
  scanRequired: 3,           // 必须同时看到几个图形才开局（后续「单图形互动」改成 1 即可）
  scanSizeRatio: 2.2,        // 同组图形面积差上限（最大/最小）
  scanAlignTol: 0.95,        // 同组图形垂直错位上限（相对平均高度）
};

/* 三个形象：立体建模（FBX）+ 选项缩略图 + 名字 */
const CHARS = {
  v: { key:'v', name:'vv', img:'chars/v.png', model:'models/ip_01_heart_static.fbx', accent:'#4A9EFF' },
  a: { key:'a', name:'aa', img:'chars/a.png', model:'models/ip_02_bubble_static.fbx', accent:'#FF7A45' },
  d: { key:'d', name:'dd', img:'chars/d.png', model:'models/ip_03_leaf_static.fbx', accent:'#FF8FAB' },
};
const CHAR_IMG = {};

/* 合照模板：等用户给图后，把 src 换成图片路径，slot 是照片位在模板里的比例位置 */
const TEMPLATE = {
  src: null,                       // 例：'templates/vad.png'
  slot: { x:0.10, y:0.14, w:0.80, h:0.70 },
};

/* =========================================================================
   2. 基础
   ========================================================================= */
const cvs     = document.getElementById('game');
const ctx     = cvs.getContext('2d');
const stage   = document.getElementById('stage');
const slotsEl = document.getElementById('slots');
const tipEl   = document.getElementById('tip');
const scanEl  = document.getElementById('scanSheet');
const scanFrameEl = document.getElementById('scanFrame');
const introEl = document.getElementById('intro');
const resultEl= document.getElementById('result');
const capEl   = document.getElementById('capture');
const shotEl  = document.getElementById('shotSheet');
const arBtn   = document.getElementById('arToggle');
const toastEl = document.getElementById('toast');
const camEl   = document.getElementById('cam');
const scanBar = document.getElementById('scanBar');
const scanDbg = document.getElementById('scanDebug');
const camFailBtn = document.getElementById('camFail');

let W = 0, H = 0, S = 1, groundY = 0;

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rand  = (a,b) => a + Math.random() * (b - a);
const lerp  = (a,b,t) => a + (b - a) * t;
const damp  = (cur,target,speed,dt) => lerp(cur, target, 1 - Math.exp(-speed * dt));

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth;
  H = stage.clientHeight;
  cvs.width  = Math.round(W * dpr);
  cvs.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  S = clamp(Math.min(W / 390, H / 700), 0.72, 1.65);
  groundY = H * CONFIG.groundRatio;

  const sp = G.sprite;
  sp.h = CONFIG.spriteHeight * S;
  sp.w = sp.h * (R3.ready ? R3.aspect : SPRITE_ASPECT);
  sp.y = groundY;
  sp.x  = clamp(sp.x  || W / 2, sp.w * 0.5 + 6 * S, W - sp.w * 0.5 - 6 * S);
  sp.tx = clamp(sp.tx || W / 2, sp.w * 0.5 + 6 * S, W - sp.w * 0.5 - 6 * S);

  updateR3Layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 180));

const SPRITE_ASPECT = 2995 / 2363;   // 三张角色图的统一宽高比

/* =========================================================================
   3. 状态
   ========================================================================= */
const G = {
  state: 'scan',            // scan | intro | playing | over | capture
  char: 'v',
  t: 0,
  score: 0,
  hits: 0,
  spawned: 0,
  resolved: 0,
  nextStarIn: 0,
  nextBombIn: 0,
  bombArmed: false,
  endDelay: -1,
  shake: 0,
  stun: 0,
  items: [],
  particles: [],
  ripples: [],
  sprite: { x: 0, y: 0, w: 96, h: 116, tx: 0, mood: 'idle', moodT: 0 },
};
const ANIM = { t: 0, bounce: 0, sink: 0 };

/* =========================================================================
   3.5 立体形象（three.js + FBX）
   ========================================================================= */
const R3 = {
  ok: false, ready: false,
  renderer: null, scene: null, camera: null, group: null,
  visH: 1, visW: 1,
  aspect: 2995 / 2363,
  currentKey: null,
  anim: { t: 0, bounce: 0, sink: 0 },
};
const modelCache = {};
let threeLoading = null;

function loadThreeScript(){
  if(threeLoading) return threeLoading;
  threeLoading = new Promise(resolve => {
    if(window.THREE && window.FBXLoader){ resolve(true); return; }
    const s = document.createElement('script');
    s.src = 'vendor/three-fbx.min.js' + (window.ASSET_Q || '');
    s.async = true;
    s.onload  = () => resolve(!!(window.THREE && window.FBXLoader));
    s.onerror = () => resolve(false);
    document.head.appendChild(s);
  });
  return threeLoading;
}

function initR3(){
  if(!window.THREE || R3.ok) return R3.ok;
  try{
    const canvas = document.getElementById('three');
    R3.renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true, powerPreference:'high-performance' });
  }catch(e){ return false; }

  R3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  if('outputColorSpace' in R3.renderer) R3.renderer.outputColorSpace = THREE.SRGBColorSpace;
  R3.renderer.setClearAlpha(0);

  R3.scene  = new THREE.Scene();
  R3.camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  R3.camera.position.set(0, 0, 6);
  R3.camera.lookAt(0, 0, 0);

  /* 光从正面偏上来，给一点侧面补光：既能看出体积，又不会把材质组的接缝照成硬线 */
  R3.scene.add(new THREE.AmbientLight(0xffffff, 1.05));
  const key  = new THREE.DirectionalLight(0xffffff, 2.15); key.position.set(1.1, 2.0, 5.2);  R3.scene.add(key);
  const side = new THREE.DirectionalLight(0xffffff, 0.95); side.position.set(-2.6, 0.6, 2.6); R3.scene.add(side);

  R3.group = new THREE.Group();
  R3.scene.add(R3.group);

  R3.ok = true;
  updateR3Layout();
  return true;
}

function updateR3Layout(){
  if(!R3.ok) return;
  R3.renderer.setSize(W, H, false);
  R3.camera.aspect = W / Math.max(H, 1);
  R3.camera.updateProjectionMatrix();
  const fovRad = R3.camera.fov * Math.PI / 180;
  R3.visH = 2 * Math.tan(fovRad / 2) * R3.camera.position.z;
  R3.visW = R3.visH * R3.camera.aspect;
}

function loadModel(key){
  return new Promise(resolve => {
    if(modelCache[key]){ applyModel(key); resolve(true); return; }
    if(!R3.ok || !window.FBXLoader){ resolve(false); return; }

    const loader = new FBXLoader();
    loader.load(CHARS[key].model + (window.ASSET_Q || ''), obj => {
      const box    = new THREE.Box3().setFromObject(obj);
      const size   = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);

      // 归一化：高度 = 1，底部落在 y=0，水平居中
      const s = 1 / Math.max(size.y, 1e-6);
      obj.scale.setScalar(s);
      obj.position.set(-center.x * s, -box.min.y * s, -center.z * s);

      obj.traverse(o => {
        if(o.isMesh){
          o.frustumCulled = false;
          o.castShadow = false; o.receiveShadow = false;

          /* FBX 里一个 mesh 带 3 套材质 / 7 个 group（身体 + 眼睛 + 高光）。
             逐组转成统一的 Standard 材质，但保留各组自己的颜色，避免眼睛被涂黑。 */
          const srcArr = Array.isArray(o.material) ? o.material : [o.material];
          const conv = src => {
            const base = src && src.color ? src.color.clone() : new THREE.Color(0x14100E);
            const lum = base.r * 0.299 + base.g * 0.587 + base.b * 0.114;
            // 只有接近纯黑的身体才抬亮度，眼睛/高光这类浅色原样保留
            if(lum < 0.12){
              base.r = Math.min(1, base.r * 2.0 + 0.018);
              base.g = Math.min(1, base.g * 2.0 + 0.016);
              base.b = Math.min(1, base.b * 2.0 + 0.020);
            }
            const mtl = new THREE.MeshStandardMaterial({
              color: base,
              roughness: 0.74,
              metalness: 0.02,
            });
            if(src && src.map){ mtl.map = src.map; mtl.needsUpdate = true; }
            return mtl;
          };
          o.material = Array.isArray(o.material) ? srcArr.map(conv) : conv(srcArr[0]);
        }
      });

      const holder = new THREE.Group();
      holder.add(obj);
      modelCache[key] = { holder, aspect: size.x / Math.max(size.y, 1e-6) };
      applyModel(key);
      resolve(true);
    }, undefined, () => resolve(false));
  });
}

function applyModel(key){
  const c = modelCache[key];
  if(!c || !R3.group) return;
  while(R3.group.children.length) R3.group.remove(R3.group.children[0]);
  R3.group.add(c.holder);
  R3.currentKey = key;
  R3.aspect = c.aspect;
  R3.ready = true;

  // 判定盒宽度跟模型宽高比对齐
  const sp = G.sprite;
  sp.h = CONFIG.spriteHeight * S;
  sp.w = sp.h * R3.aspect;
  sp.x  = clamp(sp.x,  sp.w * 0.5 + 6 * S, W - sp.w * 0.5 - 6 * S);
  sp.tx = clamp(sp.tx, sp.w * 0.5 + 6 * S, W - sp.w * 0.5 - 6 * S);
}

function syncR3(dt){
  if(!R3.ok || !R3.ready) return;

  // 只在游戏进行中登场（扫描页 / 选择页 / 拍照页都不显示）
  const visible = (G.state === 'playing');
  R3.group.visible = visible;
  if(!visible){
    R3.renderer.render(R3.scene, R3.camera);
    return;
  }

  const sp = G.sprite, a = R3.anim;
  a.t += dt;
  a.bounce = damp(a.bounce, 0, 6, dt);
  a.sink   = damp(a.sink,   0, 5, dt);

  const wx = (sp.x / W - 0.5) * R3.visW;
  const wy = (0.5 - sp.y / H) * R3.visH;
  const hW = (sp.h / H) * R3.visH;

  const t = a.t;
  let yOff   = Math.sin(t * 2.1) * 0.011 * hW;
  let rotZ   = Math.sin(t * 1.1) * 0.020;
  let rotY   = Math.sin(t * 0.75) * 0.10;
  let scaleM = 1;

  if(sp.mood === 'happy'){
    yOff   += a.bounce * 0.34 * hW;
    scaleM += a.bounce * 0.07;
    rotZ   += Math.sin(t * 26) * 0.05 * a.bounce;
  } else if(sp.mood === 'sad'){
    yOff   -= a.sink * 0.05 * hW;
    scaleM -= a.sink * 0.055;
  }

  if(G.stun > 0){
    const k = clamp(G.stun / CONFIG.stunDuration, 0, 1);
    rotZ += Math.sin(t * 31) * 0.17 * k;
    yOff += Math.sin(t * 44) * 0.011 * hW * k;
    rotY += Math.sin(t * 13) * 0.40 * k;
  }

  R3.group.position.set(wx, wy + yOff, 0);
  R3.group.rotation.set(0, rotY, rotZ);
  R3.group.scale.setScalar(hW * scaleM);

  R3.renderer.render(R3.scene, R3.camera);
}

/* three 还没加载完时先记下来，加载完再补 */
let pendingChar = null;
function preloadModel(key){
  if(!R3.ok){ pendingChar = key; return; }
  if(modelCache[key]){ applyModel(key); return; }
  loadModel(key);
}

/* =========================================================================
   4. 音效
   ========================================================================= */
let AC = null;
function ensureAudio(){
  if(!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended') AC.resume();
}
function tone(o){
  if(!AC) return;
  const { freq=440, to=null, dur=.12, type='sine', gain=.06, delay=0 } = o || {};
  const t0 = AC.currentTime + delay;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(AC.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noiseBurst(dur=.3, gain=.12){
  if(!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.4);
  const src = AC.createBufferSource(); src.buffer = buf;
  const flt = AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 1100;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(flt).connect(g).connect(AC.destination);
  src.start();
}
const SFX = {
  catchStar(){ tone({freq:880,to:1320,dur:.13,gain:.065}); tone({freq:1320,to:1760,dur:.11,gain:.05,delay:.055}); },
  bomb(){ noiseBurst(.34,.16); tone({freq:150,to:48,dur:.32,type:'sawtooth',gain:.09}); },
  miss(){ tone({freq:300,to:170,dur:.16,type:'triangle',gain:.05}); },
  lock(){ tone({freq:660,dur:.12,gain:.06}); tone({freq:990,dur:.18,gain:.06,delay:.10}); tone({freq:1320,dur:.28,gain:.05,delay:.22}); },
  win(){ [523,659,784,1046].forEach((f,i)=>tone({freq:f,dur:.5,gain:.05,delay:i*.09,type:'triangle'})); },
  shutter(){ noiseBurst(.06,.10); tone({freq:1600,to:900,dur:.07,gain:.05,type:'square'}); },
};

/* =========================================================================
   5. 生成
   ========================================================================= */
const progress = () => clamp(G.spawned / CONFIG.starTotal, 0, 1);
const starFallTime = () => lerp(CONFIG.starFallFrom, CONFIG.starFallTo, progress());
const bombFallTime = () => lerp(CONFIG.bombFallFrom, CONFIG.bombFallTo, progress());

function spawnStar(){
  const r = 21 * S;
  const margin = r + 26 * S;
  const x = rand(margin, W - margin);
  G.items.push({
    kind:'star', x, y:-r, r,
    vy: (groundY + r) / starFallTime(),
    rot: rand(0, Math.PI*2), vr: rand(-2.4, 2.4), born:0,
  });
  if(G.spawned >= CONFIG.bombStartAfterStar){
    G.nextBombIn = Math.min(G.nextBombIn, rand(CONFIG.bombDelayMin, CONFIG.bombDelayMax));
    G.bombArmed = true;
  }
}

function spawnBomb(){
  const r = 19 * S;
  const margin = r + 26 * S;
  let x = null;

  if(G.bombArmed && Math.random() < CONFIG.bombBesideChance){
    let ref = null;
    for(let i = G.items.length - 1; i >= 0; i--){
      if(G.items[i].kind === 'star'){ ref = G.items[i]; break; }
    }
    if(ref){
      const side = Math.random() < 0.5 ? -1 : 1;
      const off  = rand(CONFIG.bombBesideMin, CONFIG.bombBesideMax) * S;
      x = ref.x + side * off;
    }
  }
  if(x === null || x < margin || x > W - margin){
    // 兜底随机也要避开星星，别正好叠在星星身上变成躲不掉的必死位
    let tries = 0;
    do{
      x = rand(margin, W - margin);
      tries++;
    } while(tries < 8 && G.items.some(it => it.kind === 'star' && Math.abs(it.x - x) < (it.r + r) * 1.15));
  }
  G.bombArmed = false;

  G.items.push({
    kind:'bomb', x, y:-r, r,
    vy: (groundY + r) / bombFallTime(),
    rot: rand(0, Math.PI*2), vr: rand(-1.4, 1.4), born:0,
  });
}

/* =========================================================================
   6. 粒子
   ========================================================================= */
function burst(x, y, color, count, power){
  for(let i=0;i<count;i++){
    const a = rand(0, Math.PI*2), sp = rand(power*.35, power);
    G.particles.push({
      x, y,
      vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - power*.35,
      life: rand(.4,.85), max:.85,
      r: rand(1.8,4.6)*S, color,
    });
  }
}
function ripple(x, y, color){
  G.ripples.push({ x, y, r:6*S, max:34*S, life:.5, maxLife:.5, color });
}

/* =========================================================================
   7. 输入
   ========================================================================= */
const input = { dragging: false, offset: 0, keys: {} };

function pointerPos(e){
  const rect = cvs.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function moveTo(x){
  const sp = G.sprite;
  sp.tx = clamp(x, sp.w*0.5 + 6*S, W - sp.w*0.5 - 6*S);
}

cvs.addEventListener('pointerdown', e => {
  if(G.state !== 'playing') return;
  e.preventDefault();
  ensureAudio();
  input.dragging = true;
  try { cvs.setPointerCapture(e.pointerId); } catch(err){}

  const p = pointerPos(e), sp = G.sprite;
  const onSprite = Math.abs(p.x - sp.x) < sp.w*0.55 &&
                   p.y > sp.y - sp.h*1.15 && p.y < sp.y + sp.h*0.35;
  input.offset = onSprite ? (p.x - sp.tx) : 0;
  moveTo(p.x - input.offset);
});

cvs.addEventListener('pointermove', e => {
  if(!input.dragging) return;
  e.preventDefault();
  moveTo(pointerPos(e).x - input.offset);
});

function endDrag(){ input.dragging = false; }
cvs.addEventListener('pointerup', endDrag);
cvs.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', e => { input.keys[e.key] = true; });
window.addEventListener('keyup',   e => { input.keys[e.key] = false; });

function updateKeys(dt){
  const k = input.keys;
  const left  = k['ArrowLeft']  || k['a'] || k['A'];
  const right = k['ArrowRight'] || k['d'] || k['D'];
  if(!left && !right) return;
  moveTo(G.sprite.tx + (right ? 1 : -1) * CONFIG.keySpeed * S * dt);
}

/* =========================================================================
   8. 更新
   ========================================================================= */
function setMood(m, dur){
  G.sprite.mood = m;
  G.sprite.moodT = dur;
  if(m === 'happy') ANIM.bounce = 1;
  if(m === 'sad')   ANIM.sink = 1;
}

function updateSprite(dt){
  const sp = G.sprite;
  if(G.stun > 0){
    G.stun -= dt;
    sp.mood = 'stun';
    sp.moodT = 0;
    if(G.stun <= 0) tipEl.textContent = '眩晕结束，继续接星星';
  } else {
    updateKeys(dt);
    sp.x = lerp(sp.x, sp.tx, 1 - Math.exp(-CONFIG.followStiffness * dt));
    if(sp.moodT > 0){
      sp.moodT -= dt;
      if(sp.moodT <= 0) sp.mood = 'idle';
    } else {
      sp.mood = 'idle';
    }
  }
}

function hitSprite(it){
  const sp = G.sprite;
  const rx = sp.x - sp.w * 0.44;
  const ry = sp.y - sp.h * 0.94;
  const rw = sp.w * 0.88;
  const rh = sp.h * 0.98;
  const nx = clamp(it.x, rx, rx + rw);
  const ny = clamp(it.y, ry, ry + rh);
  const dx = it.x - nx, dy = it.y - ny;
  return (dx*dx + dy*dy) < Math.pow(it.r * CONFIG.catchTolerance, 2);
}

function updateItems(dt){
  for(let i = G.items.length - 1; i >= 0; i--){
    const it = G.items[i];
    it.born += dt;
    it.y += it.vy * dt;
    it.rot += it.vr * dt;

    if(it.y - it.r > groundY + 30*S){ G.items.splice(i,1); continue; }

    if(hitSprite(it)){
      G.items.splice(i,1);
      if(it.kind === 'star') onCatch(it); else onBomb(it);
      continue;
    }

    if(it.y > groundY - it.r*0.2){
      if(it.kind === 'star'){
        onMiss(it);
        G.items.splice(i,1);
      }
    }
  }
}

function onCatch(it){
  G.score++; G.resolved++;
  setMood('happy', 0.72);
  burst(it.x, it.y, '#FFC24A', 16, 260*S);
  burst(it.x, it.y, '#FFF3C4', 8, 180*S);
  ripple(it.x, groundY, 'rgba(255,194,74,.9)');
  SFX.catchStar();
  renderSlots();
  if(G.score === 1) tipEl.textContent = '接得漂亮，继续';
  if(G.score === 3) tipEl.textContent = '还差 ' + (CONFIG.starTotal - G.score) + ' 颗';
}

function onBomb(it){
  G.hits++;
  G.stun = CONFIG.stunDuration;
  G.shake = Math.max(G.shake, 1);
  setMood('stun', CONFIG.stunDuration);
  burst(it.x, it.y, '#FF7A45', 22, 340*S);
  burst(it.x, it.y, '#5A4A3A', 12, 200*S);
  ripple(it.x, groundY, 'rgba(255,122,69,.9)');
  SFX.bomb();
  tipEl.textContent = '被炸晕了，等一下';
}

function onMiss(it){
  G.resolved++;
  setMood('sad', 0.85);
  ripple(it.x, groundY, 'rgba(255,255,255,.5)');
  SFX.miss();
  renderSlots();
}

function updateParticles(dt){
  for(let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.life -= dt;
    if(p.life <= 0){ G.particles.splice(i,1); continue; }
    p.vy += 900 * S * dt;
    p.vx *= (1 - 1.6*dt);
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for(let i = G.ripples.length - 1; i >= 0; i--){
    const r = G.ripples[i];
    r.life -= dt;
    if(r.life <= 0){ G.ripples.splice(i,1); continue; }
    r.r = lerp(r.r, r.max, 1 - Math.exp(-7*dt));
  }
}

function updateTimers(dt){
  G.t += dt;

  if(G.spawned < CONFIG.starTotal){
    G.nextStarIn -= dt;
    if(G.nextStarIn <= 0){
      spawnStar();
      G.spawned++;
      const gap = lerp(CONFIG.starGapFrom, CONFIG.starGapTo, progress()) + rand(-1,1)*CONFIG.starGapJitter;
      G.nextStarIn = Math.max(1.2, gap);
    }
  }

  if(G.spawned >= CONFIG.bombStartAfterStar){
    G.nextBombIn -= dt;
    if(G.nextBombIn <= 0){
      spawnBomb();
      const gap = lerp(CONFIG.bombGapFrom, CONFIG.bombGapTo, progress()) + rand(-1,1)*CONFIG.bombGapJitter;
      G.nextBombIn = Math.max(1.0, gap);
    }
  }

  if(G.resolved >= CONFIG.starTotal){
    const inAir = G.items.some(it => it.kind === 'star');
    if(!inAir){
      if(G.endDelay < 0) G.endDelay = 0.85;
      G.endDelay -= dt;
      if(G.endDelay <= 0 && G.state === 'playing') gameOver();
    }
  }
}

/* =========================================================================
   9. 绘制
   ========================================================================= */
function roundRect(c,x,y,w,h,r){
  r = Math.min(r, w*0.5, h*0.5);
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

function starPath(c,cx,cy,R,inner,rot){
  c.beginPath();
  for(let i = 0; i < 10; i++){
    const a = rot + i * Math.PI / 5 - Math.PI / 2;
    const rr = (i % 2) ? inner : R;
    const px = cx + Math.cos(a) * rr;
    const py = cy + Math.sin(a) * rr;
    if(i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

function drawGround(){
  const g = ctx.createRadialGradient(G.sprite.x, groundY + 6*S, 8*S, G.sprite.x, groundY + 6*S, W*0.52);
  g.addColorStop(0, 'rgba(255,225,190,.34)');
  g.addColorStop(.45, 'rgba(255,215,175,.12)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, groundY - 60*S, W, H - groundY + 60*S);
}

function drawItem(it){
  const t = clamp(1 - (groundY - it.y)/(H*0.75), 0.18, 1);
  ctx.save();
  ctx.globalAlpha = 0.16 * t;
  ctx.fillStyle = '#2A2018';
  ctx.beginPath();
  ctx.ellipse(it.x, groundY + 4*S, it.r*(0.55 + t*0.5), it.r*(0.16 + t*0.14), 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const pop = it.born < 0.22 ? it.born/0.22 : 1;

  if(it.kind === 'star'){
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(pop,pop);
    ctx.rotate(it.rot);

    const glow = ctx.createRadialGradient(0,0,it.r*.3, 0,0,it.r*2.1);
    glow.addColorStop(0,'rgba(255,200,80,.55)');
    glow.addColorStop(1,'rgba(255,200,80,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,it.r*2.1,0,Math.PI*2); ctx.fill();

    const grd = ctx.createLinearGradient(0,-it.r,0,it.r);
    grd.addColorStop(0,'#FFE9A8');
    grd.addColorStop(.5,'#FFC24A');
    grd.addColorStop(1,'#FF8A2B');
    starPath(ctx,0,0,it.r,it.r*0.46,0);
    ctx.fillStyle = grd; ctx.fill();
    ctx.lineWidth = 1.4*S;
    ctx.strokeStyle = 'rgba(255,255,255,.75)';
    ctx.stroke();

    ctx.globalAlpha = .8;
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath();
    ctx.ellipse(-it.r*.22,-it.r*.3, it.r*.16, it.r*.1, -.6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(pop,pop);

    const pulse = 0.5 + 0.5*Math.sin(it.born*9);
    const glow = ctx.createRadialGradient(0,0,it.r*.4, 0,0,it.r*2);
    glow.addColorStop(0, 'rgba(255,90,60,' + (0.22 + pulse*0.18) + ')');
    glow.addColorStop(1, 'rgba(255,90,60,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,it.r*2,0,Math.PI*2); ctx.fill();

    ctx.rotate(it.rot*.25);
    const grd = ctx.createRadialGradient(-it.r*.3,-it.r*.35,it.r*.1, 0,0,it.r*1.15);
    grd.addColorStop(0,'#5C5566');
    grd.addColorStop(.55,'#2A2431');
    grd.addColorStop(1,'#14101B');
    ctx.beginPath(); ctx.arc(0,0,it.r,0,Math.PI*2);
    ctx.fillStyle = grd; ctx.fill();
    ctx.lineWidth = 1.2*S;
    ctx.strokeStyle = 'rgba(255,255,255,.22)';
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,.3)';
    ctx.beginPath();
    ctx.ellipse(-it.r*.34,-it.r*.36, it.r*.2, it.r*.13, -.7, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(it.r*.34, -it.r*.86);
    ctx.quadraticCurveTo(it.r*.92, -it.r*1.5, it.r*.5, -it.r*1.9);
    ctx.lineWidth = 2.2*S;
    ctx.strokeStyle = '#B08A5A';
    ctx.lineCap = 'round';
    ctx.stroke();

    const spr = it.r*(0.22 + pulse*0.16);
    const sg = ctx.createRadialGradient(it.r*.5,-it.r*1.95,0, it.r*.5,-it.r*1.95,spr*3.4);
    sg.addColorStop(0,'rgba(255,240,180,1)');
    sg.addColorStop(.35,'rgba(255,140,60,.85)');
    sg.addColorStop(1,'rgba(255,90,40,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(it.r*.5,-it.r*1.95,spr*3.4,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* 形象本体：3D 就绪时交给 three 渲染，这里只画地面阴影、平面兜底、眩晕星星 */
function drawSprite2D(){
  const sp = G.sprite;
  const w = sp.w, h = sp.h;
  const top = sp.y - h;

  ctx.save();
  const shG = ctx.createRadialGradient(sp.x, sp.y + 7*S, 2, sp.x, sp.y + 7*S, w*0.48);
  shG.addColorStop(0, 'rgba(30,22,16,.30)');
  shG.addColorStop(1, 'rgba(30,22,16,0)');
  ctx.fillStyle = shG;
  ctx.beginPath();
  ctx.ellipse(sp.x, sp.y + 7*S, w*0.48, w*0.13, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  const img = CHAR_IMG[G.char];

  // 3D 未就绪（或加载失败）时用平面图顶上，避免精灵消失
  if(!R3.ready){
    const t = ANIM.t;
    let dy = Math.sin(t * 2.1) * 0.010 * h;
    let sc = 1 + Math.sin(t * 2.1 + 1.2) * 0.008;
    let rot = Math.sin(t * 1.1) * 0.014;

    if(sp.mood === 'happy'){
      dy  -= ANIM.bounce * 0.30 * h;
      sc  += ANIM.bounce * 0.075;
      rot += Math.sin(t * 26) * 0.05 * ANIM.bounce;
    } else if(sp.mood === 'sad'){
      dy  += ANIM.sink * 0.035 * h;
      sc  -= ANIM.sink * 0.055;
    }
    if(G.stun > 0){
      const k = clamp(G.stun / CONFIG.stunDuration, 0, 1);
      rot += Math.sin(t * 31) * 0.16 * k;
      dy  += Math.sin(t * 44) * 0.010 * h * k;
    }

    ctx.save();
    ctx.translate(sp.x, sp.y + dy);
    ctx.rotate(rot);
    ctx.scale(sc, sc);

    if(img && img.complete && img.naturalWidth){
      ctx.shadowColor = 'rgba(255,255,255,.55)';
      ctx.shadowBlur = 16 * S;
      ctx.drawImage(img, -w/2, -h, w, h);
      ctx.shadowBlur = 0;
      ctx.drawImage(img, -w/2, -h, w, h);
    } else {
      ctx.fillStyle = '#1A1512';
      roundRect(ctx, -w/2, -h, w, h, w*0.28);
      ctx.fill();
    }
    ctx.restore();
  }

  if(G.stun > 0){
    for(let i=0;i<3;i++){
      const a = G.t*6 + i*Math.PI*2/3;
      const rr = w*0.42;
      const px = sp.x + Math.cos(a)*rr;
      const py = top - 5*S + Math.sin(a)*rr*0.26;
      ctx.save();
      ctx.globalAlpha = .9;
      starPath(ctx, px, py, 6*S, 2.6*S, a);
      ctx.fillStyle = '#FFD166';
      ctx.fill();
      ctx.restore();
    }
  }
}

function drawParticles(){
  G.ripples.forEach(r => {
    const a = clamp(r.life / r.maxLife, 0, 1);
    ctx.save();
    ctx.globalAlpha = a * .7;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2.2*S*a;
    ctx.beginPath();
    ctx.ellipse(r.x, r.y, r.r*1.7, r.r*0.42, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  });
  G.particles.forEach(p => {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r*(0.4 + a*0.8), 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });
}

function render(){
  ctx.clearRect(0, 0, W, H);
  // 识别 / 选择 / 拍照阶段画布留空，取景框里只显示摄像头画面
  if(G.state === 'scan' || G.state === 'intro' || G.state === 'capture') return;
  ctx.save();
  if(G.shake > 0){
    const m = G.shake * 12 * S;
    ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
  }
  drawGround();
  G.items.forEach(drawItem);
  drawSprite2D();
  drawParticles();
  ctx.restore();
}

/* =========================================================================
   10. 图像识别
   ========================================================================= */
const SCAN = { canvas:null, ctx:null, hits:0, timer:0, running:false };
const SCAN_SIZE = 168;        // 检测画布边长（取景框内的画面按这个尺寸重采样）

function initScan(){
  SCAN.canvas = document.createElement('canvas');
  SCAN.canvas.width  = SCAN_SIZE;
  SCAN.canvas.height = SCAN_SIZE;
  SCAN.ctx = SCAN.canvas.getContext('2d', { willReadFrequently: true });
}

/* 取景框对应的视频源矩形（把 object-fit: cover 的裁切反算回去） */
function frameSourceRect(){
  const v = camEl;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const sw = W / sc, sh = H / sc;         // 视频中实际可见部分的宽高（视频像素）
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const kx = sw / W, ky = sh / H;         // 屏幕像素 → 视频像素

  const r = scanFrameEl.getBoundingClientRect();
  let fw = Math.max(12, r.width * kx);
  let fh = Math.max(12, r.height * ky);
  let vx = sx + r.left * kx;
  let vy = sy + r.top * ky;

  if(vx < 0){ fw += vx; vx = 0; }
  if(vy < 0){ fh += vy; vy = 0; }
  if(vx + fw > vw) fw = vw - vx;
  if(vy + fh > vh) fh = vh - vy;
  return { vx, vy, fw: Math.max(12, fw), fh: Math.max(12, fh) };
}

/* 抓一帧"取景框里实际可见的画面"，按固定边长重采样 */
function grabFrame(){
  const v = camEl;
  if(!v || v.readyState < 2 || !v.videoWidth || !v.videoHeight) return false;

  if(SCAN.canvas.width !== SCAN_SIZE || SCAN.canvas.height !== SCAN_SIZE){
    SCAN.canvas.width = SCAN_SIZE;
    SCAN.canvas.height = SCAN_SIZE;
  }
  const { vx, vy, fw, fh } = frameSourceRect();
  SCAN.ctx.drawImage(v, vx, vy, fw, fh, 0, 0, SCAN_SIZE, SCAN_SIZE);
  return true;
}

function analyzeMarker(){
  const S = SCAN_SIZE, total = S * S;
  const img = SCAN.ctx.getImageData(0, 0, S, S).data;

  /* ---- 1. 亮度直方图，用自适应阈值代替写死的绝对黑度 ---- */
  const lum  = new Uint8Array(total);
  const hist = new Uint32Array(256);
  for(let i = 0; i < total; i++){
    const si = i * 4;
    const L = (0.299*img[si] + 0.587*img[si+1] + 0.114*img[si+2]) | 0;
    lum[i] = L;
    hist[L]++;
  }
  const quantile = q => {
    let acc = 0;
    const need = total * q;
    for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= need) return v; }
    return 255;
  };
  const dark0 = quantile(0.015);     // 暗部参考
  const bright = quantile(0.90);     // 亮部参考
  const contrast = bright - dark0;

  if(contrast < CONFIG.scanMinContrast){
    return { ok:false, found:0, darkPct:0, contrast, th:0, why:'' };
  }

  const th = clamp(
    Math.round(dark0 + contrast * CONFIG.scanThresholdRatio),
    CONFIG.scanMinLum, CONFIG.scanMaxLum
  );

  const mask = new Uint8Array(total);
  let darkCount = 0;
  for(let i = 0; i < total; i++){
    if(lum[i] < th){ mask[i] = 1; darkCount++; }
  }

  const darkPct = darkCount / total * 100;
  if(darkCount < CONFIG.scanMinCount || darkPct > CONFIG.scanMaxAreaPct){
    return { ok:false, found:0, darkPct, contrast, th, why:'' };
  }

  /* ---- 2. 连通域，宽松几何筛 ---- */
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const cands = [];

  for(let i = 0; i < total; i++){
    if(!mask[i] || visited[i]) continue;

    let sp = 0;
    stack[sp++] = i;
    visited[i] = 1;
    let count = 0;
    let minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;

    while(sp > 0){
      const p = stack[--sp];
      const px = p % S, py = (p - px) / S;
      count++;
      if(px < minX) minX = px;
      if(px > maxX) maxX = px;
      if(py < minY) minY = py;
      if(py > maxY) maxY = py;

      if(px > 0){ const q = p - 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(px < S-1){ const q = p + 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py > 0){ const q = p - S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py < S-1){ const q = p + S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
    }

    if(count < CONFIG.scanMinCount) continue;

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    const ar = bw / bh;
    const fill = count / (bw * bh);
    const areaPct = count / total * 100;

    if(bw < CONFIG.scanMinSide || bh < CONFIG.scanMinSide) continue;
    if(ar < 0.42 || ar > 2.6) continue;
    if(fill < CONFIG.scanMinFill) continue;
    if(areaPct < CONFIG.scanMinAreaPct) continue;

    // 整幅都被判定为暗块 → 多半是把镜头挡住了，不算图形
    if(bw > S * 0.97 && bh > S * 0.97) continue;

    cands.push({ areaPct, ar, fill, w: bw, h: bh, cx:(minX + maxX)/2, cy:(minY + maxY)/2 });
  }

  /* ---- 3. 必须同时凑齐 scanRequired 个"尺寸相近、排成一行"的图形 ---- */
  SCAN.lastCands = cands;
  const need = CONFIG.scanRequired;
  if(cands.length < need){
    return { ok:false, found:cands.length, need, darkPct, contrast, th, why:'' };
  }

  // 候选太多时只留最大的几个，避免组合爆炸
  const pool = cands.slice().sort((a, b) => b.areaPct - a.areaPct).slice(0, 8);

  const groupOK = g => {
    const areas = g.map(c => c.areaPct);
    if(Math.max(...areas) / Math.min(...areas) > CONFIG.scanSizeRatio) return false;

    // 三个图形可以横排（正常）也可以竖排（手机转 90°），两种都接受
    const layoutOK = horizontal => {
      const cross = horizontal ? 'cy' : 'cx';    // 需要对齐的方向
      const along = horizontal ? 'cx' : 'cy';    // 需要分开的方向
      const crossSize = horizontal ? 'h' : 'w';  // 判断对齐用的边
      const alongSize = horizontal ? 'w' : 'h';  // 判断间隙用的边

      const avg  = g.reduce((s, c) => s + c[crossSize], 0) / g.length;
      const vals = g.map(c => c[cross]);
      if(Math.max(...vals) - Math.min(...vals) > avg * CONFIG.scanAlignTol) return false;

      const seq = g.slice().sort((a, b) => a[along] - b[along]);
      for(let i = 1; i < seq.length; i++){
        const gap = seq[i][along] - seq[i-1][along];
        if(gap < (seq[i][alongSize] + seq[i-1][alongSize]) * 0.5 * 0.85) return false;  // 两个块不能粘在一起
      }
      return true;
    };

    return layoutOK(true) || layoutOK(false);
  };

  let ok = false;
  const pick = [];
  const dfs = (start, depth) => {
    if(ok) return;
    if(depth === need){
      if(groupOK(pick.map(i => pool[i]))) ok = true;
      return;
    }
    for(let i = start; i < pool.length; i++){
      pick.push(i);
      dfs(i + 1, depth + 1);
      pick.pop();
      if(ok) return;
    }
  };
  dfs(0, 0);

  if(!ok){
    return { ok:false, found:cands.length, need, darkPct, contrast, th, why:'' };
  }

  return { ok:true, found:cands.length, need, darkPct, contrast, th,
           why:'已看到 ' + need + ' 个图形' };
}

function updateScan(dt){
  if(!SCAN.running) return;
  SCAN.timer -= dt;
  if(SCAN.timer > 0) return;
  SCAN.timer = CONFIG.scanInterval;

  if(!grabFrame()){
    scanDbg.textContent = '等待摄像头…';
    return;
  }
  const r = analyzeMarker();

  if(r.ok){
    SCAN.hits++;
    if(SCAN.hits >= CONFIG.scanNeed){
      SCAN.hits = CONFIG.scanNeed;
      onScanSuccess();
    }
  } else {
    SCAN.hits = Math.max(0, SCAN.hits - 1);
  }

  scanBar.style.width = Math.round(SCAN.hits / CONFIG.scanNeed * 100) + '%';

  const debugOn = /[?&]debug=1/.test(location.search || '');
  const need = r.need || 3;
  const seen = Math.min(r.found || 0, need);
  if(r.ok){
    scanDbg.textContent = '识别到三个图形，马上开始';
  } else if(debugOn){
    scanDbg.textContent = '搜索中 · 看到 ' + seen + '/' + need
      + ' · 对比 ' + Math.round(r.contrast || 0) + ' · 阈值 ' + Math.round(r.th || 0)
      + ' · 暗 ' + r.darkPct.toFixed(0) + '%';
  } else if(seen === 0){
    scanDbg.textContent = '把墙上三个图形一起放进框内';
  } else {
    scanDbg.textContent = '已看到 ' + seen + '/' + need + ' · 再退后一点让三个都进框';
  }
}

function onScanSuccess(){
  if(!SCAN.running) return;
  SCAN.running = false;
  SFX.lock();
  scanBar.style.width = '100%';
  scanDbg.textContent = '识别成功';
  toast('识别成功');
  setTimeout(() => { if(G.state === 'scan') showIntro(); }, 420);
}

/* =========================================================================
   11. 摄像头
   ========================================================================= */
let camStream = null, camStarting = false;
let selfieStream = null;

async function openCam(){
  if(camStream) return true;
  if(camStarting) return false;
  camStarting = true;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio: false,
    });
    camEl.srcObject = camStream;
    await camEl.play();
    document.body.classList.add('cam-on');
    arBtn.classList.add('on');
    return true;
  }catch(e){
    return false;
  } finally {
    camStarting = false;
  }
}
function closeCam(){
  if(camStream){
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    camEl.srcObject = null;
    document.body.classList.remove('cam-on');
    arBtn.classList.remove('on');
  }
}

const capVideo = document.getElementById('capVideo');
async function openSelfie(){
  if(selfieStream) return true;
  try{
    selfieStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal:'user' }, width:{ ideal:1080 }, height:{ ideal:1440 } },
      audio: false,
    });
    capVideo.srcObject = selfieStream;
    await capVideo.play();
    return true;
  }catch(e){
    return false;
  }
}
function closeSelfie(){
  if(selfieStream){
    selfieStream.getTracks().forEach(t => t.stop());
    selfieStream = null;
    capVideo.srcObject = null;
  }
}

function resetGame(){
  G.score = 0; G.hits = 0; G.spawned = 0; G.resolved = 0;
  G.t = 0; G.stun = 0; G.shake = 0; G.endDelay = -1;
  G.nextStarIn = CONFIG.firstStarDelay;
  G.nextBombIn = CONFIG.bombGapFrom;
  G.bombArmed = false;
  G.items.length = 0;
  G.particles.length = 0;
  G.ripples.length = 0;
  G.sprite.x = W/2; G.sprite.tx = W/2;
  G.sprite.mood = 'idle'; G.sprite.moodT = 0;
  ANIM.bounce = 0; ANIM.sink = 0;
  buildSlots(); renderSlots();
  tipEl.textContent = '拖动屏幕移动小精灵';

/* 启动后一进来就是识别页 */
async function bootScan(){
  G.state = 'scan';
  scanEl.classList.remove('hide');
  introEl.classList.add('hide');
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  document.body.classList.remove('playing');
  scanBar.style.width = '0%';
  scanDbg.textContent = '';
  SCAN.hits = 0;

  const ok = await openCam();
  if(!ok){
    scanDbg.textContent = '摄像头打不开（需要 https 或 localhost）';
    camFailBtn.hidden = false;
    toast('摄像头不可用，可以先直接体验');
    return;
  }
  camFailBtn.hidden = true;
  scanDbg.textContent = '';
  SCAN.running = true;
}

/* 扫描成功 → 挑选角色页 */
function showIntro(){
  G.state = 'intro';
  SCAN.running = false;
  scanEl.classList.add('hide');
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  introEl.classList.remove('hide');
  document.body.classList.remove('playing');
  // 选择页就开始拉模型，进游戏时已就绪
  preloadModel(G.char);
}

function enterGame(){
  SCAN.running = false;
  scanEl.classList.add('hide');
  introEl.classList.add('hide');
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  document.body.classList.add('playing');
  resetGame();
  G.state = 'playing';
  preloadModel(G.char);
}

async function prepareAndPlay(){
  ensureAudio();
  closeSelfie();
  if(!camStream){ await openCam(); }
  enterGame();
}

function gameOver(){
  G.state = 'over';
  document.body.classList.remove('playing');
  SFX.win();

  let title = '收集完成';
  if(G.score === CONFIG.starTotal) title = '满星通关';
  else if(G.score >= 3) title = '差一点点';
  else if(G.score >= 1) title = '还不错';
  else title = '一颗都没接到';
  document.getElementById('resultTitle').textContent = title;

  const rs = document.getElementById('resultStars');
  rs.innerHTML = '';
  for(let i = 0; i < CONFIG.starTotal; i++){
    const s = document.createElement('div');
    s.className = 'rs' + (i < G.score ? ' on' : '');
    s.innerHTML = STAR_SVG;
    rs.appendChild(s);
  }

  resultEl.classList.remove('hide');
}

/* =========================================================================
   14. 拍照
   ========================================================================= */
const capStage = document.getElementById('capStage');
const capSlot  = document.getElementById('capSlot');
const capTpl   = document.getElementById('capTemplate');
const capHint  = document.getElementById('capHint');
const shotImg  = document.getElementById('shotImg');
const saveBtn  = document.getElementById('saveBtn');
let shotDataUrl = '';

/* 有模板就按模板里的照片位放；没有模板时铺满整张，不留白边 */
function currentSlot(){
  if(TEMPLATE.src && TEMPLATE.slot) return TEMPLATE.slot;
  return { x: 0, y: 0, w: 1, h: 1 };
}

function layoutCapSlot(){
  const s = currentSlot();
  capSlot.style.left   = (s.x * 100) + '%';
  capSlot.style.top    = (s.y * 100) + '%';
  capSlot.style.width  = (s.w * 100) + '%';
  capSlot.style.height = (s.h * 100) + '%';

  if(TEMPLATE.src){
    capTpl.src = TEMPLATE.src + (window.ASSET_Q || '');
    capTpl.style.display = 'block';
    capSlot.classList.add('has-tpl');
    capSlot.classList.remove('full');
    capHint.style.display = 'none';
  } else {
    capTpl.style.display = 'none';
    capSlot.classList.remove('has-tpl');
    capSlot.classList.add('full');
    capHint.style.display = 'none';
  }
}

async function openCapture(){
  ensureAudio();
  G.state = 'capture';
  resultEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.remove('hide');
  layoutCapSlot();

  closeCam();                 // 手机通常同时只允许一路摄像头
  const ok = await openSelfie();
  if(!ok) toast('前置摄像头打不开，仍可拍摄');
}

async function closeCapture(){
  closeSelfie();
  capEl.classList.add('hide');
  shotEl.classList.add('hide');
  resultEl.classList.remove('hide');
  G.state = 'over';
  // 拍照时为了给前置摄像头让路把后摄关了，回来要恢复实景背景
  if(!camStream && !camStarting) await openCam();
}

/* 把预览区合成成一张图 */
function shoot(){
  const rect = capStage.getBoundingClientRect();
  const outW = 1080;
  const outH = Math.round(outW * rect.height / rect.width);

  const cc = document.createElement('canvas');
  cc.width = outW; cc.height = outH;
  const g = cc.getContext('2d');

  g.fillStyle = '#FFFFFF';
  g.fillRect(0, 0, outW, outH);

  if(TEMPLATE.src && capTpl.complete && capTpl.naturalWidth){
    // 模板按 cover 铺满
    const ir = capTpl.naturalWidth / capTpl.naturalHeight;
    const or = outW / outH;
    let dw, dh;
    if(ir > or){ dh = outH; dw = dh * ir; } else { dw = outW; dh = dw / ir; }
    g.drawImage(capTpl, (outW-dw)/2, (outH-dh)/2, dw, dh);
  }

  const slot = currentSlot();
  const sx = outW * slot.x;
  const sy = outH * slot.y;
  const sw = outW * slot.w;
  const sh = outH * slot.h;

  g.save();
  g.beginPath();
  g.rect(sx, sy, sw, sh);
  g.clip();

  const v = capVideo;
  if(v && v.readyState >= 2 && v.videoWidth){
    // cover 裁切 + 镜像（与预览一致）
    const vw = v.videoWidth, vh = v.videoHeight;
    const scale = Math.max(sw / vw, sh / vh);
    const dw = vw * scale, dh = vh * scale;
    g.translate(sx + sw, sy);
    g.scale(-1, 1);
    g.drawImage(v, (sw - dw) / 2, (sh - dh) / 2, dw, dh);
  } else {
    g.fillStyle = '#EFEAE4';
    g.fillRect(sx, sy, sw, sh);
  }
  g.restore();

  shotDataUrl = cc.toDataURL('image/jpeg', 0.92);
  shotImg.src = shotDataUrl;
  saveBtn.href = shotDataUrl;
  saveBtn.setAttribute('download', 'VAD合照.jpg');

  SFX.shutter();
  shotEl.classList.remove('hide');
}

/* =========================================================================
   15. 主循环
   ========================================================================= */
let lastTs = 0, crashed = false;

function safeRender(){
  if(crashed) return;
  try{ render(); }
  catch(err){
    crashed = true;
    console.error('[render]', err);
    const el = document.createElement('div');
    el.id = 'crash';
    el.textContent = '渲染出错：' + (err && err.message ? err.message : err);
    document.body.appendChild(el);
  }
}

function loop(ts){
  const dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
  lastTs = ts;

  ANIM.t += dt;
  ANIM.bounce = damp(ANIM.bounce, 0, 6, dt);
  ANIM.sink   = damp(ANIM.sink,   0, 5, dt);

  if(G.state === 'playing'){
    updateSprite(dt);
    updateItems(dt);
    updateTimers(dt);
    updateParticles(dt);
    if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3.2);
  } else {
    G.t += dt;
    updateParticles(dt);
    G.sprite.mood = 'idle';
    if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*3.2);
  }

  if(G.state === 'scan') updateScan(dt);

  syncR3(dt);
  safeRender();
  requestAnimationFrame(loop);
}

/* =========================================================================
   16. 绑定
   ========================================================================= */
document.querySelectorAll('.pick').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.pick').forEach(o => o.classList.remove('sel'));
    el.classList.add('sel');
    G.char = el.dataset.char;
    ensureAudio();
    preloadModel(G.char);
  });
});

document.getElementById('startBtn').addEventListener('click', () => { prepareAndPlay(); });
document.getElementById('againBtn').addEventListener('click', () => { prepareAndPlay(); });
document.getElementById('shotBtn').addEventListener('click', () => { openCapture(); });
document.getElementById('capBack').addEventListener('click', () => { closeCapture(); });
document.getElementById('shootBtn').addEventListener('click', () => { shoot(); });
document.getElementById('shotDone').addEventListener('click', () => { closeCapture(); });
camFailBtn.addEventListener('click', () => { enterGame(); });

arBtn.addEventListener('click', () => {
  if(camStream) closeCam(); else openCam();
});

document.addEventListener('gesturestart', e => e.preventDefault());
cvs.addEventListener('contextmenu', e => e.preventDefault());

let toastTimer = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

/* =========================================================================
   17. 启动
   ========================================================================= */
['v','a','d'].forEach(k => {
  const im = new Image();
  im.src = CHARS[k].img + (window.ASSET_Q || '');
  CHAR_IMG[k] = im;
});

initScan();
resize();
buildSlots();
G.sprite.x = W/2;
G.sprite.tx = W/2;
requestAnimationFrame(loop);
bootScan();

/* 3D 资源后置加载，不阻塞扫描；加载好再把形象换成建模 */
loadThreeScript().then(ok => {
  if(!ok) return;
  if(!initR3()) return;
  preloadModel(pendingChar || G.char);
});

window.__GAME = { G, CONFIG, CHARS, TEMPLATE, SCAN, ANIM, R3, modelCache,
                  enterGame, prepareAndPlay, showIntro, analyzeMarker, bootScan,
                  openCapture, shoot, scanSuccess: onScanSuccess };
})();
