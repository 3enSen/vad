}

/* 取景框对应的视频源矩形 */
function frameSourceRect(){
  const v = camEl;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const sw = W / sc, sh = H / sc;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const kx = sw / W, ky = sh / H;

  const r = scanFrameEl.getBoundingClientRect();
  let fw = Math.max(12, r.width * kx);
  let fh = Math.max(12, r.height * ky);
  let vx = sx + r.left * kx;
  let vy = sy + r.top * ky;
  if(vx + fw > vw) fw = vw - vx;
  if(vy + fh > vh) fh = vh - vy;
  return { vx, vy, fw: Math.max(12, fw), fh: Math.max(12, fh) };
}

function grabFrame(){
  const v = camEl;
  if(!v || v.readyState < 2 || !v.videoWidth || !v.videoHeight) return false;
  if(SCAN.canvas.width !== SCAN_SIZE || SCAN.canvas.height !== SCAN_SIZE){
    SCAN.canvas.width = SCAN_SIZE;
    SCAN.canvas.height = SCAN_SIZE;
  }
  const { vx, vy, fw, fh } = frameSourceRect();
  SCAN.ctx.drawImage(v, vx, vy, fw, fh, 0, 0, SCAN_SIZE, SCAN_SIZE);
  return true;
}

/* 自适应阈值的暗块掩膜（和 game.html 同一套） */
function buildDarkMask(){
  const S = SCAN_SIZE, total = S * S;
  const img = SCAN.ctx.getImageData(0, 0, S, S).data;

  const lum  = new Uint8Array(total);
  const hist = new Uint32Array(256);
  for(let i = 0; i < total; i++){
    const si = i * 4;
    const L = (0.299*img[si] + 0.587*img[si+1] + 0.114*img[si+2]) | 0;
    lum[i] = L;
    hist[L]++;
  }
  const quantile = q => {
    let acc = 0;
    const need = total * q;
    for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= need) return v; }
    return 255;
  };
  const dark0  = quantile(0.015);
  const bright = quantile(0.90);
  const contrast = bright - dark0;
  if(contrast < CONFIG.scanMinContrast){
    return { ok:false, mask:null, darkPct:0, contrast, th:0 };
  }
  const th = clamp(
    Math.round(dark0 + contrast * CONFIG.scanThresholdRatio),
    CONFIG.scanMinLum, CONFIG.scanMaxLum
  );
  const mask = new Uint8Array(total);
  let darkCount = 0;
  for(let i = 0; i < total; i++){
    if(lum[i] < th){ mask[i] = 1; darkCount++; }
  }
  const darkPct = darkCount / total * 100;
  if(darkCount < CONFIG.scanMinCount || darkPct > CONFIG.scanMaxAreaPct){
    return { ok:false, mask:null, darkPct, contrast, th };
  }
  return { ok:true, mask, darkPct, contrast, th };
}

/* 认形状：每个暗块算一条"宽度剖面"，和参考剖面做最近邻匹配。
   宽度都按最宽行归一，采样 8/25/50/75/92% 五个高度 + fill（面积占比）。
   参考值 = 老师给的三张剪影经过同一条相机管线（168px 画布）实测平均，
   换新图形时：跑 probe38 量一轮，把 REF 里的数字换掉即可。 */
const SHAPE_REF = {
  drop:    { n8:0.61, n25:0.92, n50:0.98, n75:0.61, n92:0.20, fill:0.70 },
  bubble:  { n8:0.64, n25:0.93, n50:0.99, n75:0.96, n92:0.64, fill:0.85 },
  balloon: { n8:0.29, n25:0.91, n50:1.00, n75:0.88, n92:0.56, fill:0.77 },
};
function analyzeShapes(){
  const m = buildDarkMask();
  if(!m.ok) return { ok:false, shape:null, darkPct:m.darkPct, contrast:m.contrast, th:m.th };

  const S = SCAN_SIZE, total = S * S, mask = m.mask;
  const visited = new Uint8Array(total);
  const stack   = new Int32Array(total);
  const pts = [];
  let best = null;
  let clipped = false;      // 大块暗区被取景框边裁掉 → 图形没整个进框
  SCAN.comps = [];          // 调试用：这一帧里每个暗块的参数

  for(let i = 0; i < total; i++){
    if(!mask[i] || visited[i]) continue;

    let sp = 0; stack[sp++] = i; visited[i] = 1;
    let count = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
    pts.length = 0;

    while(sp > 0){
      const p  = stack[--sp];
      const px = p % S, py = (p - px) / S;
      count++; pts.push(p);
      if(px < minX) minX = px;
      if(px > maxX) maxX = px;
      if(py < minY) minY = py;
      if(py > maxY) maxY = py;

      if(px > 0){   const q = p - 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(px < S-1){ const q = p + 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py > 0){   const q = p - S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py < S-1){ const q = p + S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
    }

    if(count < CONFIG.scanMinCount) continue;

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if(bw < CONFIG.scanMinSide || bh < CONFIG.scanMinSide) continue;
    if(bw > S * 0.97 && bh > S * 0.97){ clipped = true; continue; }   // 挡住镜头
    // 大暗块贴到取景框边 = 图形被裁掉一截，剖面不可信
    if(count > CONFIG.scanMinCount * 4 &&
       (minX <= 1 || minY <= 1 || maxX >= S - 2 || maxY >= S - 2)){
      clipped = true;
      continue;
    }

    const ar = bw / bh;
    if(ar < 0.5 || ar > 1.6) continue;
    const fill = count / (bw * bh);
    if(fill < 0.40 || fill > 0.92) continue;

    // 逐行像素数 → 宽度剖面
    const rc = new Uint16Array(bh);
    for(let k = 0; k < pts.length; k++){
      const p  = pts[k];
      const py = (p - (p % S)) / S;
      rc[py - minY]++;
    }
    let Wmax = 0;
    for(let k = 0; k < bh; k++) if(rc[k] > Wmax) Wmax = rc[k];
    if(Wmax < bw * 0.6) continue;                     // 最宽行得是主体

    const at = t => rc[Math.min(bh - 1, Math.max(0, Math.round((bh - 1) * t)))];
    const n = t => at(t) / Wmax;
    const n8 = n(0.08), n25 = n(0.25), n50 = n(0.5), n75 = n(0.75), n92 = n(0.92);
    if(n50 < 0.42) continue;   // 中段太窄 = 碎渣；三个图形中段都接近满宽

    const f = { n8, n25, n50, n75, n92, fill };
    SCAN.comps.push({ bw, bh, ar:+ar.toFixed(2), fill:+fill.toFixed(2),
                      n8:+n8.toFixed(2), n25:+n25.toFixed(2),
                      n50:+n50.toFixed(2), n75:+n75.toFixed(2), n92:+n92.toFixed(2),
                      edge:(minX <= 1 || minY <= 1 || maxX >= S - 2 || maxY >= S - 2) });

    // 最近邻：离哪个参考剖面最近就认谁，太远的不认
    let shape = null, bd = 1e9;
    for(const k in SHAPE_REF){
      const r = SHAPE_REF[k];
      const d = Math.hypot(f.n8-r.n8, f.n25-r.n25, f.n50-r.n50,
                           f.n75-r.n75, f.n92-r.n92, f.fill-r.fill);
      if(d < bd){ bd = d; shape = k; }
    }
    if(bd > CONFIG.scanMatchTol) shape = null;
    if(!shape) continue;
    if(!best || count > best.count) best = { shape, count };
  }

  if(!best) return { ok:false, shape:null, clipped, darkPct:m.darkPct, contrast:m.contrast, th:m.th };
  return { ok:true, shape:best.shape, clipped:false, darkPct:m.darkPct, contrast:m.contrast, th:m.th };
}

function updateScan(dt){
  if(!SCAN.running) return;
  SCAN.timer -= dt;
  if(SCAN.timer > 0) return;
  SCAN.timer = CONFIG.scanInterval;

  if(!grabFrame()){
    scanDbg.textContent = '等待摄像头…';
    return;
  }
  const r = analyzeShapes();
  const target = CHARS[targetKey()];

  if(r.ok){
    if(r.shape === target.shape){
      SCAN.wrongHits = 0;
      SCAN.hits++;
      if(SCAN.hits >= CONFIG.scanNeed){
        SCAN.hits = CONFIG.scanNeed;
        onFound(targetKey());
        return;
      }
    } else {
      // 找到的是别的角色的图形：提示但不收集
      SCAN.hits = 0;
      SCAN.wrongHits++;
      if(SCAN.wrongHits >= 3){
        const other = ORDER.map(k => CHARS[k]).find(c => c.shape === r.shape);
        if(other) scanDbg.textContent = '这是 ' + other.name + ' 的贴纸'
                        + '，先找 ' + target.name + ' 的贴纸';
      }
    }
  } else {
    SCAN.hits = Math.max(0, SCAN.hits - 1);
    if(SCAN.hits === 0) SCAN.wrongHits = 0;
  }

  const debugOn = /[?&]debug=1/.test(location.search || '');
  scanFrameEl.classList.toggle('warm', SCAN.hits > 0);

  if(SCAN.wrongHits < 3){
    if(r.clipped){
      scanDbg.textContent = '拿远一点，让整个图形都进框';
    } else if(SCAN.hits > 0){
      scanDbg.textContent = '看到了 · 再稳住一下';
    } else if(debugOn){
      scanDbg.textContent = '搜索中 · 对比 ' + Math.round(r.contrast || 0)
        + ' · 阈值 ' + Math.round(r.th || 0) + ' · 暗 ' + (r.darkPct || 0).toFixed(0) + '%'
        + (r.shape ? ' · 形状 ' + r.shape : '');
    } else {
      scanDbg.textContent = '';
    }
  }
}

/* =========================================================================
   7. 3D：把角色的 GLB 工作动画放到实景上
   ========================================================================= */
const R3 = { ok:false, flat:false, flatImg:null, flatT:0,
             renderer:null, scene:null, camera:null, visH:0, visW:0,
             mixer:null, clip:null, group:null, shadow:null, cache:{},
             pivot:null, mover:null, spin:null, path:null,
             rootBone:null, dirt:null };

/* 先自己探一次，别让 three.js 在不支持的机器上往控制台报红 */
function webglSupported(){
  try{
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if(!gl) return false;
    const lose = gl.getExtension('WEBGL_lose_context');
    if(lose) lose.loseContext();
    return true;
  }catch(e){ return false; }
}

function initR3(){
  if(!window.THREE || !window.GLTFLoader) return false;
  if(!webglSupported()) return false;
  try{
    R3.renderer = new THREE.WebGLRenderer({ canvas: threeCv, antialias: true, alpha: true });
    R3.renderer.setClearColor(0x000000, 0);
  }catch(e){ return false; }

  R3.scene = new THREE.Scene();
  R3.camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  R3.camera.position.set(0, 0, 6);
  R3.camera.lookAt(0, 0, 0);

  R3.scene.add(new THREE.AmbientLight(0xffffff, 1.35));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(1.4, 2.4, 4.5); R3.scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-1.8, 1.4, -3.5); R3.scene.add(rim);

  R3.group = new THREE.Group();
  R3.scene.add(R3.group);

  R3.shadow = makeContactShadow();
  R3.scene.add(R3.shadow);

  R3.ok = true;
  updateR3Layout();
  return true;
}

function updateR3Layout(){
  if(!R3.ok) return;
  R3.renderer.setSize(W, H, false);
  R3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  R3.camera.aspect = W / Math.max(H, 1);
  R3.camera.updateProjectionMatrix();
  const fovRad = R3.camera.fov * Math.PI / 180;
  R3.visH = 2 * Math.tan(fovRad / 2) * R3.camera.position.z;
  R3.visW = R3.visH * R3.camera.aspect;
}

/* 接触影：一片椭圆渐变贴在脚下 */
function makeContactShadow(){
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  rg.addColorStop(0,   'rgba(10,8,6,.42)');
  rg.addColorStop(.6,  'rgba(10,8,6,.20)');
  rg.addColorStop(1,   'rgba(10,8,6,0)');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(S/2, S/2, S/2, S*0.32, 0, 0, Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.32), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.renderOrder = -1;
  return mesh;
}

/* 绕 X 轴转 pitch 后，包围盒在画面上的投影尺寸。
   三个动作的工作面不同：水平面上的动作（擦地板/擦桌子）只有俯过视角才看得清，
   垂直平面上的动作（擦玻璃）平视就好。 */
function projSize(box, pitchRad){
  const cs = Math.cos(pitchRad), sn = Math.sin(pitchRad);
  let mnY = Infinity, mxY = -Infinity;
  for(const Y of [box.min.y, box.max.y])
  for(const Z of [box.min.z, box.max.z]){
    const ny = Y * cs - Z * sn;
    if(ny < mnY) mnY = ny; if(ny > mxY) mxY = ny;
  }
  return { x: box.max.x - box.min.x, y: mxY - mnY };
}

/* =========================================================================
   6b. 矩形边线轨迹（dd 擦桌子：沿 5cm × 6cm 长方形边线绕圈）
   ========================================================================= */
/* 圆角矩形的周长参数化：u∈[0,1) → { x, z, tx, tz }（位置 + 单位切线）。
   从下边左段起步，逆时针绕一圈：下 → 右下角 → 右 → 右上角 → 上 → 左上角 → 左 → 左下角。 */
function rectPathAt(u, hw, hd, rc){
  const r  = Math.max(0, Math.min(rc, Math.min(hw, hd) * 0.9));
  const sx = 2 * (hw - r);          // 两条横直边
  const sz = 2 * (hd - r);          // 两条竖直边
  const arc = Math.PI * r / 2;
  const total = 2 * sx + 2 * sz + 4 * arc;
  let d = (((u % 1) + 1) % 1) * total;

  if(d < sx) return { x: -(hw - r) + d, z: hd, tx: 1, tz: 0 };
  d -= sx;
  if(d < arc){                      // 右下角
    const a = Math.PI / 2 - d / r;
    return { x: (hw - r) + r * Math.cos(a), z:  (hd - r) + r * Math.sin(a),
             tx: Math.sin(a), tz: -Math.cos(a) };
  }
  d -= arc;
  if(d < sz) return { x: hw, z: (hd - r) - d, tx: 0, tz: -1 };
  d -= sz;
  if(d < arc){                      // 右上角
    const a = -d / r;
    return { x: (hw - r) + r * Math.cos(a), z: -(hd - r) + r * Math.sin(a),
             tx: Math.sin(a), tz: -Math.cos(a) };
  }
  d -= arc;
  if(d < sx) return { x: (hw - r) - d, z: -hd, tx: -1, tz: 0 };
  d -= sx;
  if(d < arc){                      // 左上角
    const a = -Math.PI / 2 - d / r;
    return { x: -(hw - r) + r * Math.cos(a), z: -(hd - r) + r * Math.sin(a),
             tx: Math.sin(a), tz: -Math.cos(a) };
  }
  d -= arc;
  if(d < sz) return { x: -hw, z: -(hd - r) + d, tx: 0, tz: 1 };
  d -= sz;
  const a = Math.PI - d / r;        // 左下角
  return { x: -(hw - r) + r * Math.cos(a), z: (hd - r) + r * Math.sin(a),
           tx: Math.sin(a), tz: -Math.cos(a) };
}

/* 每帧推进：时间 → 位置 + 朝向。朝向按「原动作行进方向 → 当前切线」
   算夹角，所以角色是朝着走的方向擦，动作本身的姿态关系不变。 */
function updatePathMotion(dt){
  const P = R3.path;
  if(!P || !R3.mover) return;
  const { hw, hd, loop, corner, dir0 } = P.cfg;
  const spin = P.cfg.spin || 0;
  P.t = (P.t + dt) % loop;
  const p = rectPathAt(P.t / loop, hw, hd, corner);

  R3.mover.position.x = p.x * P.s;
  R3.mover.position.z = p.z * P.s;

  // R(θ)·dir0 = 切线；乘 spin 只跟一部分，俯视下才不至于歪头
  const ty = Math.atan2(p.tx * dir0[1] - dir0[0] * p.tz,
                        dir0[0] * p.tx + dir0[1] * p.tz) * spin;
  if(P.yaw == null) P.yaw = ty;
  else {
    let d = ty - P.yaw;
    while(d >  Math.PI) d -= Math.PI * 2;
    while(d < -Math.PI) d += Math.PI * 2;
    P.yaw += d * Math.min(1, dt * 6);        // 转角缓一下，别硬折
  }
  if(R3.spin) R3.spin.rotation.y = (P.cfg.yaw || 0) + P.yaw;

  // 影子跟着走：俯视角下 z 方向的位移会被压成画面里的纵向位移
  if(R3.shadow){
    R3.shadow.position.x = R3.mover.position.x;
    R3.shadow.position.y = P.shadowY - R3.mover.position.z * Math.sin(P.pitch);
    R3.shadow.position.z = R3.mover.position.z * Math.cos(P.pitch);
  }
}

/* 载入动作后预处理：
   ① 把位移最大的那条 position 轨道按 moveScale 压缩（原位移远大于角色本身，
      不压会整个跑出画面；手部的推拉幅度只有它的 1/10，不受影响）
   ② 采样整段动作，量出真实包围盒（SkinnedMesh 必须用 precise 模式，
      否则量到的是没被骨骼变形过的裸顶点 —— 那堆顶点只有 3cm 高，会算出荒唐的比例） */
function prepareWorkMotion(g, c){
  const obj = g.scene, clip = g.animations[0];
  if(!clip) return;

  let best = null, bestAmp = -1;
  for(const tr of clip.tracks){
    if(!/\.position$/.test(tr.name)) continue;
    const v = tr.values, n = v.length / 3;
    let amp = 0;
    for(let k = 0; k < 3; k++){
      let lo = Infinity, hi = -Infinity;
      for(let i = 0; i < n; i++){ if(v[i*3+k] < lo) lo = v[i*3+k]; if(v[i*3+k] > hi) hi = v[i*3+k]; }
      amp = Math.max(amp, hi - lo);
    }
    if(amp > bestAmp){ bestAmp = amp; best = tr; }
  }

  /* 原动作的水平行进方向（角色是朝着行进方向擦的）。
     走自定义轨迹时按这个方向算朝向，这样"走起来"的姿态和原来一致。 */
  let dir0 = [0, -1];
  if(best){
    const v = best.values, n = v.length / 3;
    const dx = v[(n-1)*3] - v[0], dz = v[(n-1)*3+2] - v[0];
    const L = Math.hypot(dx, dz);
    if(L > 1e-5) dir0 = [dx / L, dz / L];
    else {
      // 来回擦、没有净位移：取方差更大的那条水平轴
      let mx = 0, mz = 0, vx = 0, vz = 0;
      for(let i = 0; i < n; i++){ mx += v[i*3] / n; mz += v[i*3+2] / n; }
      for(let i = 0; i < n; i++){
        const ax = v[i*3] - mx, az = v[i*3+2] - mz;
        vx += ax * ax; vz += az * az;
      }
      dir0 = vx >= vz ? [1, 0] : [0, 1];
    }
  }

  // 走自定义轨迹的角色：位移整段压平（原地动作），移动交给代码
  const keep = c.path ? 0 : c.moveScale;
  if(best && keep < 1){
    const v = best.values, n = v.length / 3;
    const av = [0, 0, 0];
    for(let i = 0; i < n; i++) for(let k = 0; k < 3; k++) av[k] += v[i*3+k] / n;
    for(let i = 0; i < n; i++) for(let k = 0; k < 3; k++)
      v[i*3+k] = av[k] + (v[i*3+k] - av[k]) * keep;
  }
  /* 同一根骨骼的旋转也锁住。原动作是"边走边转"，位移被我们换成轨迹之后，
     留在原地转就变成原地打转、脸朝哪边全看运气；锁在第一帧的朝向上，
     朝向交给轨迹统一控制。 */
  if(c.path && best){
    const node = best.name.replace(/\.position$/, '');
    for(const tr of clip.tracks){
      if(tr.name !== node + '.quaternion') continue;
      const q = Array.from(tr.values.slice(0, 4));
      for(let i = 0; i < tr.values.length; i++) tr.values[i] = q[i % 4];
    }
  }

  // 采样 20 帧量全程包围盒
  const mixer = new THREE.AnimationMixer(obj);
  mixer.clipAction(clip).play();
  const full = new THREE.Box3();
  const N = 20;
  for(let i = 0; i < N; i++){
    mixer.setTime(clip.duration * i / N);
    obj.updateMatrixWorld(true);
    full.union(new THREE.Box3().setFromObject(obj, true));
  }
  mixer.stopAllAction();
  // 复位到第一帧，避免残留姿态影响后续
  obj.updateMatrixWorld(true);

  /* 自定义轨迹（模型单位是米，cm × 0.01）：
     老师要 dd 沿一个 5cm × 6cm 的长方形边线擦桌子。
     包围盒按「体块 + 整圈轨迹」扩——不是把角色放大，是让归一化时
     整圈都在画面里，别走到边上就被裁掉。 */
  let path = null;
  if(c.path){
    const hw = c.path.w * 0.01 / 2;
    const hd = c.path.h * 0.01 / 2;
    path = {
      hw, hd,
      loop: c.path.loop || 11,
      corner: (c.path.corner || 1.4) * 0.01,
      spin: c.path.spin == null ? 0 : c.path.spin,
      yaw: (c.path.yaw || 0) * Math.PI / 180,
      dir0,
    };
    full.min.x -= hw; full.max.x += hw;
    full.min.z -= hd; full.max.z += hd;
  }

  /* 根骨骼的名字：脏污要跟着"人"走，不是跟着外壳走。
     位移是打在骨骼上的，取对象位置只会拿到原地不动的空壳。 */
  if(best) g.userData.rootName = best.name.replace(/\.position$/, '');

  g.userData.fit = { box: full.clone(), pitch: (c.pitch || 0) * Math.PI / 180, path };
}

/* 载入并摆好一个角色 */
function loadWorkModel(key){
  return new Promise((resolve, reject) => {
    if(R3.cache[key]){ resolve(R3.cache[key]); return; }
    const c = CHARS[key];
    new window.GLTFLoader().load(c.glb + Q,
      g => {
        prepareWorkMotion(g, c);
        R3.cache[key] = g;
        resolve(g);
      },
      undefined,
      e => reject(e)
    );
  });
}

/* 当前展示的角色 key（null = 没有在展示） */
let showingKey = null;

async function showCharacter(key){
  const c = CHARS[key];
  showingKey = key;
  document.body.classList.add('showing');
  G.state = 'show';
  loadTipEl.textContent = '正在请 ' + c.name + ' 上场…';
  loadTipEl.classList.add('show');

  if(R3.flat){                       // 没有 WebGL：用 2D 立绘 + 干活小动作
    const fi = new Image();
    fi.src = c.img + Q;
    await fi.decode().catch(() => {});
    if(showingKey !== key) return;
    R3.flatImg = fi;
    R3.flatT = 0;
    loadTipEl.classList.remove('show');
    SFX.appear();
    revealShowUI(c);
    grimeBegin(key);
    return;
  }

  let gltf = null;
  try{
    gltf = await loadWorkModel(key);
  }catch(e){ /* 加载失败走 2D 兜底 */ }

  if(showingKey !== key) return;          // 期间用户已经退出

  loadTipEl.classList.remove('show');
  SFX.appear();

  // 清掉上一个
  while(R3.group.children.length) R3.group.remove(R3.group.children[0]);
  R3.mixer = null;
  R3.path = null;
  R3.mover = null;
  R3.spin = null;

  if(gltf){
    const obj = gltf.scene;
    const fit = gltf.userData.fit;
    const box = fit ? fit.box : new THREE.Box3().setFromObject(obj);
    const pitch = fit ? fit.pitch : 0;
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);

    // 归一：按"俯过视角后的投影尺寸"算，保证整段动作都在画面里
    const ps = projSize(box, pitch);
    /* frameH：整段动作（体块+路径）占画面高度的比例。aa 的 8 字路径要铺开，
       默认 0.46 装不下原片的路径幅度。 */
    let s = (R3.visH * (c.frameH || 0.46)) / Math.max(ps.y, 1e-6);
    if(ps.x * s > R3.visW * 0.84) s = (R3.visW * 0.84) / ps.x;
    R3.fit = { box, center, s, pitch };     // 抬落点时要用（整段动作的外壳）

    obj.scale.setScalar(s);
    obj.position.set(-center.x * s, -center.y * s, -center.z * s);

    /* pivot 负责俯视角，mover 负责沿轨迹移动，spin 负责朝向。
       spin 是"体块中心"处的空节点——obj 已经把体块中心挪到原点，
       所以绕 spin 转就是绕角色自身转，不会画出弧线。 */
    R3.pivot = new THREE.Group();
    R3.pivot.rotation.x = pitch;
    R3.mover = new THREE.Group();
    R3.spin  = new THREE.Group();
    R3.spin.add(obj);
    R3.mover.add(R3.spin);
    R3.pivot.add(R3.mover);
    R3.group.add(R3.pivot);

    const baseY = R3.visH * (c.yFrac || -0.16);
    R3.group.position.set(0, baseY, 0);

    // 接触影不再画：俯视角下这块 1×0.32 的椭圆贴片会被压成一条横线，
    // 看着像画面里多了一条奇怪的线（老师圈出来去掉的就是它）。
    // 2D 兜底（立绘）模式下的影子保留 —— 平视时它还是正常的贴地影。
    R3.shadow.visible = false;

    // 走轨迹的角色：参数交给主循环，每帧推进位置与朝向
    const pcfg = fit && fit.path;
    R3.path = pcfg ? { cfg: pcfg, s, pitch, t: 0, yaw: null,
                       shadowY: baseY - ps.y * s * 0.52 + 0.001 } : null;

    const rn = gltf.userData.rootName;
    R3.rootBone = rn ? obj.getObjectByName(rn) : null;

    if(gltf.animations && gltf.animations.length){
      R3.mixer = new THREE.AnimationMixer(obj);
      R3.clip  = gltf.animations[0];
      const act = R3.mixer.clipAction(R3.clip);
      act.setLoop(THREE.LoopRepeat, Infinity);
      act.reset().play();
    }

    /* aa 的蚊香眼：一片贴着脸的曲面盘，大部分嵌在头里、螺旋棱露在外面。
       蒙皮矩阵的设备级微小差异会让它比 Blender 里沉一点 —— 头面一挡，
       盘面就被深度测吃掉，原脸的白色五官就露出来了。它显隐本来就是靠
       骨骼缩放（0.0005 隐藏），所以可见时段直接关掉深度测试、最后画，
       各家 GPU 上都跟原渲染一致。 */
    const diz = obj.getObjectByName('蚊香眼');
    if(diz && diz.material){
      const dm = Array.isArray(diz.material) ? diz.material : [diz.material];
      dm.forEach(m => { m.depthTest = false; m.depthWrite = false; });
      diz.renderOrder = 30;
    }
  } else {
    // 2D 兜底：把立绘当 sprite 贴上去
    const img = new Image();
    img.src = c.img + Q;
    await img.decode().catch(() => {});
    const h = R3.visH * 0.36;
    const w = h * (img.naturalWidth || 1) / (img.naturalHeight || 1);
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    mesh.position.set(0, -R3.visH * 0.16 + h / 2, 0);
    R3.group.add(mesh);
    R3.shadow.scale.set(w * 1.1, 1, w * 0.7);
    R3.shadow.position.set(0, -R3.visH * 0.16 + 0.001, 0);
    R3.shadow.visible = true;
  }

  revealShowUI(c);
  fitShowAboveUI();
  /* 工作面先蒙一层灰，它干活时一路擦干净。
     有 WebGL 就贴在 3D 工作面上（擦痕跟着地面透视走），没有就用 2D 蒙版。 */
  if(!buildDirt(key)) grimeBegin(key);
}

/* 把角色抬到台词上方。底部 UI 的像素高度基本固定，角色却是按画面比例
   缩放的——矮屏上同一个 yFrac 就会压到名字/台词上。
   这里不用当前帧的姿态量，而是用"整段动作 + 整圈轨迹"的外壳量：
   取水平半径的最大值覆盖任意朝向，保证动作走到哪一帧都不会压上去。 */
function fitShowAboveUI(){
  if(R3.flat || !R3.group || !R3.pivot || !R3.camera || !R3.fit) return;
  const tag = showEl.querySelector('#showTag');
  if(!tag) return;
  const rect = tag.getBoundingClientRect();
  if(!rect.height) return;

  const { box, center, s, pitch } = R3.fit;
  const cs = Math.cos(pitch), sn = Math.sin(pitch);
  const r = Math.max(
    Math.abs(box.min.x - center.x), Math.abs(box.max.x - center.x),
    Math.abs(box.min.z - center.z), Math.abs(box.max.z - center.z)) * s;

  R3.camera.updateMatrixWorld();
  R3.camera.updateProjectionMatrix();
  const v = new THREE.Vector3();
  let bottom = -1e9;
  for(const y of [(box.min.y - center.y) * s, (box.max.y - center.y) * s])
    for(const z of [-r, r]){
      const wy = y * cs - z * sn + R3.group.position.y;
      const wz = y * sn + z * cs;
      v.set(0, wy, wz).project(R3.camera);
      const sy = (-v.y * 0.5 + 0.5) * H;
      if(sy > bottom) bottom = sy;
    }

  const gap = 26;                 // 和名字之间留一条缝，别贴上去
  const over = bottom - (rect.top - gap);
  if(over <= 0) return;

  const dy = over * (R3.visH / Math.max(H, 1));   // 屏幕 px → 世界单位
  R3.group.position.y += dy;
  R3.shadow.position.y += dy;
  if(R3.path) R3.path.shadowY += dy;
}

/* 展示页文案（3D / 2D 两条路共用） */
function revealShowUI(c){
  showNameEl.textContent = c.name;
  showCapEl.textContent = c.cap;
  showNextBtn.textContent = allDone() ? '完成收集' : '继续找下一个';
  showEl.classList.remove('hide');
}

function hideShow(){
  showingKey = null;
  document.body.classList.remove('showing');
  showEl.classList.add('hide');
  grimeClear();
  clearDirt();
  R3.rootBone = null;
  R3.flatImg = null;
  R3.path = null;
  R3.mover = null;
  R3.spin = null;
  R3.fit = null;
  if(R3.flat) return;              // 没有 WebGL 就没有 group/shadow
  while(R3.group.children.length) R3.group.remove(R3.group.children[0]);
  R3.shadow.visible = false;
  R3.mixer = null;
  R3.clip = null;
}

function syncShow(dt){
  if(R3.mixer) R3.mixer.update(dt);
  if(R3.flat) R3.flatT += dt;
  if(R3.path) updatePathMotion(dt);
  if(R3.dirt) updateDirt(dt); else grimeUpdate();
}

/* 没有 WebGL 时的角色：2D 立绘踩着拍子上下弹、左右轻摆，做出"在干活"的动态。
   脚底落在画面 60% 处，和 3D 版站的位置一致（底部要留出名字、台词和按钮）。 */
function drawFlatShow(){
  const img = R3.flatImg;
  if(!img || !img.naturalWidth) return;
  const t  = R3.flatT;
  const h  = H * 0.38;
  const w  = h * img.naturalWidth / img.naturalHeight;
  const cx = W / 2, baseY = H * 0.60;
  const ph = Math.PI / 0.42;                       // 0.42s 一拍
  const b  = Math.abs(Math.sin(t * ph));            // 0→1→0 的弹跳
  const dy = -h * 0.05 * b;
  const sq = 1 + 0.05 * (b - 0.5);                  // 落下去时压扁一点

  // 地面投影（径向渐变，不用 filter，兼容老内核）
  ctx.save();
  const sw = w * 0.60, sh = Math.max(3, h * 0.055);
  const g = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, sw / 2);
  g.addColorStop(0, 'rgba(0,0,0,' + (0.24 - 0.08 * b).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, baseY, sw / 2, sh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, baseY + dy - h / 2);
  ctx.rotate(0.06 * Math.sin(t * ph * 2));
  ctx.scale(1 / sq, sq);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();

  // 两侧的动感弧线，随拍子冒出来
  const a = 0.42 * (1 - b);
  if(a > 0.02){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = Math.max(2, h * 0.014);
    ctx.lineCap = 'round';
    for(let s = -1; s <= 1; s += 2){
      const x = cx + s * w * 0.60, y = baseY + dy - h * 0.56;
      ctx.beginPath();
      ctx.arc(x, y, w * 0.085,
              s > 0 ? -0.7 : Math.PI + 0.7,
              s > 0 ?  0.7 : Math.PI - 0.7);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* =========================================================================
   8. 收集流程
   ========================================================================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

/* 顶部进度条：三个「寻找xx」，点击切换扫描目标 */
function buildBar(){
  tplBar.innerHTML = '';
  ORDER.forEach(k => {
    const c = CHARS[k];
    const d = document.createElement('div');
    d.className = 'wchip' + (G.collected[k] ? ' done' : (k === targetKey() ? ' cur' : ''));
    d.innerHTML = '<span>寻找' + c.name + '</span>';
    d.addEventListener('click', () => {
      if(G.state !== 'scan') return;
      if(G.collected[k]){ toast(c.name + ' 已经收集到啦'); return; }
      if(G.idx === ORDER.indexOf(k)) return;
      G.idx = ORDER.indexOf(k);
      buildBar();
      buildTip();
      SCAN.hits = 0; SCAN.wrongHits = 0;
    });
    tplBar.appendChild(d);
  });
}

/* 扫描页提示语 */
function buildTip(){
  const c = CHARS[targetKey()];
  scanTipEl.innerHTML = '扫描 <b>' + c.name + '</b> 的贴纸<br>让我们来看看它在干什么呀';
}

/* 启动：一进来就是识别页 */
let scanWipedOnce = false;   // 每次刷新页面后的第一次进扫描页，自动清一次进度
async function bootScan(){
  G.state = 'scan';
  /* 识别会把环境里的暗块/真实贴纸自动收进来，上次会话常常留下
     "没找却显示已找到"的进度 —— 所以每次打开页面后第一次进扫描页，
     先自动清空一次，从零开始找。同一次会话内再回来不清。 */
  if(!scanWipedOnce){
    scanWipedOnce = true;
    if(ORDER.some(k => G.collected[k])){
      ORDER.forEach(k => { G.collected[k] = false; });
      saveStore();
    }
    G.idx = 0;
  }
  // 目标对准第一个还没收集的角色（全齐了就停在最后一个，方便直接去拍）
  if(!allDone()){
    G.idx = Math.max(0, ORDER.findIndex(k => !G.collected[k]));
  }
  document.body.classList.remove('showing', 'capturing');
  overEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  showEl.classList.add('hide');
  scanSheet.classList.remove('hide');
  buildBar();
  buildTip();
  scanDbg.textContent = '';
  scanFrameEl.classList.remove('warm');
  SCAN.hits = 0; SCAN.wrongHits = 0;
  const hasAny = ORDER.some(k => G.collected[k]);
  scanGoBtn.classList.toggle('show', hasAny);
  scanGoSub.classList.toggle('show', hasAny);

  const ok = await openCam('environment');
  if(!ok){
    scanDbg.textContent = '摄像头打不开（需要 https 或 localhost）';
    camFailBtn.hidden = false;
    toast('摄像头不可用，请检查权限');
    return;
  }
  camFailBtn.hidden = true;
  scanDbg.textContent = '';
  // 等摄像头画面稳定再开始识别，避免启动瞬间全黑/噪点画面被误判成图形
  await wait(CONFIG.scanWarmup);
  SCAN.running = true;
}

/* 扫到了：解锁伙伴 + 上场表演 */
function onFound(key){
  if(G.state !== 'scan' || !SCAN.running) return;
  SCAN.running = false;
  scanFrameEl.classList.remove('warm');
  scanSheet.classList.add('hide');
  SFX.lock();

  if(!G.collected[key]){
    G.collected[key] = true;
    saveStore();
  }
  G.idx = ORDER.indexOf(key);

  showCharacter(key);
}

/* 看完表演：继续找下一个 / 全齐了去结算 */
function showNext(){
  ensureAudio();
  hideShow();
  if(allDone()){
    showOver();
    return;
  }
  bootScan();
}

/* 结算：已收集的伙伴 */
function showOver(){
  G.state = 'over';
  hideShow();
  scanSheet.classList.add('hide');
  SFX.win();
  refreshOverCards();
  overEl.classList.remove('hide');
}

/* 刷新结算页的卡片与文案（重进结算页时也要走一遍，否则会留着旧内容） */
function refreshOverCards(){
  buildCards();
  const n = ORDER.filter(k => G.collected[k]).length;
  const t = $('overTitle'), s = $('overSub');
  if(allDone()){
    t.textContent = '三个伙伴都找到啦';
    s.textContent = '和它们一起拍张合照吧';
  } else {
    t.textContent = '已收集的伙伴';
    s.textContent = '继续扫描，认识更多伙伴吧';
  }
  $('photoBtn').style.display = n > 0 ? '' : 'none';
}

function buildCards(){
  tplCards.innerHTML = '';
  ORDER.forEach(k => {
    if(!G.collected[k]) return;      // 收集了谁就显示谁
    const c = CHARS[k];
    const d = document.createElement('div');
    d.className = 'tplCard';
    d.innerHTML = '<img src="' + c.img + Q + '" alt=""><span class="nm">' + c.name
                + '</span><span class="st">已收集</span>';
    tplCards.appendChild(d);
  });
  // 一个都没有时给个空态
  if(!tplCards.children.length){
    const e = document.createElement('div');
    e.className = 'emptyCards';
    e.textContent = '还没有收集到伙伴，去扫描贴纸吧';
    tplCards.appendChild(e);
  }
}

/* 「继续寻找」：回扫描页 */
function collectLater(){
  overEl.classList.add('hide');
  bootScan();
}

/* =========================================================================
/* =========================================================================
   9. 拍照：全屏实景 + 可拖动伙伴贴纸
   ========================================================================= */
/* 成片尺寸：跟随屏幕比例（长边 1350），这样贴纸从屏幕映射到成片是
   统一等比缩放，不会被压扁/拉长。之前固定 1080×1350（4:5），而手机屏幕
   接近 9:19.5，两个比例不同导致贴纸横向 scale 大于纵向 scale → 照片里的
   贴纸被压变形。 */
function outSize(){
  const maxDim = 1350;
  const k = maxDim / Math.max(W, H);
  return { w: Math.max(1, Math.round(W * k)), h: Math.max(1, Math.round(H * k)) };
}

/* =========================================================================
   8b. 端上人像分割（MediaPipe WASM，画面不出设备）
   作用：把「你」抠成单独一层，插在贴纸图层中间 ——
         z 小的贴纸排在你后面（被你挡住），z 大的排在你前面。
   ========================================================================= */
const SEG = {
  ready:false, loading:false, failed:false, on:false,
  seg:null, mask:null, maskCtx:null, lastT:0, busy:false,
};

/* wasm 有 9.4MB，只在第一次进拍照页时拉。走 blob 的原因：
   线上分享链接只放行带 sharecode 的静态资源，而 MediaPipe 内部拼的
   URL 带不上参数，会 403 —— 所以这里自己带参下载，再把内存里的
   内容以 blob URL 交给它，两个地址都不经过网关。 */
async function ensureSeg(){
  if(SEG.ready || SEG.loading || SEG.failed) return;
  SEG.loading = true;
  const base = 'vendor/mediapipe/';
  try{
    const [mod, jsTxt, wasmBuf, modelBuf] = await Promise.all([
      import('./' + base + 'vision_bundle.mjs' + Q),
      fetch(base + 'wasm/vision_wasm_internal.js' + Q).then(r => r.text()),
      fetch(base + 'wasm/vision_wasm_internal.wasm' + Q).then(r => r.arrayBuffer()),
      fetch(base + 'selfie_segmenter.tflite' + Q).then(r => r.arrayBuffer()),
    ]);
    const fileset = {
      wasmLoaderPath: URL.createObjectURL(new Blob([jsTxt], { type:'text/javascript' })),
      wasmBinaryPath: URL.createObjectURL(new Blob([wasmBuf], { type:'application/wasm' })),
    };
    const opts = d => ({
      baseOptions: { modelAssetBuffer: new Uint8Array(modelBuf), delegate: d },
      runningMode: 'VIDEO',
      outputCategoryMask: false,
      outputConfidenceMasks: true,
    });
    let seg = null;
    try{ seg = await mod.ImageSegmenter.createFromOptions(fileset, opts('GPU')); }
    catch(e){ seg = await mod.ImageSegmenter.createFromOptions(fileset, opts('CPU')); }
    if(!seg) throw new Error('no segmenter');
    SEG.seg = seg;
    SEG.ready = true;
    SEG.on = true;
    capPersonEl.classList.add('on');
    applyStickerZ();                 // 人物层插进来，重排一次层级
  }catch(e){
    SEG.failed = true;
    SEG.err = String((e && e.message) || e);
    console.warn('[seg] 人像分割不可用，贴纸全部按「在人前面」处理', e);
  }finally{
    SEG.loading = false;
  }
}

/* 置信度图 → alpha 掩膜。0.22 以下丢掉、0.62 以上全留，中间软过渡。 */
function segMask(m){
  const w = m.width, h = m.height;
  const f = m.getAsFloat32Array();
  if(!SEG.mask || SEG.mask.width !== w || SEG.mask.height !== h){
    SEG.mask = document.createElement('canvas');
    SEG.mask.width = w; SEG.mask.height = h;
    SEG.maskCtx = SEG.mask.getContext('2d');
  }
  let mx = 0;
  for(let i = 0; i < f.length; i += 89) if(f[i] > mx) mx = f[i];
  const k = mx > 1.5 ? 1 / 255 : 1;          // 个别后端给 0..255
  const img = SEG.maskCtx.createImageData(w, h);
  const d = img.data;
  for(let i = 0, p = 0; i < w * h; i++, p += 4){
    const v = f[i] * k;
    const a = v <= 0.22 ? 0 : v >= 0.62 ? 255 : ((v - 0.22) / 0.40 * 255) | 0;
    d[p] = 255; d[p + 1] = 255; d[p + 2] = 255; d[p + 3] = a;
  }
  SEG.maskCtx.putImageData(img, 0, 0);
}

/* 把「只有你」画到画布上：相机帧按 cover 铺好，再用掩膜抠掉背景。
   实时预览和成片共用这一份，镜像规则和 shoot() 画背景完全一致。
   注意必须在离屏画布上抠（destination-in 会把整张画布一起擦掉，
   直接画在成片上会把背景清成透明），抠完再整张贴回去。 */
let _personBuf = null;
function paintPerson(g, cw, ch){
  if(!SEG.mask || !camEl.videoWidth) return false;
  if(!_personBuf) _personBuf = document.createElement('canvas');
  if(_personBuf.width !== cw || _personBuf.height !== ch){
    _personBuf.width = cw; _personBuf.height = ch;
  }
  const b = _personBuf.getContext('2d');
  b.clearRect(0, 0, cw, ch);

  const vw = camEl.videoWidth, vh = camEl.videoHeight;
  const sc = Math.max(cw / vw, ch / vh);
  const dw = vw * sc, dh = vh * sc;
  const dx = (cw - dw) / 2, dy = (ch - dh) / 2;
  b.save();
  if(camFacing === 'user'){ b.translate(cw, 0); b.scale(-1, 1); }
  b.drawImage(camEl, cw - dx - dw, dy, dw, dh);
  b.globalCompositeOperation = 'destination-in';
  b.drawImage(SEG.mask, cw - dx - dw, dy, dw, dh);
  b.restore();

  g.drawImage(_personBuf, 0, 0, cw, ch);
  return true;
}

/* 每帧：低频跑一次分割（约 8fps），再用最新掩膜 + 当前帧合成人物层。
   掩膜慢半拍没关系，画面像素是实时的，只有边缘会略滞后。 */
function updatePersonLayer(now){
  if(G.state !== 'capture' || !SEG.on || !capPersonEl) return;
  const rw = stickerLayer.clientWidth, rh = stickerLayer.clientHeight;
  if(rw < 8 || rh < 8) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.round(rw * dpr), ch = Math.round(rh * dpr);
  if(capPersonEl.width !== cw || capPersonEl.height !== ch){
    capPersonEl.width = cw; capPersonEl.height = ch;
  }
  const g = capPersonEl.getContext('2d');
  g.clearRect(0, 0, cw, ch);

  if(SEG.ready && !SEG.busy && camEl.videoWidth && now - SEG.lastT > 120){
    SEG.busy = true; SEG.lastT = now;
    try{
      const res = SEG.seg.segmentForVideo(camEl, now);
      const ms = res && res.confidenceMasks;
      if(ms && ms[0]) segMask(ms[0]);
      if(res && res.close) res.close();
    }catch(e){ /* 单帧失败不打断，等下一帧 */ }
    SEG.busy = false;
  }
  paintPerson(g, cw, ch);
}

/* =========================================================================
   8b. 脏污 → 擦干净
   伙伴的工作面上先蒙一层灰（灰色污渍 + 擦痕 + 细点），它干活时一路擦过去，
   走过的地方被擦掉。脏污层在实景画布之上、3D 角色之下，所以是被"擦"出来的。
   ========================================================================= */
const GRIME = { cv:null, g:null, on:false, key:null, zone:null, dpr:1, wiped:0 };

function grimeClear(){
  GRIME.on = false;
  GRIME.key = null;
  GRIME.zone = null;
  if(!GRIME.cv) return;
  GRIME.cv.classList.remove('on');
  const g = GRIME.g;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, GRIME.cv.width, GRIME.cv.height);
}

/* 角色当前在屏幕上的包围盒（像素）。3D 用模型外壳投影，2D 用立绘落点。 */
function showScreenBox(){
  if(R3.flat || !R3.fit || !R3.spin || !R3.spin.children.length || !R3.camera) return null;
  const obj = R3.spin.children[0];
  const box = R3.fit.box;
  if(!box || !isFinite(box.min.x)) return null;
  obj.updateWorldMatrix(true, false);
  const M = obj.matrixWorld;
  const v = new THREE.Vector3();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for(const X of [box.min.x, box.max.x])
  for(const Y of [box.min.y, box.max.y])
  for(const Z of [box.min.z, box.max.z]){
    v.set(X, Y, Z).applyMatrix4(M).project(R3.camera);
    const sx = (v.x * 0.5 + 0.5) * W, sy = (-v.y * 0.5 + 0.5) * H;
    if(sx < x0) x0 = sx; if(sx > x1) x1 = sx;
    if(sy < y0) y0 = sy; if(sy > y1) y1 = sy;
  }
  if(!isFinite(x0) || x1 < x0) return null;
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, w: x1 - x0, h: y1 - y0 };
}

/* 每块工作面的脏污范围。水平面（地板/桌子）压扁成椭圆，垂直面（玻璃）基本是圆的。 */
function grimeZoneFor(key){
  const c = CHARS[key];
  let b = null;
  if(R3.flat){
    const img = R3.flatImg;
    const hh = H * 0.38;
    const ww = hh * ((img && img.naturalWidth) ? img.naturalWidth / img.naturalHeight : 1.26);
    b = { cx: W / 2, cy: H * 0.60 - hh * 0.42, w: ww, h: hh };
  } else {
    b = showScreenBox();
  }
  if(!b) return null;
  const vertical = c.plane === '垂直平面';
  // 包围盒里含了整圈轨迹，直接按它铺会糊满屏，收一档并夹在画面内
  const rx = clamp(b.w * 0.88, W * 0.26, W * 0.58);
  const ry = rx * (vertical ? 0.95 : 0.32);
  return { cx: clamp(b.cx, rx * 0.55, W - rx * 0.55), cy: b.cy + b.h * 0.04, rx, ry };
}

/* 脏污的绘制：一层薄灰 + 大块斑 + 抹痕 + 砂砾点，最后用径向遮罩把边缘化开。 */
function drawDirt(g, z){
  const { cx, cy, rx, ry } = z;
  const rand = (a, b) => a + Math.random() * (b - a);
  g.save();
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.clip();

  // ① 底色：一层很淡的灰，先把这块面"压旧"
  g.fillStyle = 'rgba(124,116,101,.13)';
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill();

  // ② 大块斑：深浅两色交叠，别让灰面太平
  for(let i = 0; i < 26; i++){
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random()) * 0.92;
    const x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r;
    const rad = rand(0.16, 0.40) * rx;
    const dark = Math.random() < 0.45;
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, dark ? 'rgba(86,78,64,.13)' : 'rgba(163,157,144,.11)');
    rg.addColorStop(1, dark ? 'rgba(86,78,64,0)'   : 'rgba(163,157,144,0)');
    g.fillStyle = rg;
    g.beginPath();
    g.ellipse(x, y, rad, rad * (ry / rx) * 1.6, 0, 0, Math.PI * 2);
    g.fill();
  }

  // ③ 抹痕：一道一道的短灰条，像之前有人抹过一遍没抹干净
  g.lineCap = 'round';
  for(let i = 0; i < 54; i++){
    const y = cy + rand(-0.85, 0.85) * ry;
    const x = cx + rand(-0.9, 0.9) * rx;
    const len = rand(0.05, 0.22) * rx;
    g.strokeStyle = 'rgba(92,84,72,' + rand(0.04, 0.11).toFixed(3) + ')';
    g.lineWidth = Math.max(0.8, rand(1, 1 + ry * 0.045));
    g.beginPath();
    g.moveTo(x - len / 2, y);
    g.lineTo(x + len / 2, y + rand(-0.06, 0.06) * ry);
    g.stroke();
  }

  // ④ 砂砾：细点最能把"脏"讲清楚
  for(let i = 0; i < 320; i++){
    const a = rand(0, Math.PI * 2), r = Math.sqrt(Math.random());
    const x = cx + Math.cos(a) * rx * r, y = cy + Math.sin(a) * ry * r;
    g.fillStyle = 'rgba(70,63,53,' + rand(0.05, 0.16).toFixed(3) + ')';
    const s = rand(0.5, 1.7);
    g.beginPath(); g.ellipse(x, y, s, s * 0.85, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();

  // ⑤ 边缘化开，别留一圈硬边
  g.save();
  g.globalCompositeOperation = 'destination-in';
  const mask = g.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  mask.addColorStop(0,    'rgba(0,0,0,1)');
  mask.addColorStop(0.45, 'rgba(0,0,0,.95)');
  mask.addColorStop(0.78, 'rgba(0,0,0,.55)');
  mask.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = mask;
  g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

/* 按当前范围整块重画（布局/旋屏后要重新量） */
function grimeRepaint(){
  if(!GRIME.on || !GRIME.zone) return;
  const g = GRIME.g;
  g.save();
  g.setTransform(GRIME.dpr, 0, 0, GRIME.dpr, 0, 0);
  g.globalCompositeOperation = 'source-over';
  g.clearRect(0, 0, W, H);
  drawDirt(g, GRIME.zone);
  g.restore();
}

function grimeBegin(key){
  if(!GRIME.cv){
    GRIME.cv = $('grime');
    if(!GRIME.cv) return;
    GRIME.g = GRIME.cv.getContext('2d');
  }
  const z = grimeZoneFor(key);
  if(!z){ grimeClear(); return; }

  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const cv = GRIME.cv;
  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width  = W + 'px';
  cv.style.height = H + 'px';
  GRIME.dpr = dpr;
  GRIME.zone = z;
  GRIME.key = key;
  GRIME.on = true;
  GRIME.wiped = 0;
  GRIME.frames = 0;
  grimeRepaint();
  cv.classList.add('on');
}

/* 在 (x,y) 处擦一把。用 destination-out 擦掉脏污，露出下面的干净画面。 */
function grimeWipe(x, y, rad, squash){
  if(!GRIME.on) return;
  const g = GRIME.g;
  g.save();
  g.globalCompositeOperation = 'destination-out';
  const rg = g.createRadialGradient(x, y, 0, x, y, rad);
  rg.addColorStop(0,    'rgba(0,0,0,1)');
  rg.addColorStop(0.5,  'rgba(0,0,0,.9)');
  rg.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(x, y, rad, rad * squash, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

/* 每帧跟着角色的位置擦。前几帧画面还没完全落定，顺手把范围重量一遍。 */
function grimeUpdate(){
  if(!GRIME.on || !GRIME.key) return;
  if(GRIME.frames < 4){
    GRIME.frames++;
    const z = grimeZoneFor(GRIME.key);
    if(z){ GRIME.zone = z; grimeRepaint(); }
  }
  const b = showScreenBox();
  if(!b) return;
  const vertical = CHARS[GRIME.key] && CHARS[GRIME.key].plane === '垂直平面';
  const rad = clamp(b.w * 0.40, 26, W * 0.24);
  grimeWipe(b.cx, b.cy + b.h * 0.08, rad, vertical ? 1.0 : 0.52);
  GRIME.wiped++;
}


/* =========================================================================
   8c. 3D 版脏污：一块贴在"工作面"上的平面，纹理被伙伴一路擦掉
   地板/桌子是水平面（透视压扁），玻璃是竖在身后的竖直面。
   脏污画在画布纹理上，用 destination-out 按角色的真实位置擦，
   所以擦痕是留在地面上的印子，不是一个糊在屏幕上的灰团。
   ========================================================================= */
function paintDirtTexture(g, cw, ch){
  const rand = (a, b) => a + Math.random() * (b - a);
  g.clearRect(0, 0, cw, ch);

  // ① 整面压一层薄灰
  g.fillStyle = 'rgba(128,120,104,.40)';
  g.fillRect(0, 0, cw, ch);

  // ② 深一块浅一块的斑
  for(let i = 0; i < 80; i++){
    const x = rand(0, cw), y = rand(0, ch);
    const rad = rand(0.04, 0.15) * cw;
    const dark = Math.random() < 0.5;
    const rg = g.createRadialGradient(x, y, 0, x, y, rad);
    rg.addColorStop(0, dark ? 'rgba(78,70,56,.26)' : 'rgba(186,180,166,.30)');
    rg.addColorStop(1, dark ? 'rgba(80,72,58,0)'   : 'rgba(170,164,150,0)');
    g.fillStyle = rg;
    g.beginPath(); g.ellipse(x, y, rad, rad * rand(0.45, 1), 0, 0, Math.PI * 2); g.fill();
  }

  // ③ 抹痕
  g.lineCap = 'round';
  for(let i = 0; i < 90; i++){
    const x = rand(0, cw), y = rand(0, ch), len = rand(0.03, 0.14) * cw;
    g.strokeStyle = 'rgba(88,80,68,' + rand(0.08, 0.20).toFixed(3) + ')';
    g.lineWidth = Math.max(0.8, rand(1, cw * 0.006));
    g.beginPath();
    g.moveTo(x - len / 2, y);
    g.lineTo(x + len / 2, y + rand(-0.02, 0.02) * ch);
    g.stroke();
  }

  // ④ 砂砾
  for(let i = 0; i < 900; i++){
    const x = rand(0, cw), y = rand(0, ch);
    g.fillStyle = 'rgba(64,57,47,' + rand(0.10, 0.30).toFixed(3) + ')';
    const s = rand(0.5, 1.6);
    g.beginPath(); g.ellipse(x, y, s, s * 0.85, 0, 0, Math.PI * 2); g.fill();
  }

  // ⑤ 四边淡出，免得看到平面边界
  g.save();
  g.globalCompositeOperation = 'destination-in';
  const m = g.createRadialGradient(cw / 2, ch / 2, 0, cw / 2, ch / 2, Math.max(cw, ch) * 0.62);
  m.addColorStop(0,   'rgba(0,0,0,1)');
  m.addColorStop(0.55,'rgba(0,0,0,1)');
  m.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = m;
  g.fillRect(0, 0, cw, ch);
  g.restore();
}

function clearDirt(){
  const D = R3.dirt;
  if(!D) return;
  if(D.mesh && D.mesh.parent) D.mesh.parent.remove(D.mesh);
  if(D.mesh){
    D.mesh.geometry.dispose();
    if(D.mesh.material){ if(D.mesh.material.map) D.mesh.material.map.dispose(); D.mesh.material.dispose(); }
  }
  R3.dirt = null;
}

/* 造一块脏污平面。挂在 pivot 上 —— 跟着俯视角一起转，
   于是"地板/桌面"的倾斜和角色是完全一致的（正对相机的那块假地面）。
   不挂在 mover/spin 上：桌子地面不该跟着角色一起走、一起转。
   返回 false 表示这台设备用不了（走 2D 兜底）。 */
function buildDirt(key){
  clearDirt();
  if(!R3.ok || R3.flat || !R3.pivot || !R3.fit) return false;
  const c = CHARS[key];
  const vertical = c.plane === '垂直平面';
  const box = R3.fit.box, s = R3.fit.s;
  if(!box || !isFinite(box.min.x) || s <= 0) return false;

  const cx = (box.max.x + box.min.x) / 2;
  const cy = (box.max.y + box.min.y) / 2;
  const cz = (box.max.z + box.min.z) / 2;
  const spanZ = Math.max(box.max.z - box.min.z, 1e-3);

  /* 尺寸按"画面"给，不按角色体块给 —— 一眼要看出是"这一片地面/这扇玻璃脏"，
     只糊住角色屁股底下那一小块就太小气了。
     注意 pivot/mover 都不带缩放（缩放在 obj 自己身上），所以这里就是世界尺寸。 */
  const pw = vertical ? R3.visW * 0.92 : R3.visW * 1.15;
  const ph = vertical ? R3.visH * 0.66 : R3.visH * 0.54;
  const cw = 720, ch = Math.max(200, Math.round(cw * ph / pw));
  const cv = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const g = cv.getContext('2d');
  paintDirtTexture(g, cw, ch);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
  mesh.renderOrder = -2;

  if(vertical){
    // 脏玻璃：竖在角色身后，朝镜头
    mesh.position.set(cx, cy, box.min.z - Math.max(spanZ * 0.12, 0.006));
  } else {
    // 脏地面 / 脏桌面：平铺在动作面上
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(cx, box.min.y + 0.002, cz);
  }
  R3.pivot.add(mesh);

  // 擦除半径：按角色体块宽度换算成纹理像素（模型空间，除 pw 分母一致）
  const bodyW = Math.max(box.max.x - box.min.x, spanZ) * 0.30;
  const D = {
    mesh, tex, cv, g, cw, ch, vertical,
    cx, cy, cz, pw, ph,
    radiusPx: clamp(bodyW / pw * cw, cw * 0.045, cw * 0.13),
    acc: 0, wipes: 0, pts: [], coverPx: 0,
  };

  /* 老师的要求：擦一圈就要把整面擦干净，不是只擦出一条路。
     做法：采样整条轨迹（模型空间 → 纹理 UV），每帧沿轨迹描一遍、
     线宽随"本圈进度"从体块宽一路涨到"离轨迹最远的角落"，一圈末正好盖满全面。 */
  if(R3.mixer && R3.clip && R3.rootBone){
    const save = R3.mixer.time;
    const v = new THREE.Vector3();
    const N = 140;
    for(let i = 0; i < N; i++){
      R3.mixer.setTime(R3.clip.duration * i / N);
      R3.rootBone.updateWorldMatrix(true, false);
      R3.rootBone.getWorldPosition(v);
      R3.pivot.worldToLocal(v);
      D.pts.push(dirtUV(D, v));
    }
    R3.mixer.setTime(save);              // 采样完把动画时间放回去
    if(D.pts.length > 8){
      let cover = 0;
      const GX = 40, GY = 26;
      for(let ix = 0; ix <= GX; ix++) for(let iy = 0; iy <= GY; iy++){
        const pv = new THREE.Vector3(
          D.cx - D.pw / 2 + D.pw * ix / GX,
          D.vertical ? D.cy - D.ph / 2 + D.ph * iy / GY : cy,
          D.vertical ? cz : D.cz - D.ph / 2 + D.ph * iy / GY);
        const q = dirtUV(D, pv);
        let best = 1e9;
        for(const pt of D.pts){
          const dd = (pt[0] - q[0]) * (pt[0] - q[0]) + (pt[1] - q[1]) * (pt[1] - q[1]);
          if(dd < best) best = dd;
        }
        cover = Math.max(cover, Math.sqrt(best));
      }
      D.coverPx = Math.min(cover * 1.04, Math.max(D.cw, D.ch));
    }
  }

  R3.dirt = D;
  return true;
}

/* 模型空间一点 → 脏污纹理 UV */
function dirtUV(D, v){
  const u = (v.x - (D.cx - D.pw / 2)) / D.pw * D.cw;
  const w = D.vertical
    ? ((D.cy + D.ph / 2) - v.y) / D.ph * D.ch
    : (v.z - (D.cz - D.ph / 2)) / D.ph * D.ch;
  return [u, w];
}

/* 每帧在角色脚下擦一把（20fps 就够，纹理上传别太勤） */
function updateDirt(dt){
  const D = R3.dirt;
  if(!D || !R3.pivot) return;
  D.acc += dt;
  if(D.acc < 0.05) return;
  D.acc = 0;

  /* 一圈擦净后（收尾窗口 dur*2.2 走完），整块平面直接收掉：
     画布理论上已全透明，这里再兜一道，任何设备上都不会残出边。 */
  if(R3.mixer && R3.clip && R3.mixer.time > R3.clip.duration * 2.3){
    if(D.mesh.visible) D.mesh.visible = false;
  }

  const v = new THREE.Vector3();
  const bone = R3.rootBone;
  if(bone) bone.getWorldPosition(v);
  else if(R3.mover) R3.mover.getWorldPosition(v);
  else return;
  R3.pivot.worldToLocal(v);              // 世界坐标 → 模型空间（含俯视旋转）

  const [u, w] = dirtUV(D, v);
  if(u < -D.cw * 0.3 || u > D.cw * 1.3 || w < -D.ch * 0.3 || w > D.ch * 1.3) return;

  const g = D.g;
  const r = D.radiusPx;
  g.save();
  g.globalCompositeOperation = 'destination-out';
  const rg = g.createRadialGradient(u, w, 0, u, w, r);
  rg.addColorStop(0,   'rgba(0,0,0,1)');
  rg.addColorStop(0.5, 'rgba(0,0,0,.92)');
  rg.addColorStop(1,   'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(u, w, r, r * (D.vertical ? 1 : 0.88), 0, 0, Math.PI * 2); g.fill();

  /* 擦一圈全干净：沿整条轨迹描边，线宽随本圈进度从体块宽涨到最远角落，
     一圈末正好盖满整个工作面。圈末再多描一会儿（宽度已到顶），
     保证最远的角落也被盖到，之后全干净就不用再描。 */
  if(D.pts.length > 8 && R3.mixer && R3.clip){
    const dur = R3.clip.duration;
    if(R3.mixer.time < dur * 2.2){
      const p = Math.min(1, R3.mixer.time / dur);
      /* lineWidth 是"单边半径"的两倍：最远角落离轨迹 coverPx，
         线宽要涨到 2×coverPx 才能把整个工作面盖满 */
      const wid = D.radiusPx * 0.9 + (D.coverPx * 2 - D.radiusPx * 0.9) * p;
      if(wid > 2){
        g.lineCap = 'round'; g.lineJoin = 'round';
        const poly = () => {
          g.beginPath();
          g.moveTo(D.pts[0][0], D.pts[0][1]);
          for(let i = 1; i < D.pts.length; i++) g.lineTo(D.pts[i][0], D.pts[i][1]);
          g.stroke();
        };
        g.strokeStyle = 'rgba(0,0,0,.55)'; g.lineWidth = wid; poly();
        g.strokeStyle = 'rgba(0,0,0,.9)';  g.lineWidth = wid * 0.72; poly();
      }
    }
  }
  g.restore();

  D.tex.needsUpdate = true;
  D.wipes++;
}

let shotDataUrl = '';
let placedStickers = [];        // { key, el, cv, x, y, w, h, z }  x/y = 左上角(CSS px)
let stickerSeq = 0;
let selSticker = null;          // 当前选中的贴纸（调前后遮挡用）

/* 伙伴贴纸默认尺寸（CSS px，占画面宽比例） */
const STICKER_W = () => Math.round(Math.min(W, H) * 0.28);

/* =========================================================================
   9b. 3D 贴纸：拖出来的伙伴是立体模型，不是平面立绘
   characters/static/*.glb 是三个 IP 的静态模型（原始 FBX 抽面后导出，
   高度归一到 1、原点在体块中心）。这里用一块共享的离屏 WebGL 画布
   逐个渲染，再各自贴回自己那张 2D 画布 —— 拖动、缩放、图层、成片
   全都还是原来那套逻辑，只是"图"变成了会转的立体像。
   ========================================================================= */
const S3D = {
  ok:false, cv:null, renderer:null, scene:null, camera:null,
  models:{}, pending:{}, t:0, acc:0,
  live:512, shot:1024,
};

function initS3D(){
  if(S3D.ok) return true;
  if(!window.THREE || !window.GLTFLoader) return false;
  if(!webglSupported()) return false;
  try{
    const cv = document.createElement('canvas');
    cv.width = cv.height = S3D.live;
    const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
    r.setClearColor(0x000000, 0);
    r.setPixelRatio(1);
    r.setSize(S3D.live, S3D.live, false);

    S3D.renderer = r;
    S3D.cv = cv;
    S3D.scene = new THREE.Scene();
    S3D.scene.add(new THREE.AmbientLight(0xffffff, 1.15));
    const key = new THREE.DirectionalLight(0xffffff, 2.0); key.position.set(1.6, 2.8, 4.4); S3D.scene.add(key);
    const rim = new THREE.DirectionalLight(0xffffff, 1.0); rim.position.set(-2.2, 1.0, -2.4); S3D.scene.add(rim);
    const fill = new THREE.DirectionalLight(0xffffff, 0.55); fill.position.set(0.4, -2.2, 2.4); S3D.scene.add(fill);

    S3D.camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
    S3D.camera.position.set(0, 0, 4);
    S3D.ok = true;
  }catch(e){ S3D.ok = false; }
  return S3D.ok;
}

function loadStatic(key){
  if(S3D.models[key]) return Promise.resolve(S3D.models[key]);
  if(S3D.pending[key]) return S3D.pending[key];
  const c = CHARS[key];
  S3D.pending[key] = new Promise((resolve, reject) => {
    if(!c || !c.static || !window.GLTFLoader){ reject(new Error('没有静态模型')); return; }
    new window.GLTFLoader().load(c.static + Q, g => {
      const obj = g.scene;
      obj.traverse(o => {
        if(o.isMesh){
          o.frustumCulled = false;
          const ms = Array.isArray(o.material) ? o.material : [o.material];
          ms.forEach(mt => { if(mt){ mt.roughness = Math.min(mt.roughness == null ? 0.5 : mt.roughness, 0.55); mt.needsUpdate = true; } });
        }
      });
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(); box.getSize(size);
      c._ar = size.x / Math.max(size.y, 1e-6);      // 轮廓长宽比：贴纸盒子照它摆
      S3D.models[key] = { obj, size, box };         // box 要留着：取景时按 8 个角点算，才不会被切
      resolve(S3D.models[key]);
    }, undefined, e => { S3D.pending[key] = null; reject(e); });
  });
  return S3D.pending[key];
}

/* 贴纸模型在当前姿态（tilt/yaw）+ 呼吸缩放下的相机空间范围：
   半高、半宽、以及"最靠近镜头那一面"的深度。相机沿 +Z 看向 -Z，
   所以 z 越大越靠前 —— 取景必须按最前面那一面留距离，才不会被切。 */
const _ext = { e:null, m:null, v:null };
function stickerExtent(m, tilt, yaw, k, py){
  const b = m.box;
  if(!b || !window.THREE){
    return { halfH: m.size.y * 0.55, halfW: m.size.x * 0.55, zNear: m.size.z * 0.5 };
  }
  const T = window.THREE;
  if(!_ext.e){ _ext.e = new T.Euler(); _ext.m = new T.Matrix4(); _ext.v = new T.Vector3(); }
  _ext.e.set(tilt, yaw, 0);
  _ext.m.makeRotationFromEuler(_ext.e);
  let hH = 0, hW = 0, zN = -1e9;
  const v = _ext.v;
  for(const X of [b.min.x, b.max.x])
  for(const Y of [b.min.y, b.max.y])
  for(const Z of [b.min.z, b.max.z]){
    v.set(X, Y, Z).applyMatrix4(_ext.m);
    const y = v.y * k + py, x = v.x * k, z = v.z * k;
    if(Math.abs(y) > hH) hH = Math.abs(y);
    if(Math.abs(x) > hW) hW = Math.abs(x);
    if(z > zN) zN = z;
  }
  const pad = 1.02;                 // 只留一丝边（抗锯齿用），别让模型白白缩小
  return { halfH: hH * pad, halfW: hW * pad, zNear: zN };
}

/* 把某个贴纸的模型渲染到共享画布上（返回 false = 模型还没好） */
function renderStickerModel(s, size){
  const m = S3D.models[s.key];
  if(!m || !S3D.ok) return false;
  const cam = S3D.camera;
  const asp = s.w / Math.max(s.h, 1);
  cam.aspect = asp;
  cam.updateProjectionMatrix();

  /* 只保留呼吸：整体轻微起伏 + 一点点上下浮动，朝向不再自己摆动
     （老师不要左右晃）。三个伙伴都有，靠 s.ph 错开相位，各在各的节拍上。 */
  const yaw  = (s.yaw0 || 0) + (s.dragYaw || 0);
  const tilt = (s.tilt || 0);
  const br   = Math.sin((S3D.t + (s.ph || 0)) * 1.6);      // -1 ~ 1，约 3.9s 一轮
  m.obj.rotation.set(tilt, yaw, 0);
  const k = 1 + br * 0.015;
  m.obj.scale.setScalar(k);
  const py = br * 0.010;
  m.obj.position.y = py;

  /* 取景：不能只按包围盒的宽高算 —— 手里的球球是伸在身前的，
     离镜头更近、透视放大更多，按中心平面取景就会把它切掉一块
     （老师反馈"球球被边挡住"）。
     这里把包围盒 8 个角点按当前姿态转到相机空间，取真实的
     上下/左右/前后范围，再按"最靠近镜头那一面"反推相机距离，
     保证整只（包括伸出来的手）都完整落在画布里。 */
  const tanV = Math.tan(cam.fov * Math.PI / 360);
  const need = stickerExtent(m, tilt, yaw, k, py);
  const d = need.zNear + Math.max(need.halfH / tanV, need.halfW / (tanV * asp));
  cam.position.set(0, 0, d);
  cam.lookAt(0, 0, 0);

  if(S3D.cv.width !== size){
    S3D.cv.width = S3D.cv.height = size;
    S3D.renderer.setSize(size, size, false);
  }
  S3D.scene.add(m.obj);
  S3D.renderer.render(S3D.scene, cam);
  S3D.scene.remove(m.obj);
  return true;
}

/* 单独重画一张贴纸画布 */
function paintSticker(s){
  if(!s.cv) return;
  const g = s.cv.getContext('2d');
  g.clearRect(0, 0, s.cv.width, s.cv.height);
  if(!renderStickerModel(s, S3D.live)) return;
  g.drawImage(S3D.cv, 0, 0, s.cv.width, s.cv.height);
}

/* 模型到位后把贴纸从平面立绘换成 3D，盒子比例顺手按模型轮廓修一下 */
function ensureSticker3D(s){
  if(!initS3D()) return;                       // 没有 WebGL：保持平面立绘
  loadStatic(s.key).then(() => {
    if(!s.el || !s.el.parentNode) return;
    s.ready = true;
    s.cv.style.display = 'block';
    const im = s.el.querySelector('img');
    if(im) im.style.display = 'none';

    const ar = CHARS[s.key]._ar;
    if(ar && Math.abs(s.w / s.h - ar) > 0.06){
      const nh = Math.round(s.w / ar);
      s.y += (s.h - nh) / 2;
      s.h = nh;
      applyStickerPos(s.el, s);
    }
    s.yaw0 = 0;                                  // 拖出来就正对镜头，不偏头
    paintSticker(s);
  }).catch(() => { /* 静默退回立绘 */ });
}

/* 拍照页每帧推进：~20fps 就够，别和相机/人物分割抢资源 */
function updateSticker3D(dt){
  if(!S3D.ok || G.state !== 'capture') return;
  S3D.acc += dt;
  if(S3D.acc < 0.05) return;
  S3D.t += S3D.acc;
  S3D.acc = 0;
  for(const s of placedStickers){
    if(!s.ready || !s.cv) continue;
    paintSticker(s);                                   // 只推进呼吸（见 renderStickerModel）
  }
}


/* 清空所有已摆放贴纸 */
function clearStickers(){
  placedStickers.forEach(s => { if(s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el); });
  placedStickers = [];
  selSticker = null;
  if(layerBarEl) layerBarEl.classList.remove('on');
}

/* 图层：按 z 从小到大排，大的压在上面（成片也照这个顺序画）。
   人物层固定占 PERSON_Z 这一档：贴纸从 1 开始编号 → 拖出来默认在人前面；
   点「放后面」会被推到 0 以下 → 落到人物层后面，被你自己挡住。 */
const PERSON_Z = 0;

function applyStickerZ(){
  const items = placedStickers.map(s => ({ el: s.el, z: s.z }));
  if(SEG.on && capPersonEl) items.push({ el: capPersonEl, z: PERSON_Z });
  items.sort((a, b) => a.z - b.z);
  items.forEach((it, i) => { if(it.el) it.el.style.zIndex = String(3 + i); });
}
function bringToFront(s){
  const maxZ = placedStickers.reduce((m,x) => Math.max(m, x.z), PERSON_Z);
  s.z = maxZ + 1;
  applyStickerZ();
}
function sendToBack(s){
  const minZ = placedStickers.reduce((m,x) => Math.min(m, x.z), PERSON_Z + 1);
  s.z = Math.min(minZ, PERSON_Z) - 1;
  applyStickerZ();
}

/* 选中 / 取消选中（选中后顶部出现「放前面 / 放后面」） */
function selectSticker(s){
  if(selSticker === s){
    selSticker = null;
    s.el.classList.remove('sel');
    layerBarEl.classList.remove('on');
    return;
  }
  if(selSticker && selSticker.el) selSticker.el.classList.remove('sel');
  selSticker = s;
  s.el.classList.add('sel');
  layerBarEl.classList.add('on');
}
function clearSelect(){
  if(selSticker && selSticker.el) selSticker.el.classList.remove('sel');
  selSticker = null;
  layerBarEl.classList.remove('on');
}

/* 删掉一个已摆放的伙伴 */
function removeSticker(s){
  if(!s) return;
  if(s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el);
  const i = placedStickers.indexOf(s);
  if(i >= 0) placedStickers.splice(i, 1);
  if(selSticker === s) clearSelect();
  applyStickerZ();
}

/* 手指是否落在垃圾桶上 */
function overTrash(x, y){
  if(!capTrashEl || capTrashEl.hidden) return false;
  const r = capTrashEl.getBoundingClientRect();
  if(!r.width) return false;
  const pad = 10;
  return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
}

/* 底部伙伴栏：传 keys 就只显示这些，不传就显示所有已收集的 */
function buildStickerBar(keys){
  stickerBarRow.innerHTML = '';
  const has = (keys && keys.length) ? keys.filter(k => CHARS[k])
                                    : ORDER.filter(k => G.collected[k]);
  if(!has.length){
    document.getElementById('stickerBarHint').textContent = '还没有收集到伙伴，先去扫描贴纸吧';
    return;
  }
  document.getElementById('stickerBarHint').textContent = '拖出伙伴 · 点一下调前后 · 拖到右上角删除';
  has.forEach(k => {
    const c = CHARS[k];
    const b = document.createElement('div');
    b.className = 'stickerSrc';
    b.dataset.key = k;
    b.innerHTML = '<img src="' + c.img + Q + '" alt="' + c.name + '">';
    b.addEventListener('pointerdown', e => onStickerSrcDown(e, k));
    stickerBarRow.appendChild(b);
  });
}

/* 从伙伴栏按下：生成一个跟随手指的贴纸 */
function onStickerSrcDown(e, key){
  e.preventDefault();
  const c = CHARS[key];
  const w = STICKER_W();
  const img = CHAR_IMG(key);
  const rect = c._ar || (img.naturalWidth ? (img.naturalWidth / Math.max(img.naturalHeight, 1)) : 1.26);
  const h = Math.round(w / Math.max(rect, 0.3));
  const el = document.createElement('div');
  el.className = 'sticker dragging';
  el.innerHTML = '<img src="' + c.img + Q + '" alt="' + c.name + '">';
  // 3D 版：先挂一张空画布，模型到位后把立绘换掉
  let cv = null;
  if(S3D.ok){
    cv = document.createElement('canvas');
    cv.width = cv.height = S3D.live;
    cv.style.display = 'none';
    el.appendChild(cv);
  }
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  stickerLayer.appendChild(el);

  const layerRect = stickerLayer.getBoundingClientRect();
  moveAt(e, el, w, h);
  el.style.zIndex = 20;

  const onMove = ev => {
    ev.preventDefault();
    moveAt(ev, el, w, h);
    const hot = overTrash(ev.clientX, ev.clientY);
    capTrashEl.classList.toggle('hot', hot);
    el.classList.toggle('overTrash', hot);
  };
  const onUp = ev => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    el.classList.remove('dragging', 'overTrash');
    el.style.zIndex = '';
    capTrashEl.classList.remove('hot');
    // 落点：中心在 layer 内则落位；拖到垃圾桶上或框外就丢弃
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const inLayer = cx >= layerRect.left && cx <= layerRect.right && cy >= layerRect.top && cy <= layerRect.bottom;
    if(inLayer && !overTrash(ev.clientX, ev.clientY)){
      const s = { key, el, cv, ready: false, ph: Math.random() * 6.28, yaw0: 0,
                  x: r.left - layerRect.left, y: r.top - layerRect.top,
                  w: r.width, h: r.height, z: ++stickerSeq };
      el.style.left = s.x + 'px';
      el.style.top  = s.y + 'px';
      el.style.transform = '';
      bindStickerDrag(el, s);
      placedStickers.push(s);
      applyStickerZ();
      ensureSticker3D(s);
    } else {
      if(el.parentNode) el.parentNode.removeChild(el);
    }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function moveAt(ev, el, w, h){
  const layerRect = stickerLayer.getBoundingClientRect();
  el.style.left = (ev.clientX - layerRect.left - w/2) + 'px';
  el.style.top  = (ev.clientY - layerRect.top - h/2) + 'px';
}

/* 统一应用贴纸位置与尺寸 */
function applyStickerPos(el, s){
  el.style.left = s.x + 'px';
  el.style.top  = s.y + 'px';
  el.style.width  = s.w + 'px';
  el.style.height = s.h + 'px';
}

/* 已摆放的贴纸：单指拖动位置，双指缩放大小，
   轻点一下选中（调前后遮挡），拖到右上角垃圾桶上松手即删除 */
function bindStickerDrag(el, s){
  const pointers = new Map();   // pointerId -> {x, y}
  let startDist = 0, startW = 0, startH = 0;
  let dragBase = null;          // 单指拖动基准
  let pinchBase = null;         // 双指缩放基准
  let moved = 0;                // 本次按下累计移动距离（判定轻点用）
  let hitTrash = false;

  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    el.classList.add('dragging');
    el.style.zIndex = 20;
    if(pointers.size === 1){ moved = 0; hitTrash = false; }

    if(pointers.size === 1){
      const p = pointers.get(e.pointerId);
      dragBase = { px: p.x, py: p.y, ox: s.x, oy: s.y };
      pinchBase = null;
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      startW = s.w; startH = s.h;
      const mx = (pts[0].x + pts[1].x) / 2;
      const my = (pts[0].y + pts[1].y) / 2;
      pinchBase = { mx, my, ox: s.x + s.w/2, oy: s.y + s.h/2 };
      dragBase = null;
    }
  });

  el.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved += Math.hypot(e.clientX - prev.x, e.clientY - prev.y);

    if(pointers.size === 1 && dragBase){
      // 单指拖动
      const p = pointers.get(e.pointerId);
      s.x = dragBase.ox + (p.x - dragBase.px);
      s.y = dragBase.oy + (p.y - dragBase.py);
      s.x = clamp(s.x, -s.w*0.5, stickerLayer.offsetWidth  - s.w*0.5);
      s.y = clamp(s.y, -s.w*0.5, stickerLayer.offsetHeight - s.h*0.5);
      applyStickerPos(el, s);
      /* 3D 贴纸跟着手的走向转一点：左右拖是侧转、上下拖是低头抬头，
         松手弹回去。让它看起来是个立体玩意儿，不是一张纸。 */
      if(s.ready){
        s.dragYaw = clamp((p.x - dragBase.px) * 0.0045, -0.65, 0.65);
        s.tilt    = clamp(-(p.y - dragBase.py) * 0.0022, -0.30, 0.30);
      }
      // 拖到右上角垃圾桶上方：高亮提示
      hitTrash = overTrash(e.clientX, e.clientY);
      capTrashEl.classList.toggle('hot', hitTrash);
      el.classList.toggle('overTrash', hitTrash);
    } else if(pointers.size === 2 && pinchBase){
      // 双指缩放（以两指中心为锚点）
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const ratio = startDist > 0 ? dist / startDist : 1;
      const maxW = Math.min(stickerLayer.offsetWidth, stickerLayer.offsetHeight) * 0.9;
      const nw = clamp(startW * ratio, 44, maxW);
      const nh = nw * (startH / startW);
      s.w = nw; s.h = nh;
      s.x = pinchBase.ox - nw/2;
      s.y = pinchBase.oy - nh/2;
      s.x = clamp(s.x, -s.w*0.5, stickerLayer.offsetWidth  - s.w*0.5);
      s.y = clamp(s.y, -s.w*0.5, stickerLayer.offsetHeight - s.h*0.5);
      applyStickerPos(el, s);
    }
  });

  const onUp = e => {
    if(!pointers.has(e.pointerId)) return;
    const dropOnTrash = pointers.size === 1 && moved > 4 && overTrash(e.clientX, e.clientY);
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      el.classList.remove('dragging', 'overTrash');
      el.style.zIndex = '';
      capTrashEl.classList.remove('hot');
      dragBase = null; pinchBase = null;
      s.dragYaw = 0; s.tilt = 0;                          // 3D 姿态弹回正面
      if(dropOnTrash){
        const nm = CHARS[s.key].name;
        removeSticker(s);                                  // 丢进垃圾桶：删掉
        toast('已删除 ' + nm);
        return;
      }
      if(moved <= 6){                                     // 轻点：选中 / 取消
        selectSticker(s);
      }
      applyStickerZ();
    } else if(pointers.size === 1){
      // 从双指回到单指：重新校准拖动基准
      const p = pointers.values().next().value;
      dragBase = { px: p.x, py: p.y, ox: s.x, oy: s.y };
      pinchBase = null;
    }
  };
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('lostpointercapture', onUp);
}

/* 打开拍照页
   opts.keys：底部白框里只放这些伙伴（不传 = 所有已收集的）
   opts.back：拍完点「完成」后回哪（'over' 结算页 / 'scan' 扫描页） */
let capKeys = null;        // 本次拍照可用的伙伴（null = 全部已收集）
let capBack = 'over';      // 拍完回哪

async function openCapture(opts){
  ensureAudio();
  capKeys = (opts && opts.keys) ? opts.keys.slice() : null;
  capBack = (opts && opts.back) || 'over';

  G.state = 'capture';
  overEl.classList.add('hide');
  scanSheet.classList.add('hide');
  shotEl.classList.add('hide');
  showEl.classList.add('hide');
  hideShow();                      // 清掉实景里的 3D 角色，拍照页画面留空
  capEl.classList.remove('hide');
  document.body.classList.add('capturing');

  clearStickers();
  buildStickerBar(capKeys);
  // 画面初始留空，伙伴从底部白框手动拖出来摆放

  SEG.lastT = 0;
  ensureSeg();          // 后台起人像分割（首次约 1~2 秒）；没好之前贴纸一律在最前面

  /* 3D 贴纸：先把渲染器和三个静态模型在后台热起来，
     等用户真的把伙伴拖出来时已经就绪，不会卡一下变平面 */
  if(initS3D()){
    const want = (capKeys && capKeys.length) ? capKeys : ORDER;
    want.forEach(k => loadStatic(k).catch(() => {}));
  }

  if(!camStream){
    await openCam(camFacing);
  } else {
    await ensureCamBg();
  }
}

/* 关闭拍照页 */
async function closeCapture(){
  capEl.classList.add('hide');
  shotEl.classList.add('hide');
  document.body.classList.remove('capturing');
  G.state = 'over';
  if(capPersonEl){                  // 清掉残留的人物层，下次进来不闪一帧旧画面
    const pg = capPersonEl.getContext('2d');
    pg.clearRect(0, 0, capPersonEl.width, capPersonEl.height);
  }

  // 从「和它合照」进来且还没收集齐：拍完直接回扫描页继续找
  if(capBack === 'scan' && !allDone()){
    overEl.classList.add('hide');
    await bootScan();
    return;
  }

  overEl.classList.remove('hide');
  refreshOverCards();
  if(!camStream){
    await openCam('environment');
  } else {
    await ensureCamBg();
  }
}

/* 快门：相机帧 + 所有贴纸 → 成片 → 直接「拍好啦」 */
function shoot(){
  const v = camEl;
  const { w: OUT_W, h: OUT_H } = outSize();
  const cc = document.createElement('canvas');
  cc.width = OUT_W; cc.height = OUT_H;
  const g = cc.getContext('2d');

  // 背景：相机画面 cover 铺满 4:5
  if(v && v.videoWidth){
    const vw = v.videoWidth, vh = v.videoHeight;
    const sc = Math.max(OUT_W / vw, OUT_H / vh);
    const dw = vw * sc, dh = vh * sc;
    const dx = (OUT_W - dw) / 2, dy = (OUT_H - dh) / 2;
    if(camFacing === 'user'){
      g.save(); g.translate(OUT_W, 0); g.scale(-1, 1);
      g.drawImage(v, OUT_W - dx - dw, dy, dw, dh);
      g.restore();
    } else {
      g.drawImage(v, dx, dy, dw, dh);
    }
  } else {
    g.fillStyle = '#EFE8DE';
    g.fillRect(0, 0, OUT_W, OUT_H);
  }

  // 贴纸：屏幕坐标 → 成片坐标。成片已按屏幕比例生成，横向/纵向 scale 一致，
  // 用统一 scale 等比放大，贴纸不被压扁。
  const layerRect = stickerLayer.getBoundingClientRect();
  const sc = OUT_W / layerRect.width;
  /* 按图层顺序画：人物层固定占 z=0 那一档。
     比它小的贴纸先画 → 被人物盖住；大的后画 → 压在人物身上。 */
  const items = placedStickers.map(s => ({ s, z: s.z }));
  if(SEG.on) items.push({ person: true, z: PERSON_Z });
  items.sort((a, b) => a.z - b.z);
  items.forEach(it => {
    if(it.person){ paintPerson(g, OUT_W, OUT_H); return; }
    const s = it.s;
    const dw = s.w * sc, dh = s.h * sc;
    /* 3D 贴纸：按成片分辨率重渲一遍再贴。屏幕上那张是 512²，
       直接放大到成片会发虚，所以这里单独渲一张 1024² 的。 */
    if(s.ready && S3D.ok && renderStickerModel(s, S3D.shot)){
      g.drawImage(S3D.cv, 0, 0, S3D.cv.width, S3D.cv.height, s.x * sc, s.y * sc, dw, dh);
      return;
    }
    const img = CHAR_IMG(s.key);
    if(!img || !img.naturalWidth) return;
    g.drawImage(img, s.x * sc, s.y * sc, dw, dh);
  });

  shotDataUrl = cc.toDataURL('image/jpeg', 0.92);
  shotImg.src = shotDataUrl;

  SFX.shutter();
  capEl.classList.add('hide');
  shotEl.classList.remove('hide');
}

/* 重新拍摄 */
function retake(){
  ensureAudio();
  shotEl.classList.add('hide');
  capEl.classList.remove('hide');
  if(!camStream) openCam(camFacing); else ensureCamBg();
}

function CHAR_IMG(key){
  const k = typeof key === 'string' ? key : key.key;
  if(!_charImgs[k]){
    const im = new Image();
    im.src = CHARS[k].img + Q;
    _charImgs[k] = im;
  }
  return _charImgs[k];
}
const _charImgs = {};

/* =========================================================================
   10. 主循环
   ========================================================================= */
let lastTs = 0, crashed = false, camHealAt = 0;

function render(){
  ctx.clearRect(0, 0, W, H);
  const needBg = (G.state === 'scan' || G.state === 'show' || G.state === 'capture');
  if(needBg) drawCamBg();

  if(G.state === 'show' && R3.flat) drawFlatShow();
}

function safeRender(){
  if(crashed) return;
  try{ render(); }
  catch(err){
    crashed = true;
    console.error('[render]', err);
    const el = document.createElement('div');
    el.id = 'crash';
    el.textContent = '渲染出错：' + (err && err.message ? err.message : err);
    document.body.appendChild(el);
  }
}

function loop(ts){
  const dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
  lastTs = ts;

  if(G.state === 'scan') updateScan(dt);
  if(G.state === 'show') syncShow(dt);
  if(G.state === 'capture'){ updatePersonLayer(ts); updateSticker3D(dt); }

  /* 摄像头自愈 */
  if(camStream && (camEl.paused || !camEl.videoWidth) && G.state !== 'capture' && ts > camHealAt){
    camHealAt = ts + 1200;
    ensureCamBg().catch(() => {});
  }

  if(R3.ok){
    R3.renderer.render(R3.scene, R3.camera);
  }
  safeRender();
  requestAnimationFrame(loop);
}

/* =========================================================================
   11. 绑定与启动
   ========================================================================= */
showNextBtn.addEventListener('click', () => { ensureAudio(); showNext(); });
showPhotoBtn.addEventListener('click', () => {
  ensureAudio();
  const k = showingKey;            // 先取：openCapture 会清掉展示态
  if(!k) return;
  openCapture({ keys: [k], back: 'scan' });
});
scanGoBtn.addEventListener('click', () => { ensureAudio(); showOver(); });
$('photoBtn').addEventListener('click', () => { openCapture(); });
$('laterBtn').addEventListener('click', () => { ensureAudio(); collectLater(); });
$('resetBtn').addEventListener('click', () => {
  // 清空进度，回到全新状态（应对"没收集却显示已收集"的残留）
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  ORDER.forEach(k => { G.collected[k] = false; });
  G.idx = 0;
  overEl.classList.add('hide');
  ensureAudio();
  bootScan();
});
camFailBtn.addEventListener('click', () => {
  // 没摄像头也能看流程：直接把当前目标标记为已收集（演示用）
  onFound(targetKey());
});
capBackBtn.addEventListener('click', () => {
  ensureAudio();
  closeCapture();
});
shutterBtn.addEventListener('click', () => { ensureAudio(); shoot(); });
capFlipEl.addEventListener('click', () => { ensureAudio(); capFlipEl.blur(); flipCamera(); });
$('layerFront').addEventListener('click', () => {
  if(selSticker){ ensureAudio(); bringToFront(selSticker); }
});
$('layerBack').addEventListener('click', () => {
  if(selSticker){
    ensureAudio();
    sendToBack(selSticker);
    // 人物层还没起来时，放后面看不出效果——给一句话说明
    if(!SEG.on) toast(SEG.failed ? '这台设备不支持人物遮挡，伙伴都在最前面'
                                 : '人物识别还在准备，稍等一下就有效果了');
  }
});
// 点空白处取消选中
capEl.addEventListener('pointerdown', e => {
  if(e.target === capEl || e.target === stickerLayer) clearSelect();
}, true);
$('shotDone').addEventListener('click', () => { ensureAudio(); closeCapture(); });
$('retakeBtn').addEventListener('click', retake);

/* 演示模式：?demo=1 扫描页出现"直接收集"按钮 */
if(/[?&]demo=1/.test(location.search || '')){
  const b = document.createElement('button');
  b.className = 'btn ghost';
  b.type = 'button';
  b.textContent = '直接收集（演示）';
  b.style.marginTop = '6px';
  b.addEventListener('click', () => { ensureAudio(); onFound(targetKey()); });
  document.querySelector('#scanSheet .scanFoot').appendChild(b);
}

window.__WORK = {
  G, CONFIG, CHARS, ORDER, SCAN, R3, SEG, S3D, GRIME,
  bootScan, analyzeShapes, onFound, showCharacter, showOver, openCapture,
  shoot, closeCapture, rectPathAt, applyStickerZ, PERSON_Z, hideShow,
  grimeBegin, grimeZoneFor, showScreenBox, loadStatic, initS3D,
  get showingKey(){ return showingKey; },
  get placedStickers(){ return placedStickers; },
  get selSticker(){ return selSticker; },
  get capKeys(){ return capKeys; },
  get capBack(){ return capBack; },
  flipCamera, removeSticker, bringToFront, sendToBack, selectSticker,
};

loadStore();
initScan();
/* 没有 WebGL 也能上课：3D 只是展示手段，缺了就切 2D 立绘（R3.flat） */
R3.flat = !initR3();
if(R3.flat) threeCv.style.display = 'none';
resize();
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
bootScan();

})();
</script>
