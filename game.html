<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>vv aa dd 在工作</title>
<style>
  :root{
    --ink:#14100E;
    --ink2:#5A524C;
    --ink3:#9C938A;
    --line:#EBE5DE;
    --paper:#FFFFFF;
    --accent:#FF7A45;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:#fff;color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#F5F1EC}

  /* ---------- 背景 / 摄像头 ---------- */
  #fallback{
    position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #F7F1E8 0%, #EEE5D9 56%, #E3D8C8 100%);
  }
  #fallback::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(20,16,14,.055) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #cam{
    position:absolute;inset:0;width:100%;height:100%;
    min-width:100%;min-height:100%;
    object-fit:cover;object-position:center;
    display:none;z-index:1;
  }
  #camMask{
    position:absolute;inset:0;display:none;pointer-events:none;z-index:6;
    background:linear-gradient(180deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,0) 22%,
                                        rgba(255,255,255,0) 72%, rgba(255,255,255,.20) 100%);
  }
  body.cam-on #cam,body.cam-on #camMask{display:block}
  /* 展示 / 拍照要求整页全透，白雾一并关掉 */
  body.cam-on.showing #camMask{display:none}
  body.cam-on.capturing #camMask{display:none}
  body.cam-on #fallback{display:none}

  /* 3D 形象层压在实景画布上 */
  canvas#three{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;display:block;
  }
  canvas#game{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;z-index:4;display:block;
  }
  /* 脏污层：压在实景画布之上、3D 角色之下 —— 伙伴擦过的地方会变干净 */
  canvas#grime{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:4;display:block;
    opacity:0;transition:opacity .5s ease;
  }
  canvas#grime.on{opacity:1}

  /* ---------- 覆盖页 ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);
    text-align:center;
    transition:opacity .3s ease, visibility .3s;
  }
  .sheet.light{background:#fff}
  .sheet.clear{background:transparent}
  .sheet.hide{opacity:0;visibility:hidden;pointer-events:none;display:none}

  .btn{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;
    padding:15px 46px;border-radius:99px;border:none;
    background:var(--ink);color:#fff;cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .btn:active{transform:scale(.94)}
  .btn.ghost{background:rgba(20,16,14,.08);color:var(--ink)}
  .btn.dark{background:#14110F}
  .btn:active{background:#241F1B}

  /* ---------- 识别页（全屏实景 + 取景框） ---------- */
  /* 取景框绝对居中：摄像头 cover 铺满后画面中心就是屏幕中心，
     框对准屏幕中心，用户"把图形放框里"才不会因为提示语把框挤偏 */
  #scanSheet{justify-content:center}
  #scanFrame{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:28px;
    border:0;
    flex:0 0 auto;
  }
  #tplBar{
    display:flex;gap:10px;
    position:absolute;z-index:2;flex:0 0 auto;
    top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;
    transform:translateX(-50%);
  }
  .wchip{
    display:flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:99px;
    background:rgba(255,255,255,.92);
    box-shadow:0 4px 14px rgba(20,16,14,.08);
    font-size:12.5px;font-weight:700;letter-spacing:.05em;
    color:#B9B0A6;transition:all .25s ease;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .wchip:active{transform:scale(.94)}
  .wchip svg{width:14px;height:14px;display:block}
  .wchip svg *{fill:#CFC6BB;transition:fill .25s}
  .wchip.cur{
    color:var(--ink);transform:scale(1.08);
    box-shadow:0 7px 18px rgba(20,16,14,.16), 0 0 0 2px var(--ink);
  }
  .wchip.cur svg *{fill:var(--ink)}
  .wchip.done{color:#fff;background:var(--ink);box-shadow:0 6px 16px rgba(20,16,14,.20)}
  .wchip.done svg *{fill:#FFD866}

  #scanTip{
    max-width:min(560px,86vw);
    padding:11px 18px;border-radius:16px;
    background:rgba(20,16,14,.46);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    color:#fff;font-size:13px;line-height:1.75;letter-spacing:.02em;
    text-align:center;
    position:absolute;z-index:2;
    left:50%;transform:translateX(-50%);
    bottom:calc(50% + min(31vmin,131px) + 20px);
  }
  #scanTip b{font-weight:800}
  #scanTip .sh{display:inline-block;vertical-align:-2px;width:13px;height:13px;margin:0 2px}
  #scanTip .sh *{fill:#FFD866}

  #scanFrame{
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:28px;
    border:0;
  }
  #scanFrame i.c{
    position:absolute;width:54px;height:54px;
    border:8px solid #14100E;border-radius:12px;
    filter:drop-shadow(0 2px 6px rgba(20,16,14,.26));
    transition:border-color .16s ease, transform .16s ease;
  }
  #scanFrame.warm i.c{border-color:#D2541A;transform:scale(1.04)}
  #scanFrame i.tl{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  #scanFrame i.tr{top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  #scanFrame i.bl{bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 16px}
  #scanFrame i.br{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 16px 0}
  #scanLine{
    position:absolute;left:8%;right:8%;height:8px;border-radius:2px;
    background:#14100E;
    animation:scanSweep 2.2s ease-in-out infinite;
  }
  #scanFrame.warm #scanLine{background:#D2541A}
  @keyframes scanSweep{
    0%{top:12%;opacity:0}
    18%{opacity:1}
    82%{opacity:1}
    100%{top:88%;opacity:0}
  }
  .scanFoot{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    width:100%;
    position:absolute;z-index:2;
    left:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  }
  #scanDebug{display:none}
  #camFail{margin-top:0}
  #scanGo{display:none}
  #scanGo.show{display:block}
  #scanGoSub{
    display:none;
    font-size:11.5px;color:#fff;letter-spacing:.04em;
    text-align:center;line-height:1.5;
    padding:5px 14px;border-radius:99px;
    background:rgba(20,16,14,.40);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    margin-top:-4px;
  }
  #scanGoSub.show{display:block}

  /* ---------- 工作展示 overlay（叠在实景上） ---------- */
  #showUI{
    position:absolute;inset:0;z-index:18;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 24px calc(env(safe-area-inset-bottom,0px) + 30px);
    pointer-events:none;
  }
  #showUI.hide{display:none}
  #showTag{
    display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px;
  }
  #showName{
    font-size:15px;font-weight:800;letter-spacing:.08em;color:#fff;
    padding:8px 22px;border-radius:99px;background:rgba(20,16,14,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #showCap{
    font-size:12.5px;color:#fff;letter-spacing:.04em;line-height:1.7;
    padding:7px 16px;border-radius:12px;background:rgba(20,16,14,.38);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #showUnlock{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:800;letter-spacing:.06em;color:#4A3105;
    padding:8px 18px;border-radius:99px;background:rgba(255,209,102,.94);
    box-shadow:0 8px 20px rgba(20,16,14,.22);
    margin-bottom:6px;
  }
  #showUnlock svg{width:14px;height:14px}
  #showUnlock svg path{fill:#4A3105}
  #showUI .capActions{pointer-events:auto;margin-top:8px}

  /* 加载提示 */
  #loadTip{
    position:absolute;z-index:19;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:12px 22px;border-radius:99px;
    background:rgba(20,16,14,.62);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.05em;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:none;white-space:nowrap;
  }
  #loadTip.show{display:block}

  /* ---------- 收集完成 ---------- */
  #overTitle{font-size:clamp(24px,6.4vmin,30px);font-weight:800;letter-spacing:.02em}
  #overSub{margin-top:8px;font-size:13px;color:var(--ink2);letter-spacing:.04em}
  .resetLink{
    margin-top:18px;padding:6px 12px;border:none;background:none;
    font-family:inherit;font-size:12px;color:#B5A897;letter-spacing:.04em;
    text-decoration:underline;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .resetLink:active{opacity:.6}
  #tplCards{
    display:flex;gap:12px;margin:24px 0 22px;justify-content:center;
    flex-wrap:nowrap;
  }
  .tplCard{
    width:min(30vw,132px);
    border:2px dashed #D8CFC2;border-radius:18px;
    background:#FBF8F4;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 8px 12px;
  }
  .tplCard img{width:64%;height:auto;object-fit:contain;display:block}
  .tplCard .nm{font-size:13px;font-weight:800;letter-spacing:.08em}
  .tplCard .st{
    font-size:10px;font-weight:700;letter-spacing:.06em;color:#B5A897;
    padding:3px 9px;border-radius:99px;background:#F1EBE4;
  }
  #overHint{margin-top:12px;font-size:12px;color:var(--ink3);letter-spacing:.04em}
  .emptyCards{
    font-size:13px;color:var(--ink3);letter-spacing:.04em;
    padding:26px 30px;text-align:center;
  }

  /* ---------- 拍照：全屏实景 + 可拖动伙伴贴纸 ---------- */
  #capture{
    justify-content:flex-start;
    background:transparent;
    padding:0;
  }

  /* 已摆放的伙伴层：铺满，接收拖动 */
  #stickerLayer{
    position:absolute;inset:0;z-index:2;
    overflow:hidden;
  }
  /* 人物层：端上人像分割出来的"只有你"的一层，插在贴纸图层的中间。
     z 小的贴纸排它后面 → 被你挡住；z 大的排它前面 → 挡在你身上。 */
  #capPerson{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;display:none;
  }
  #capPerson.on{display:block}
  .sticker{
    position:absolute;touch-action:none;
    filter:drop-shadow(0 8px 16px rgba(20,16,14,.28));
    will-change:transform;
  }
  .sticker img{
    display:block;width:100%;height:100%;
    object-fit:contain;pointer-events:none;
    -webkit-user-drag:none;user-select:none;
  }
  /* 3D 版贴纸：每个伙伴一张 512² 的画布，里面是实时渲染的立体模型 */
  .sticker canvas{
    display:block;width:100%;height:100%;
    pointer-events:none;
  }
  .sticker.dragging{
    filter:drop-shadow(0 16px 28px rgba(20,16,14,.40));
    z-index:10;
  }
  /* 选中态：点一下贴纸就能选它，调前后遮挡关系 */
  .sticker.sel{outline:2px dashed rgba(255,255,255,.92);outline-offset:5px;border-radius:8px}
  .sticker.overTrash{opacity:.55}

  /* 左上角返回 */
  #capBack{
    position:absolute;z-index:6;
    left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(20,16,14,.46);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 6px 16px rgba(20,16,14,.22);
    transition:transform .18s ease;
  }
  #capBack:active{transform:scale(.92)}
  #capBack svg{width:22px;height:22px}

  /* 右上角垃圾桶：把已经摆到画面上的伙伴拖上来即删除 */
  #capTrash{
    position:absolute;z-index:6;
    right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(20,16,14,.46);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 6px 16px rgba(20,16,14,.22);
    transition:transform .16s ease, background .16s ease;
  }
  #capTrash svg{width:21px;height:21px}
  #capTrash.hot{background:#E4572E;transform:scale(1.16)}
  #capTrash:active{transform:scale(.92)}

  /* 右下角翻转镜头：和快门同一条水平中线 */
  #capFlip{
    position:absolute;z-index:6;
    right:20px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 182px);
    width:52px;height:52px;border-radius:50%;border:none;
    background:rgba(20,16,14,.46);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 6px 16px rgba(20,16,14,.22);
    transition:transform .16s ease;
  }
  #capFlip svg{width:24px;height:24px}
  #capFlip:active{transform:scale(.90)}

  /* 选中贴纸后的图层工具条 */
  #layerBar{
    position:absolute;z-index:7;
    left:50%;transform:translateX(-50%);
    top:calc(env(safe-area-inset-top,0px) + 14px);
    display:none;gap:6px;padding:6px;border-radius:99px;
    background:rgba(20,16,14,.62);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    box-shadow:0 8px 22px rgba(20,16,14,.28);
  }
  #layerBar.on{display:flex}
  #layerBar button{
    border:none;background:rgba(255,255,255,.15);color:#fff;
    font-family:inherit;font-size:12.5px;font-weight:700;letter-spacing:.04em;
    padding:8px 15px;border-radius:99px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  #layerBar button:active{background:rgba(255,255,255,.34)}

  /* 底部白色伙伴栏 */
  #stickerBar{
    position:absolute;z-index:6;
    left:14px;right:14px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(255,255,255,.94);
    border-radius:22px;
    box-shadow:0 10px 30px rgba(20,16,14,.22);
    padding:12px 14px 14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #stickerBarHint{
    font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#B5A897;text-align:center;margin-bottom:10px;
  }
  #stickerBarRow{
    display:flex;gap:12px;align-items:center;justify-content:center;
    flex-wrap:wrap;
  }
  .stickerSrc{
    width:62px;height:62px;border-radius:16px;
    background:linear-gradient(160deg,#FFFFFF 0%,#F2EBE1 100%);
    border:2px solid #fff;
    box-shadow:0 6px 14px rgba(20,16,14,.16), inset 0 -4px 8px rgba(20,16,14,.06);
    display:grid;place-items:center;cursor:grab;
    touch-action:none;overflow:hidden;
    transition:transform .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .stickerSrc img{
    width:84%;height:84%;object-fit:contain;pointer-events:none;
    -webkit-user-drag:none;user-select:none;
  }
  .stickerSrc:active{transform:scale(.92)}

  /* 圆形快门 */
  #shutterBtn{
    position:absolute;z-index:6;
    left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 172px);
    width:72px;height:72px;border-radius:50%;border:none;
    background:rgba(255,255,255,.96);
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 8px 24px rgba(20,16,14,.30);
    transition:transform .15s ease;
  }
  #shutterBtn:active{transform:translateX(-50%) scale(.90)}
  #shutterBtn .ring{
    display:block;width:58px;height:58px;border-radius:50%;
    border:3px solid #14100E;
    background:transparent;
    transition:background .15s ease;
  }
  #shutterBtn:active .ring{background:#14100E}

  #shotSheet{justify-content:center;gap:14px;background:#EFE8DE}
  #shotTitle{
    font-size:12.5px;font-weight:700;letter-spacing:.12em;color:#fff;
    padding:6px 16px;border-radius:99px;background:rgba(20,16,14,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #shotFrame{
    padding:11px;background:#fff;border-radius:6px;
    box-shadow:0 20px 48px rgba(20,16,14,.34);
    max-width:90vw;flex:0 0 auto;
  }
  #shotImg{
    display:block;max-width:calc(90vw - 22px);max-height:60vh;
    border-radius:2px;
    -webkit-touch-callout:default;
    -webkit-user-select:auto;user-select:auto;
  }
  #shotSheet .capActions{margin-top:2px}
  #saveHint{
    font-size:12px;color:#fff;letter-spacing:.04em;
    padding:6px 15px;border-radius:99px;background:rgba(20,16,14,.48);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }

  /* ---------- 杂项 ---------- */
  #toast{
    position:absolute;z-index:30;left:50%;bottom:14%;transform:translate(-50%,10px);
    padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;
    background:rgba(20,16,14,.86);color:#fff;
    opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #crash{
    position:absolute;z-index:99;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:10px 14px;border-radius:12px;
    background:rgba(214,58,48,.94);color:#fff;
    font-size:12px;line-height:1.55;word-break:break-all;
  }

  @media (max-height: 660px){
    #scanFrame{width:min(56vmin,208px);height:min(56vmin,208px);border-radius:24px}
    .btn{padding:13px 38px;font-size:15px}
    #stickerBar{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:9px 12px 10px}
    .stickerSrc{width:52px;height:52px}
    #shutterBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:64px;height:64px}
    #shutterBtn .ring{width:52px;height:52px}
    #capFlip{bottom:calc(env(safe-area-inset-bottom,0px) + 158px);width:46px;height:46px}
    #capFlip svg{width:21px;height:21px}
    #shotImg{max-height:48vh}
    .tplCard{width:min(28vw,112px);padding:12px 6px 10px}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="fallback"></div>
  <video id="cam" playsinline muted autoplay></video>
  <div id="camMask"></div>

  <canvas id="three"></canvas>
  <canvas id="game"></canvas>
  <canvas id="grime"></canvas>

  <!-- 第一步：扫描收集（一次只找一个图形） -->
  <div class="sheet clear" id="scanSheet">
    <div id="tplBar"></div>

    <div id="scanTip"></div>

    <div id="scanFrame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div id="scanLine"></div>
    </div>

    <div class="scanFoot">
      <div id="scanDebug">正在开启摄像头…</div>
      <button class="btn ghost" id="camFail" type="button" hidden>摄像头不可用 · 先直接体验</button>
      <button class="btn" id="scanGo" type="button">查看已收集伙伴</button>
      <div id="scanGoSub">已收集的伙伴可以和你一起合照哦</div>
    </div>
  </div>

  <!-- 工作展示：角色出现在实景里 -->
  <div id="showUI" class="hide">
    <div id="showTag">
      <div id="showName">vv</div>

function tone(o){
  if(!AC) return;
  const { freq=440, to=null, dur=.12, type='sine', gain=.06, delay=0 } = o || {};
  const t0 = AC.currentTime + delay;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(AC.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noiseBurst(dur=.3, gain=.12){
  if(!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.4);
  const src = AC.createBufferSource(); src.buffer = buf;
  const flt = AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 1100;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(flt).connect(g).connect(AC.destination);
  src.start();
}

function drawCamBg(){

  if(!v || !v.videoWidth || !v.videoHeight || v.readyState < 2) return false;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const dw = vw * sc, dh = vh * sc;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;

  if(camFacing === 'user'){
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(v, W - dx - dw, dy, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(v, dx, dy, dw, dh);
  }
  return true;
}

async function ensureCamBg(){
  if(!camStream) return false;
  if(camEl.srcObject !== camStream) camEl.srcObject = camStream;
  document.body.classList.add('cam-on');

  if(camEl.paused || camEl.ended){
    try{ await camEl.play(); }catch(e){}

  camEl.style.width  = '100%';
  camEl.style.height = '100%';
  void camEl.offsetWidth;
  if(!camEl.videoWidth){
    await new Promise(resolve => {
      let done = false;
      const fin = () => { if(done) return; done = true; resolve(); };
      camEl.addEventListener('loadedmetadata', fin, { once: true });
      setTimeout(fin, 1200);
    });

  return true;

async function openCam(facing){
  if(camStarting) return !!camStream;
  if(facing && facing !== camFacing && camStream){
    closeCam();
    await new Promise(r => setTimeout(r, 140));
  }
  if(facing) camFacing = facing;
  if(camStream) return await ensureCamBg();

  camStarting = true;
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: camFacing },
        width:{ ideal: 1280 }, height:{ ideal: 720 },
      },
      audio: false,
    });
    camStream = s;
    try{

      if(st && st.facingMode) camFacing = st.facingMode;
    }catch(e){}
    camEl.srcObject = s;
    document.body.classList.add('cam-on');
    try{ await camEl.play(); }catch(e){}

const SCAN = { canvas:null, ctx:null, hits:0, wrongHits:0, timer:0, running:false };
const SCAN_SIZE = 168;

function initScan(){
  SCAN.canvas = document.createElement('canvas');
