<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>vv aa dd 在工作</title>
<style>
  :root{
    --ink:#14100E;
    --ink2:#5A524C;
    --ink3:#9C938A;
    --line:#EBE5DE;
    --paper:#FFFFFF;
    --accent:#FF7A45;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    height:100%;overflow:hidden;background:#fff;color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    user-select:none;-webkit-user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;overflow:hidden;background:#F5F1EC}

  /* ---------- 背景 / 摄像头 ---------- */
  #fallback{
    position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%, #F7F1E8 0%, #EEE5D9 56%, #E3D8C8 100%);
  }
  #fallback::after{
    content:'';position:absolute;inset:0;
    background-image:radial-gradient(rgba(20,16,14,.055) 1px, transparent 1px);
    background-size:26px 26px;
  }
  #cam{
    position:absolute;inset:0;width:100%;height:100%;
    min-width:100%;min-height:100%;
    object-fit:cover;object-position:center;
    display:none;z-index:1;
  }
  #camMask{
    position:absolute;inset:0;display:none;pointer-events:none;z-index:6;
    background:linear-gradient(180deg, rgba(255,255,255,.40) 0%, rgba(255,255,255,0) 22%,
                                        rgba(255,255,255,0) 72%, rgba(255,255,255,.20) 100%);
  }
  body.cam-on #cam,body.cam-on #camMask{display:block}
  /* 展示 / 拍照要求整页全透，白雾一并关掉 */
  body.cam-on.showing #camMask{display:none}
  body.cam-on.capturing #camMask{display:none}
  body.cam-on #fallback{display:none}

  /* 3D 形象层压在实景画布上 */
  canvas#three{
    position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;z-index:5;display:block;
  }
  canvas#game{
    position:absolute;inset:0;width:100%;height:100%;
    touch-action:none;z-index:4;display:block;
  }

  /* ---------- 覆盖页 ---------- */
  .sheet{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 20px) 24px calc(env(safe-area-inset-bottom,0px) + 20px);
    text-align:center;
    transition:opacity .3s ease, visibility .3s;
  }
  .sheet.light{background:#fff}
  .sheet.clear{background:transparent}
  .sheet.hide{opacity:0;visibility:hidden;pointer-events:none;display:none}

  .btn{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.06em;
    padding:15px 46px;border-radius:99px;border:none;
    background:var(--ink);color:#fff;cursor:pointer;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  .btn:active{transform:scale(.94)}
  .btn.ghost{background:rgba(20,16,14,.08);color:var(--ink)}
  .btn.dark{background:#14110F}
  .btn:active{background:#241F1B}

  /* ---------- 识别页（全屏实景 + 取景框） ---------- */
  /* 取景框绝对居中：摄像头 cover 铺满后画面中心就是屏幕中心，
     框对准屏幕中心，用户"把图形放框里"才不会因为提示语把框挤偏 */
  #scanSheet{justify-content:center}
  #scanFrame{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:28px;
    border:0;
    flex:0 0 auto;
  }
  #tplBar{
    display:flex;gap:10px;
    position:absolute;z-index:2;flex:0 0 auto;
    top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;
    transform:translateX(-50%);
  }
  .wchip{
    display:flex;align-items:center;gap:7px;
    padding:8px 15px;border-radius:99px;
    background:rgba(255,255,255,.92);
    box-shadow:0 4px 14px rgba(20,16,14,.08);
    font-size:12.5px;font-weight:700;letter-spacing:.05em;
    color:#B9B0A6;transition:all .25s ease;
    cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .wchip:active{transform:scale(.94)}
  .wchip svg{width:14px;height:14px;display:block}
  .wchip svg *{fill:#CFC6BB;transition:fill .25s}
  .wchip.cur{
    color:var(--ink);transform:scale(1.08);
    box-shadow:0 7px 18px rgba(20,16,14,.16), 0 0 0 2px var(--ink);
  }
  .wchip.cur svg *{fill:var(--ink)}
  .wchip.done{color:#fff;background:var(--ink);box-shadow:0 6px 16px rgba(20,16,14,.20)}
  .wchip.done svg *{fill:#FFD866}

  #scanTip{
    max-width:min(560px,86vw);
    padding:11px 18px;border-radius:16px;
    background:rgba(20,16,14,.46);
    -webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);
    color:#fff;font-size:13px;line-height:1.75;letter-spacing:.02em;
    text-align:center;
    position:absolute;z-index:2;
    left:50%;transform:translateX(-50%);
    bottom:calc(50% + min(31vmin,131px) + 20px);
  }
  #scanTip b{font-weight:800}
  #scanTip .sh{display:inline-block;vertical-align:-2px;width:13px;height:13px;margin:0 2px}
  #scanTip .sh *{fill:#FFD866}

  #scanFrame{
    width:min(62vmin,262px);height:min(62vmin,262px);
    border-radius:28px;
    border:0;
  }
  #scanFrame i.c{
    position:absolute;width:54px;height:54px;
    border:8px solid #14100E;border-radius:12px;
    filter:drop-shadow(0 2px 6px rgba(20,16,14,.26));
    transition:border-color .16s ease, transform .16s ease;
  }
  #scanFrame.warm i.c{border-color:#D2541A;transform:scale(1.04)}
  #scanFrame i.tl{top:-3px;left:-3px;border-right:0;border-bottom:0;border-radius:16px 0 0 0}
  #scanFrame i.tr{top:-3px;right:-3px;border-left:0;border-bottom:0;border-radius:0 16px 0 0}
  #scanFrame i.bl{bottom:-3px;left:-3px;border-right:0;border-top:0;border-radius:0 0 0 16px}
  #scanFrame i.br{bottom:-3px;right:-3px;border-left:0;border-top:0;border-radius:0 0 16px 0}
  #scanLine{
    position:absolute;left:8%;right:8%;height:8px;border-radius:2px;
    background:#14100E;
    animation:scanSweep 2.2s ease-in-out infinite;
  }
  #scanFrame.warm #scanLine{background:#D2541A}
  @keyframes scanSweep{
    0%{top:12%;opacity:0}
    18%{opacity:1}
    82%{opacity:1}
    100%{top:88%;opacity:0}
  }
  .scanFoot{
    display:flex;flex-direction:column;align-items:center;gap:12px;
    width:100%;
    position:absolute;z-index:2;
    left:0;
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  }
  #scanDebug{display:none}
  #camFail{margin-top:0}
  #scanGo{display:none}
  #scanGo.show{display:block}
  #scanGoSub{
    display:none;
    font-size:11.5px;color:#fff;letter-spacing:.04em;
    text-align:center;line-height:1.5;
    padding:5px 14px;border-radius:99px;
    background:rgba(20,16,14,.40);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    margin-top:-4px;
  }
  #scanGoSub.show{display:block}

  /* ---------- 工作展示 overlay（叠在实景上） ---------- */
  #showUI{
    position:absolute;inset:0;z-index:18;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding:0 24px calc(env(safe-area-inset-bottom,0px) + 30px);
    pointer-events:none;
  }
  #showUI.hide{display:none}
  #showTag{
    display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:16px;
  }
  #showName{
    font-size:15px;font-weight:800;letter-spacing:.08em;color:#fff;
    padding:8px 22px;border-radius:99px;background:rgba(20,16,14,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #showCap{
    font-size:12.5px;color:#fff;letter-spacing:.04em;line-height:1.7;
    padding:7px 16px;border-radius:12px;background:rgba(20,16,14,.38);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #showUnlock{
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;font-weight:800;letter-spacing:.06em;color:#4A3105;
    padding:8px 18px;border-radius:99px;background:rgba(255,209,102,.94);
    box-shadow:0 8px 20px rgba(20,16,14,.22);
    margin-bottom:6px;
  }
  #showUnlock svg{width:14px;height:14px}
  #showUnlock svg path{fill:#4A3105}
  #showUI .capActions{pointer-events:auto;margin-top:8px}

  /* 加载提示 */
  #loadTip{
    position:absolute;z-index:19;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:12px 22px;border-radius:99px;
    background:rgba(20,16,14,.62);color:#fff;
    font-size:13px;font-weight:600;letter-spacing:.05em;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    display:none;white-space:nowrap;
  }
  #loadTip.show{display:block}

  /* ---------- 收集完成 ---------- */
  #overTitle{font-size:clamp(24px,6.4vmin,30px);font-weight:800;letter-spacing:.02em}
  #overSub{margin-top:8px;font-size:13px;color:var(--ink2);letter-spacing:.04em}
  .resetLink{
    margin-top:18px;padding:6px 12px;border:none;background:none;
    font-family:inherit;font-size:12px;color:#B5A897;letter-spacing:.04em;
    text-decoration:underline;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .resetLink:active{opacity:.6}
  #tplCards{
    display:flex;gap:12px;margin:24px 0 22px;justify-content:center;
    flex-wrap:nowrap;
  }
  .tplCard{
    width:min(30vw,132px);
    border:2px dashed #D8CFC2;border-radius:18px;
    background:#FBF8F4;
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:16px 8px 12px;
  }
  .tplCard img{width:64%;height:auto;object-fit:contain;display:block}
  .tplCard .nm{font-size:13px;font-weight:800;letter-spacing:.08em}
  .tplCard .st{
    font-size:10px;font-weight:700;letter-spacing:.06em;color:#B5A897;
    padding:3px 9px;border-radius:99px;background:#F1EBE4;
  }
  #overHint{margin-top:12px;font-size:12px;color:var(--ink3);letter-spacing:.04em}
  .emptyCards{
    font-size:13px;color:var(--ink3);letter-spacing:.04em;
    padding:26px 30px;text-align:center;
  }

  /* ---------- 拍照：全屏实景 + 可拖动伙伴贴纸 ---------- */
  #capture{
    justify-content:flex-start;
    background:transparent;
    padding:0;
  }

  /* 已摆放的伙伴层：铺满，接收拖动 */
  #stickerLayer{
    position:absolute;inset:0;z-index:2;
    overflow:hidden;
  }
  .sticker{
    position:absolute;touch-action:none;
    filter:drop-shadow(0 8px 16px rgba(20,16,14,.28));
    will-change:transform;
  }
  .sticker img{
    display:block;width:100%;height:100%;
    object-fit:contain;pointer-events:none;
    -webkit-user-drag:none;user-select:none;
  }
  .sticker.dragging{
    filter:drop-shadow(0 16px 28px rgba(20,16,14,.40));
    z-index:10;
  }

  /* 左上角返回 */
  #capBack{
    position:absolute;z-index:6;
    left:14px;top:calc(env(safe-area-inset-top,0px) + 14px);
    width:44px;height:44px;border-radius:50%;border:none;
    background:rgba(20,16,14,.46);color:#fff;
    display:grid;place-items:center;cursor:pointer;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    box-shadow:0 6px 16px rgba(20,16,14,.22);
    transition:transform .18s ease;
  }
  #capBack:active{transform:scale(.92)}
  #capBack svg{width:22px;height:22px}

  /* 底部白色伙伴栏 */
  #stickerBar{
    position:absolute;z-index:6;
    left:14px;right:14px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(255,255,255,.94);
    border-radius:22px;
    box-shadow:0 10px 30px rgba(20,16,14,.22);
    padding:12px 14px 14px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  #stickerBarHint{
    font-size:11px;font-weight:700;letter-spacing:.06em;
    color:#B5A897;text-align:center;margin-bottom:10px;
  }
  #stickerBarRow{
    display:flex;gap:12px;align-items:center;justify-content:center;
    flex-wrap:wrap;
  }
  .stickerSrc{
    width:62px;height:62px;border-radius:16px;
    background:linear-gradient(160deg,#FFFFFF 0%,#F2EBE1 100%);
    border:2px solid #fff;
    box-shadow:0 6px 14px rgba(20,16,14,.16), inset 0 -4px 8px rgba(20,16,14,.06);
    display:grid;place-items:center;cursor:grab;
    touch-action:none;overflow:hidden;
    transition:transform .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .stickerSrc img{
    width:84%;height:84%;object-fit:contain;pointer-events:none;
    -webkit-user-drag:none;user-select:none;
  }
  .stickerSrc:active{transform:scale(.92)}

  /* 圆形快门 */
  #shutterBtn{
    position:absolute;z-index:6;
    left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 172px);
    width:72px;height:72px;border-radius:50%;border:none;
    background:rgba(255,255,255,.96);
    display:grid;place-items:center;cursor:pointer;
    box-shadow:0 8px 24px rgba(20,16,14,.30);
    transition:transform .15s ease;
  }
  #shutterBtn:active{transform:translateX(-50%) scale(.90)}
  #shutterBtn .ring{
    display:block;width:58px;height:58px;border-radius:50%;
    border:3px solid #14100E;
    background:transparent;
    transition:background .15s ease;
  }
  #shutterBtn:active .ring{background:#14100E}

  #shotSheet{justify-content:center;gap:14px;background:#EFE8DE}
  #shotTitle{
    font-size:12.5px;font-weight:700;letter-spacing:.12em;color:#fff;
    padding:6px 16px;border-radius:99px;background:rgba(20,16,14,.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  #shotFrame{
    padding:11px;background:#fff;border-radius:6px;
    box-shadow:0 20px 48px rgba(20,16,14,.34);
    max-width:90vw;flex:0 0 auto;
  }
  #shotImg{
    display:block;max-width:calc(90vw - 22px);max-height:60vh;
    border-radius:2px;
    -webkit-touch-callout:default;
    -webkit-user-select:auto;user-select:auto;
  }
  #shotSheet .capActions{margin-top:2px}
  #saveHint{
    font-size:12px;color:#fff;letter-spacing:.04em;
    padding:6px 15px;border-radius:99px;background:rgba(20,16,14,.48);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }

  /* ---------- 杂项 ---------- */
  #toast{
    position:absolute;z-index:30;left:50%;bottom:14%;transform:translate(-50%,10px);
    padding:10px 18px;border-radius:99px;font-size:12.5px;font-weight:600;
    background:rgba(20,16,14,.86);color:#fff;
    opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #crash{
    position:absolute;z-index:99;left:12px;right:12px;
    bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
    padding:10px 14px;border-radius:12px;
    background:rgba(214,58,48,.94);color:#fff;
    font-size:12px;line-height:1.55;word-break:break-all;
  }

  @media (max-height: 660px){
    #scanFrame{width:min(56vmin,208px);height:min(56vmin,208px);border-radius:24px}
    .btn{padding:13px 38px;font-size:15px}
    #stickerBar{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);padding:9px 12px 10px}
    .stickerSrc{width:52px;height:52px}
    #shutterBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:64px;height:64px}
    #shutterBtn .ring{width:52px;height:52px}
    #shotImg{max-height:48vh}
    .tplCard{width:min(28vw,112px);padding:12px 6px 10px}
  }
</style>
</head>
<body>

<div id="stage">
  <div id="fallback"></div>
  <video id="cam" playsinline muted autoplay></video>
  <div id="camMask"></div>

  <canvas id="three"></canvas>
  <canvas id="game"></canvas>

  <!-- 第一步：扫描收集（一次只找一个图形） -->
  <div class="sheet clear" id="scanSheet">
    <div id="tplBar"></div>

    <div id="scanTip"></div>

    <div id="scanFrame">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <div id="scanLine"></div>
    </div>

    <div class="scanFoot">
      <div id="scanDebug">正在开启摄像头…</div>
      <button class="btn ghost" id="camFail" type="button" hidden>摄像头不可用 · 先直接体验</button>
      <button class="btn" id="scanGo" type="button">查看已收集伙伴</button>
      <div id="scanGoSub">已收集的伙伴可以和你一起合照哦</div>
    </div>
  </div>

  <!-- 工作展示：角色出现在实景里 -->
  <div id="showUI" class="hide">
    <div id="showTag">
      <div id="showName">vv</div>
      <div id="showCap"></div>
      <div id="showUnlock">
        <svg viewBox="0 0 24 24"><path d="M9.6 16.8 4.8 12l1.7-1.7 3.1 3.1 7.9-7.9L19.2 7.4z"/></svg>
        <span>已解锁合照模板</span>
      </div>
    </div>
    <div class="capActions">
      <button class="btn ghost" id="showReplay" type="button">再看一遍</button>
      <button class="btn" id="showNext" type="button">继续找下一个</button>
    </div>
  </div>

  <div id="loadTip">正在请它上场…</div>

  <!-- 已收集伙伴 -->
  <div class="sheet light hide" id="overSheet">
    <div id="overTitle">已收集的伙伴</div>
    <div id="overSub">扫描贴纸就能认识新的伙伴哦</div>
    <div id="tplCards"></div>
    <div class="capActions">
      <button class="btn ghost" id="laterBtn" type="button">继续寻找</button>
      <button class="btn" id="photoBtn" type="button">现在拍照</button>
    </div>
    <button class="resetLink" id="resetBtn" type="button">清空进度，重新开始</button>
  </div>

  <!-- 拍照：全屏实景 + 可拖动伙伴贴纸 -->
  <div class="sheet clear hide" id="capture">
    <div id="stickerLayer"></div>

    <button id="capBack" type="button" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 8 12l7 7"/>
      </svg>
    </button>

    <div id="stickerBar">
      <div id="stickerBarHint">把伙伴拖出来一起合照</div>
      <div id="stickerBarRow"></div>
    </div>

    <button id="shutterBtn" type="button" aria-label="拍照">
      <span class="ring"></span>
    </button>
  </div>

  <!-- 拍照结果 -->
  <div class="sheet clear hide" id="shotSheet">
    <div id="shotTitle">拍好啦</div>
    <div id="shotFrame"><img id="shotImg" alt="合照"></div>
    <div id="saveHint">长按图片保存到相册</div>
    <div class="capActions">
      <button class="btn ghost" id="retakeBtn" type="button">重新拍摄</button>
      <button class="btn" id="shotDone" type="button">完成</button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* 线上分享链接带 sharecode，网关只放行带该参数的请求；
   静态资源需要带上同一份参数，否则会被拦成 403。 */
(function(){
  var m = /[?&]sharecode=([^&]+)/.exec(location.search || '');
  window.ASSET_Q = m ? '?sharecode=' + m[1] : '';
})();
</script>
<script src="vendor/three-gltf.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================================
   1. 配置与角色
   ========================================================================= */
const Q = window.ASSET_Q || '';

const CONFIG = {
  // 图像识别（黑色图形）
  scanNeed: 8,               // 连续命中帧数（4→8：环境里的暗块/阴影一晃就命中，误收集）
  scanInterval: 0.09,        // 检测间隔（秒）
  scanWarmup: 1200,          // 摄像头就绪后等待画面稳定的毫秒数
  scanMinContrast: 48,
  scanThresholdRatio: 0.42,
  scanMinLum: 26,
  scanMaxLum: 132,
  scanMinAreaPct: 0.8,
  scanMaxAreaPct: 90,
  scanMinSide: 26,           // 检测画布上最小边（约取景框 1/6）
  scanMinCount: 260,

let AC = null;
function ensureAudio(){
  if(!AC){
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; }
  }
  if(AC && AC.state === 'suspended') AC.resume();
}
function tone(o){
  if(!AC) return;
  const { freq=440, to=null, dur=.12, type='sine', gain=.06, delay=0 } = o || {};
  const t0 = AC.currentTime + delay;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if(to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(AC.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
function noiseBurst(dur=.3, gain=.12){
  if(!AC) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.4);
  const src = AC.createBufferSource(); src.buffer = buf;
  const flt = AC.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 1100;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(flt).connect(g).connect(AC.destination);
  src.start();
}

  win(){ [523,659,784,1046].forEach((f,i)=>tone({freq:f,dur:.5,gain:.05,delay:i*.09,type:'triangle'})); },
  shutter(){ noiseBurst(.06,.10); tone({freq:1600,to:900,dur:.07,gain:.05,type:'square'}); },
  appear(){ tone({freq:520,to:780,dur:.22,gain:.06,type:'triangle'}); },
};

let camStream = null, camStarting = false;
let camFacing = 'environment';
let camTouched = false;

/* 把摄像头画面按 cover 铺满整块画布（不依赖 video 的 object-fit） */
function drawCamBg(){
  const v = camEl;
  if(!v || !v.videoWidth || !v.videoHeight || v.readyState < 2) return false;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const dw = vw * sc, dh = vh * sc;
  const dx = (W - dw) / 2, dy = (H - dh) / 2;

  if(camFacing === 'user'){
    ctx.save();
    ctx.translate(W, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(v, W - dx - dw, dy, dw, dh);
    ctx.restore();
  } else {
    ctx.drawImage(v, dx, dy, dw, dh);
  }
  return true;
}

async function ensureCamBg(){
  if(!camStream) return false;
  if(camEl.srcObject !== camStream) camEl.srcObject = camStream;
  document.body.classList.add('cam-on');

  if(camEl.paused || camEl.ended){
    try{ await camEl.play(); }catch(e){}
  }
  camEl.style.width  = '100%';
  camEl.style.height = '100%';
  void camEl.offsetWidth;
  if(!camEl.videoWidth){
    await new Promise(resolve => {
      let done = false;
      const fin = () => { if(done) return; done = true; resolve(); };
      camEl.addEventListener('loadedmetadata', fin, { once: true });
      setTimeout(fin, 1200);
    });
  }
  return true;
}

async function openCam(facing){
  if(camStarting) return !!camStream;
  if(facing && facing !== camFacing && camStream){
    closeCam();
    await new Promise(r => setTimeout(r, 140));
  }
  if(facing) camFacing = facing;
  if(camStream) return await ensureCamBg();

  camStarting = true;
  try{
    const s = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: camFacing },
        width:{ ideal: 1280 }, height:{ ideal: 720 },
      },
      audio: false,
    });
    camStream = s;
    try{
      const st = s.getVideoTracks()[0] && s.getVideoTracks()[0].getSettings();
      if(st && st.facingMode) camFacing = st.facingMode;
    }catch(e){}
    camEl.srcObject = s;
    document.body.classList.add('cam-on');
    try{ await camEl.play(); }catch(e){}
    await ensureCamBg();
    return true;
  }catch(e){
    camStream = null;
    camEl.srcObject = null;
    document.body.classList.remove('cam-on');
    return false;
  } finally {
    camStarting = false;
  }
}
function closeCam(){
  if(camStream){
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
    camEl.srcObject = null;
    document.body.classList.remove('cam-on');
  }
}
async function flipCamera(){
  camTouched = true;
  const next = camFacing === 'user' ? 'environment' : 'user';
  closeCam();
  await new Promise(r => setTimeout(r, 140));
  const ok = await openCam(next);
  if(!ok){
    camFacing = next === 'user' ? 'environment' : 'user';
    await openCam(camFacing);
    toast('这台设备只有一个镜头');
  }
}

/* =========================================================================
   6. 图像识别：一帧里认出 水滴 / 泡泡 / 气球（宽度剖面最近邻）
   ========================================================================= */
const SCAN = { canvas:null, ctx:null, hits:0, wrongHits:0, timer:0, running:false };
const SCAN_SIZE = 168;

function initScan(){
  SCAN.canvas = document.createElement('canvas');
  SCAN.canvas.width  = SCAN_SIZE;
  SCAN.canvas.height = SCAN_SIZE;
  SCAN.ctx = SCAN.canvas.getContext('2d', { willReadFrequently: true });
}

/* 取景框对应的视频源矩形 */
function frameSourceRect(){
  const v = camEl;
  const vw = v.videoWidth, vh = v.videoHeight;
  const sc = Math.max(W / vw, H / vh);
  const sw = W / sc, sh = H / sc;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  const kx = sw / W, ky = sh / H;

  const r = scanFrameEl.getBoundingClientRect();
  let fw = Math.max(12, r.width * kx);
  let fh = Math.max(12, r.height * ky);
  let vx = sx + r.left * kx;
  let vy = sy + r.top * ky;
  if(vx + fw > vw) fw = vw - vx;
  if(vy + fh > vh) fh = vh - vy;
  return { vx, vy, fw: Math.max(12, fw), fh: Math.max(12, fh) };
}

function grabFrame(){
  const v = camEl;
  if(!v || v.readyState < 2 || !v.videoWidth || !v.videoHeight) return false;
  if(SCAN.canvas.width !== SCAN_SIZE || SCAN.canvas.height !== SCAN_SIZE){
    SCAN.canvas.width = SCAN_SIZE;
    SCAN.canvas.height = SCAN_SIZE;
  }
  const { vx, vy, fw, fh } = frameSourceRect();
  SCAN.ctx.drawImage(v, vx, vy, fw, fh, 0, 0, SCAN_SIZE, SCAN_SIZE);
  return true;
}

/* 自适应阈值的暗块掩膜（和 game.html 同一套） */
function buildDarkMask(){
  const S = SCAN_SIZE, total = S * S;
  const img = SCAN.ctx.getImageData(0, 0, S, S).data;

  const lum  = new Uint8Array(total);
  const hist = new Uint32Array(256);
  for(let i = 0; i < total; i++){
    const si = i * 4;
    const L = (0.299*img[si] + 0.587*img[si+1] + 0.114*img[si+2]) | 0;
    lum[i] = L;
    hist[L]++;
  }
  const quantile = q => {
    let acc = 0;
    const need = total * q;
    for(let v = 0; v < 256; v++){ acc += hist[v]; if(acc >= need) return v; }
    return 255;
  };
  const dark0  = quantile(0.015);
  const bright = quantile(0.90);
  const contrast = bright - dark0;
  if(contrast < CONFIG.scanMinContrast){
    return { ok:false, mask:null, darkPct:0, contrast, th:0 };
  }
  const th = clamp(
    Math.round(dark0 + contrast * CONFIG.scanThresholdRatio),
    CONFIG.scanMinLum, CONFIG.scanMaxLum
  );
  const mask = new Uint8Array(total);
  let darkCount = 0;
  for(let i = 0; i < total; i++){
    if(lum[i] < th){ mask[i] = 1; darkCount++; }
  }
  const darkPct = darkCount / total * 100;
  if(darkCount < CONFIG.scanMinCount || darkPct > CONFIG.scanMaxAreaPct){
    return { ok:false, mask:null, darkPct, contrast, th };
  }
  return { ok:true, mask, darkPct, contrast, th };
}

/* 认形状：每个暗块算一条"宽度剖面"，和参考剖面做最近邻匹配。
   宽度都按最宽行归一，采样 8/25/50/75/92% 五个高度 + fill（面积占比）。
   参考值 = 老师给的三张剪影经过同一条相机管线（168px 画布）实测平均，
   换新图形时：跑 probe38 量一轮，把 REF 里的数字换掉即可。 */
const SHAPE_REF = {
  drop:    { n8:0.61, n25:0.92, n50:0.98, n75:0.61, n92:0.20, fill:0.70 },
  bubble:  { n8:0.64, n25:0.93, n50:0.99, n75:0.96, n92:0.64, fill:0.85 },
  balloon: { n8:0.29, n25:0.91, n50:1.00, n75:0.88, n92:0.56, fill:0.77 },
};
function analyzeShapes(){
  const m = buildDarkMask();
  if(!m.ok) return { ok:false, shape:null, darkPct:m.darkPct, contrast:m.contrast, th:m.th };

  const S = SCAN_SIZE, total = S * S, mask = m.mask;
  const visited = new Uint8Array(total);
  const stack   = new Int32Array(total);
  const pts = [];
  let best = null;
  let clipped = false;      // 大块暗区被取景框边裁掉 → 图形没整个进框
  SCAN.comps = [];          // 调试用：这一帧里每个暗块的参数

  for(let i = 0; i < total; i++){
    if(!mask[i] || visited[i]) continue;

    let sp = 0; stack[sp++] = i; visited[i] = 1;
    let count = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
    pts.length = 0;

    while(sp > 0){
      const p  = stack[--sp];
      const px = p % S, py = (p - px) / S;
      count++; pts.push(p);
      if(px < minX) minX = px;
      if(px > maxX) maxX = px;
      if(py < minY) minY = py;
      if(py > maxY) maxY = py;

      if(px > 0){   const q = p - 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(px < S-1){ const q = p + 1; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py > 0){   const q = p - S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
      if(py < S-1){ const q = p + S; if(mask[q] && !visited[q]){ visited[q]=1; stack[sp++]=q; } }
    }

    if(count < CONFIG.scanMinCount) continue;

    const bw = maxX - minX + 1, bh = maxY - minY + 1;
    if(bw < CONFIG.scanMinSide || bh < CONFIG.scanMinSide) continue;
    if(bw > S * 0.97 && bh > S * 0.97){ clipped = true; continue; }   // 挡住镜头
    // 大暗块贴到取景框边 = 图形被裁掉一截，剖面不可信
    if(count > CONFIG.scanMinCount * 4 &&
       (minX <= 1 || minY <= 1 || maxX >= S - 2 || maxY >= S - 2)){
      clipped = true;
      continue;
    }

    const ar = bw / bh;
    if(ar < 0.5 || ar > 1.6) continue;
    const fill = count / (bw * bh);
    if(fill < 0.40 || fill > 0.92) continue;

    // 逐行像素数 → 宽度剖面
    const rc = new Uint16Array(bh);
    for(let k = 0; k < pts.length; k++){
      const p  = pts[k];
      const py = (p - (p % S)) / S;
      rc[py - minY]++;
    }
    let Wmax = 0;
    for(let k = 0; k < bh; k++) if(rc[k] > Wmax) Wmax = rc[k];
    if(Wmax < bw * 0.6) continue;                     // 最宽行得是主体

    const at = t => rc[Math.min(bh - 1, Math.max(0, Math.round((bh - 1) * t)))];
    const n = t => at(t) / Wmax;
    const n8 = n(0.08), n25 = n(0.25), n50 = n(0.5), n75 = n(0.75), n92 = n(0.92);
    if(n50 < 0.42) continue;   // 中段太窄 = 碎渣；三个图形中段都接近满宽

    const f = { n8, n25, n50, n75, n92, fill };
    SCAN.comps.push({ bw, bh, ar:+ar.toFixed(2), fill:+fill.toFixed(2),
                      n8:+n8.toFixed(2), n25:+n25.toFixed(2),
                      n50:+n50.toFixed(2), n75:+n75.toFixed(2), n92:+n92.toFixed(2),
                      edge:(minX <= 1 || minY <= 1 || maxX >= S - 2 || maxY >= S - 2) });

    // 最近邻：离哪个参考剖面最近就认谁，太远的不认
    let shape = null, bd = 1e9;
    for(const k in SHAPE_REF){
      const r = SHAPE_REF[k];
      const d = Math.hypot(f.n8-r.n8, f.n25-r.n25, f.n50-r.n50,
                           f.n75-r.n75, f.n92-r.n92, f.fill-r.fill);
      if(d < bd){ bd = d; shape = k; }
    }
    if(bd > CONFIG.scanMatchTol) shape = null;
    if(!shape) continue;
    if(!best || count > best.count) best = { shape, count };
  }

  if(!best) return { ok:false, shape:null, clipped, darkPct:m.darkPct, contrast:m.contrast, th:m.th };
  return { ok:true, shape:best.shape, clipped:false, darkPct:m.darkPct, contrast:m.contrast, th:m.th };
}

function updateScan(dt){
  if(!SCAN.running) return;
  SCAN.timer -= dt;
  if(SCAN.timer > 0) return;
  SCAN.timer = CONFIG.scanInterval;

  if(!grabFrame()){
    scanDbg.textContent = '等待摄像头…';
    return;
  }
  const r = analyzeShapes();
  const target = CHARS[targetKey()];

  if(r.ok){
    if(r.shape === target.shape){
      SCAN.wrongHits = 0;
      SCAN.hits++;
      if(SCAN.hits >= CONFIG.scanNeed){
        SCAN.hits = CONFIG.scanNeed;
        onFound(targetKey());
        return;
      }
    } else {
      // 找到的是别的角色的图形：提示但不收集
      SCAN.hits = 0;
      SCAN.wrongHits++;
      if(SCAN.wrongHits >= 3){
        const other = ORDER.map(k => CHARS[k]).find(c => c.shape === r.shape);
        if(other) scanDbg.textContent = '这是 ' + other.name + ' 的贴纸'
                        + '，先找 ' + target.name + ' 的贴纸';
      }
    }
  } else {
    SCAN.hits = Math.max(0, SCAN.hits - 1);
    if(SCAN.hits === 0) SCAN.wrongHits = 0;
  }

  const debugOn = /[?&]debug=1/.test(location.search || '');
  scanFrameEl.classList.toggle('warm', SCAN.hits > 0);

  if(SCAN.wrongHits < 3){
    if(r.clipped){
      scanDbg.textContent = '拿远一点，让整个图形都进框';
    } else if(SCAN.hits > 0){
      scanDbg.textContent = '看到了 · 再稳住一下';
    } else if(debugOn){
      scanDbg.textContent = '搜索中 · 对比 ' + Math.round(r.contrast || 0)
        + ' · 阈值 ' + Math.round(r.th || 0) + ' · 暗 ' + (r.darkPct || 0).toFixed(0) + '%'
        + (r.shape ? ' · 形状 ' + r.shape : '');
    } else {
      scanDbg.textContent = '';
    }
  }
}

/* =========================================================================
   7. 3D：把角色的 GLB 工作动画放到实景上
   ========================================================================= */
const R3 = { ok:false, flat:false, flatImg:null, flatT:0,
             renderer:null, scene:null, camera:null, visH:0, visW:0,
             mixer:null, clip:null, group:null, shadow:null, cache:{} };

/* 先自己探一次，别让 three.js 在不支持的机器上往控制台报红 */
function webglSupported(){
  try{
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if(!gl) return false;
    const lose = gl.getExtension('WEBGL_lose_context');
    if(lose) lose.loseContext();
    return true;
  }catch(e){ return false; }
}

function initR3(){
  if(!window.THREE || !window.GLTFLoader) return false;
  if(!webglSupported()) return false;
  try{
    R3.renderer = new THREE.WebGLRenderer({ canvas: threeCv, antialias: true, alpha: true });
    R3.renderer.setClearColor(0x000000, 0);
  }catch(e){ return false; }

  R3.scene = new THREE.Scene();
  R3.camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
  R3.camera.position.set(0, 0, 6);
  R3.camera.lookAt(0, 0, 0);

  R3.scene.add(new THREE.AmbientLight(0xffffff, 1.35));
  const key = new THREE.DirectionalLight(0xffffff, 2.1); key.position.set(1.4, 2.4, 4.5); R3.scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.9); rim.position.set(-1.8, 1.4, -3.5); R3.scene.add(rim);

  R3.group = new THREE.Group();
  R3.scene.add(R3.group);

  R3.shadow = makeContactShadow();
  R3.scene.add(R3.shadow);

  R3.ok = true;
  updateR3Layout();
  return true;
}

function updateR3Layout(){
  if(!R3.ok) return;
  R3.renderer.setSize(W, H, false);
  R3.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  R3.camera.aspect = W / Math.max(H, 1);
  R3.camera.updateProjectionMatrix();
  const fovRad = R3.camera.fov * Math.PI / 180;
  R3.visH = 2 * Math.tan(fovRad / 2) * R3.camera.position.z;
  R3.visW = R3.visH * R3.camera.aspect;
}

/* 接触影：一片椭圆渐变贴在脚下 */
function makeContactShadow(){
  const S = 256;
  const cv = document.createElement('canvas');
  cv.width = S; cv.height = S;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  rg.addColorStop(0,   'rgba(10,8,6,.42)');
  rg.addColorStop(.6,  'rgba(10,8,6,.20)');
  rg.addColorStop(1,   'rgba(10,8,6,0)');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(S/2, S/2, S/2, S*0.32, 0, 0, Math.PI*2); g.fill();

  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.32), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.renderOrder = -1;
  return mesh;
}

/* 绕 X 轴转 pitch 后，包围盒在画面上的投影尺寸。
   三个动作的工作面不同：水平面上的动作（擦地板/擦桌子）只有俯过视角才看得清，
   垂直平面上的动作（擦玻璃）平视就好。 */
function projSize(box, pitchRad){
  const cs = Math.cos(pitchRad), sn = Math.sin(pitchRad);
  let mnY = Infinity, mxY = -Infinity;
  for(const Y of [box.min.y, box.max.y])
  for(const Z of [box.min.z, box.max.z]){
    const ny = Y * cs - Z * sn;
    if(ny < mnY) mnY = ny; if(ny > mxY) mxY = ny;
  }
  return { x: box.max.x - box.min.x, y: mxY - mnY };
}

/* 载入动作后预处理：
   ① 把位移最大的那条 position 轨道按 moveScale 压缩（原位移远大于角色本身，
      不压会整个跑出画面；手部的推拉幅度只有它的 1/10，不受影响）
   ② 采样整段动作，量出真实包围盒（SkinnedMesh 必须用 precise 模式，
      否则量到的是没被骨骼变形过的裸顶点 —— 那堆顶点只有 3cm 高，会算出荒唐的比例） */
function prepareWorkMotion(g, c){
  const obj = g.scene, clip = g.animations[0];
  if(!clip) return;

  let best = null, bestAmp = -1;
  for(const tr of clip.tracks){
    if(!/\.position$/.test(tr.name)) continue;
    const v = tr.values, n = v.length / 3;
    let amp = 0;
    for(let k = 0; k < 3; k++){
      let lo = Infinity, hi = -Infinity;
      for(let i = 0; i < n; i++){ if(v[i*3+k] < lo) lo = v[i*3+k]; if(v[i*3+k] > hi) hi = v[i*3+k]; }
      amp = Math.max(amp, hi - lo);
    }
    if(amp > bestAmp){ bestAmp = amp; best = tr; }
  }
  if(best && c.moveScale < 1){
    const v = best.values, n = v.length / 3;
    const av = [0, 0, 0];
    for(let i = 0; i < n; i++) for(let k = 0; k < 3; k++) av[k] += v[i*3+k] / n;
    for(let i = 0; i < n; i++) for(let k = 0; k < 3; k++)
      v[i*3+k] = av[k] + (v[i*3+k] - av[k]) * c.moveScale;
  }

  // 采样 20 帧量全程包围盒
  const mixer = new THREE.AnimationMixer(obj);
  mixer.clipAction(clip).play();
  const full = new THREE.Box3();
  const N = 20;
  for(let i = 0; i < N; i++){
    mixer.setTime(clip.duration * i / N);
    obj.updateMatrixWorld(true);
    full.union(new THREE.Box3().setFromObject(obj, true));
  }
  mixer.stopAllAction();
  // 复位到第一帧，避免残留姿态影响后续
  obj.updateMatrixWorld(true);
  g.userData.fit = { box: full.clone(), pitch: (c.pitch || 0) * Math.PI / 180 };
}

/* 载入并摆好一个角色 */
function loadWorkModel(key){
  return new Promise((resolve, reject) => {
    if(R3.cache[key]){ resolve(R3.cache[key]); return; }
    const c = CHARS[key];
    new window.GLTFLoader().load(c.glb + Q,
      g => {
        prepareWorkMotion(g, c);
        R3.cache[key] = g;
        resolve(g);
      },
      undefined,
      e => reject(e)
    );
  });
}

/* 当前展示的角色 key（null = 没有在展示） */
let showingKey = null;

async function showCharacter(key){
  const c = CHARS[key];
  showingKey = key;
  document.body.classList.add('showing');
  G.state = 'show';
  loadTipEl.textContent = '正在请 ' + c.name + ' 上场…';
  loadTipEl.classList.add('show');

  if(R3.flat){                       // 没有 WebGL：用 2D 立绘 + 干活小动作
    const fi = new Image();
    fi.src = c.img + Q;
    await fi.decode().catch(() => {});
    if(showingKey !== key) return;
    R3.flatImg = fi;
    R3.flatT = 0;
    loadTipEl.classList.remove('show');
    SFX.appear();
    revealShowUI(c);
    return;
  }

  let gltf = null;
  try{
    gltf = await loadWorkModel(key);
  }catch(e){ /* 加载失败走 2D 兜底 */ }

  if(showingKey !== key) return;          // 期间用户已经退出

  loadTipEl.classList.remove('show');
  SFX.appear();

  // 清掉上一个
  while(R3.group.children.length) R3.group.remove(R3.group.children[0]);
  R3.mixer = null;

  if(gltf){
    const obj = gltf.scene;
    const fit = gltf.userData.fit;
    const box = fit ? fit.box : new THREE.Box3().setFromObject(obj);
    const pitch = fit ? fit.pitch : 0;
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);

    // 归一：按"俯过视角后的投影尺寸"算，保证整段动作都在画面里
    const ps = projSize(box, pitch);
    let s = (R3.visH * 0.46) / Math.max(ps.y, 1e-6);
    if(ps.x * s > R3.visW * 0.84) s = (R3.visW * 0.84) / ps.x;

    obj.scale.setScalar(s);
    obj.position.set(-center.x * s, -center.y * s, -center.z * s);

    // 俯视角：水平面上的动作要俯过来看才看得清
    R3.pivot = new THREE.Group();
    R3.pivot.rotation.x = pitch;
    R3.pivot.add(obj);
    R3.group.add(R3.pivot);
    R3.group.position.set(0, R3.visH * (c.yFrac || -0.16), 0);

    // 接触影：贴在动作面的下方
    const w = ps.x * s;
    R3.shadow.scale.set(w * 0.62, 1, w * 0.42);
    R3.shadow.position.set(0, R3.visH * (c.yFrac || -0.16) - ps.y * s * 0.52 + 0.001, 0);
    R3.shadow.visible = true;

    if(gltf.animations && gltf.animations.length){
      R3.mixer = new THREE.AnimationMixer(obj);
      const act = R3.mixer.clipAction(gltf.animations[0]);
      act.setLoop(THREE.LoopRepeat, Infinity);
      act.reset().play();
    }
  } else {
    // 2D 兜底：把立绘当 sprite 贴上去
    const img = new Image();
    img.src = c.img + Q;
    await img.decode().catch(() => {});
    const h = R3.visH * 0.36;
    const w = h * (img.naturalWidth || 1) / (img.naturalHeight || 1);
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    mesh.position.set(0, -R3.visH * 0.16 + h / 2, 0);
    R3.group.add(mesh);
    R3.shadow.scale.set(w * 1.1, 1, w * 0.7);
    R3.shadow.position.set(0, -R3.visH * 0.16 + 0.001, 0);
    R3.shadow.visible = true;
  }

  revealShowUI(c);
}

/* 展示页文案（3D / 2D 两条路共用） */
function revealShowUI(c){
  showNameEl.textContent = c.name;
  showCapEl.textContent = c.cap;
  showNextBtn.textContent = allDone() ? '完成收集' : '继续找下一个';
  showEl.classList.remove('hide');
}

/* 再看一遍：动作从头播 */
function replayShow(){
  if(R3.flat){ R3.flatT = 0; return; }
  if(showingKey && R3.cache[showingKey] && R3.mixer){
    const gltf = R3.cache[showingKey];
    if(gltf.animations && gltf.animations.length){
      R3.mixer.stopAllAction();
      const act = R3.mixer.clipAction(gltf.animations[0]);
      act.reset().play();
    }
  }
}

function hideShow(){
  showingKey = null;
  document.body.classList.remove('showing');
  showEl.classList.add('hide');
  R3.flatImg = null;
  if(R3.flat) return;              // 没有 WebGL 就没有 group/shadow
  while(R3.group.children.length) R3.group.remove(R3.group.children[0]);
  R3.shadow.visible = false;
  R3.mixer = null;
}

function syncShow(dt){
  if(R3.mixer) R3.mixer.update(dt);
  if(R3.flat) R3.flatT += dt;
}

/* 没有 WebGL 时的角色：2D 立绘踩着拍子上下弹、左右轻摆，做出"在干活"的动态。
   脚底落在画面 66% 处，和 3D 版站的位置一致。 */
function drawFlatShow(){
  const img = R3.flatImg;
  if(!img || !img.naturalWidth) return;
  const t  = R3.flatT;
  const h  = H * 0.38;
  const w  = h * img.naturalWidth / img.naturalHeight;
  const cx = W / 2, baseY = H * 0.66;
  const ph = Math.PI / 0.42;                       // 0.42s 一拍
  const b  = Math.abs(Math.sin(t * ph));            // 0→1→0 的弹跳
  const dy = -h * 0.05 * b;
  const sq = 1 + 0.05 * (b - 0.5);                  // 落下去时压扁一点

  // 地面投影（径向渐变，不用 filter，兼容老内核）
  ctx.save();
  const sw = w * 0.60, sh = Math.max(3, h * 0.055);
  const g = ctx.createRadialGradient(cx, baseY, 0, cx, baseY, sw / 2);
  g.addColorStop(0, 'rgba(0,0,0,' + (0.24 - 0.08 * b).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.ellipse(cx, baseY, sw / 2, sh, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.translate(cx, baseY + dy - h / 2);
  ctx.rotate(0.06 * Math.sin(t * ph * 2));
  ctx.scale(1 / sq, sq);
  ctx.drawImage(img, -w / 2, -h / 2, w, h);
  ctx.restore();

  // 两侧的动感弧线，随拍子冒出来
  const a = 0.42 * (1 - b);
  if(a > 0.02){
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    ctx.lineWidth = Math.max(2, h * 0.014);
    ctx.lineCap = 'round';
    for(let s = -1; s <= 1; s += 2){
      const x = cx + s * w * 0.60, y = baseY + dy - h * 0.56;
      ctx.beginPath();
      ctx.arc(x, y, w * 0.085,
              s > 0 ? -0.7 : Math.PI + 0.7,
              s > 0 ?  0.7 : Math.PI - 0.7);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* =========================================================================
   8. 收集流程
   ========================================================================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

/* 顶部进度条：三个「寻找xx」，点击切换扫描目标 */
function buildBar(){
  tplBar.innerHTML = '';
  ORDER.forEach(k => {
    const c = CHARS[k];
    const d = document.createElement('div');
    d.className = 'wchip' + (G.collected[k] ? ' done' : (k === targetKey() ? ' cur' : ''));
    d.innerHTML = '<span>寻找' + c.name + '</span>';
    d.addEventListener('click', () => {
      if(G.state !== 'scan') return;
      if(G.collected[k]){ toast(c.name + ' 已经收集到啦'); return; }
      if(G.idx === ORDER.indexOf(k)) return;
      G.idx = ORDER.indexOf(k);
      buildBar();
      buildTip();
      SCAN.hits = 0; SCAN.wrongHits = 0;
    });
    tplBar.appendChild(d);
  });
}

/* 扫描页提示语 */
function buildTip(){
  const c = CHARS[targetKey()];
  scanTipEl.innerHTML = '扫描 <b>' + c.name + '</b> 的贴纸<br>让我们来看看它在干什么呀';
}

/* 启动：一进来就是识别页 */
async function bootScan(){
  G.state = 'scan';
  // 目标对准第一个还没收集的角色（全齐了就停在最后一个，方便直接去拍）
  if(!allDone()){
    G.idx = Math.max(0, ORDER.findIndex(k => !G.collected[k]));
  }
  document.body.classList.remove('showing', 'capturing');
  overEl.classList.add('hide');
  shotEl.classList.add('hide');
  capEl.classList.add('hide');
  showEl.classList.add('hide');
  scanSheet.classList.remove('hide');
  buildBar();
  buildTip();
  scanDbg.textContent = '';
  scanFrameEl.classList.remove('warm');
  SCAN.hits = 0; SCAN.wrongHits = 0;
  const hasAny = ORDER.some(k => G.collected[k]);
  scanGoBtn.classList.toggle('show', hasAny);
  scanGoSub.classList.toggle('show', hasAny);

  const ok = await openCam('environment');
  if(!ok){
    scanDbg.textContent = '摄像头打不开（需要 https 或 localhost）';
    camFailBtn.hidden = false;
    toast('摄像头不可用，请检查权限');
    return;
  }
  camFailBtn.hidden = true;
  scanDbg.textContent = '';
  // 等摄像头画面稳定再开始识别，避免启动瞬间全黑/噪点画面被误判成图形
  await wait(CONFIG.scanWarmup);
  SCAN.running = true;
}

/* 扫到了：解锁模板 + 上场表演 */
function onFound(key){
  if(G.state !== 'scan' || !SCAN.running) return;
  SCAN.running = false;
  scanFrameEl.classList.remove('warm');
  scanSheet.classList.add('hide');
  SFX.lock();

  if(!G.collected[key]){
    G.collected[key] = true;
    saveStore();
  }
  G.idx = ORDER.indexOf(key);

  showCharacter(key);
}

/* 看完表演：继续找下一个 / 全齐了去结算 */
function showNext(){
  ensureAudio();
  hideShow();
  if(allDone()){
    showOver();
    return;
  }
  bootScan();
}

/* 结算：已收集的伙伴 */
function showOver(){
  G.state = 'over';
  hideShow();
  scanSheet.classList.add('hide');
  SFX.win();
  buildCards();
  const n = ORDER.filter(k => G.collected[k]).length;
  const t = $('overTitle'), s = $('overSub');
  if(allDone()){
    t.textContent = '三个伙伴都找到啦';
    s.textContent = '和它们一起拍张合照吧';
  } else {
    t.textContent = '已收集的伙伴';
    s.textContent = '继续扫描，认识更多伙伴吧';
  }
  $('photoBtn').style.display = n > 0 ? '' : 'none';
  overEl.classList.remove('hide');
}

function buildCards(){
  tplCards.innerHTML = '';
  ORDER.forEach(k => {
    if(!G.collected[k]) return;      // 收集了谁就显示谁
    const c = CHARS[k];
    const d = document.createElement('div');
    d.className = 'tplCard';
    d.innerHTML = '<img src="' + c.img + Q + '" alt=""><span class="nm">' + c.name
                + '</span><span class="st">已收集</span>';
    tplCards.appendChild(d);
  });
  // 一个都没有时给个空态
  if(!tplCards.children.length){
    const e = document.createElement('div');
    e.className = 'emptyCards';
    e.textContent = '还没有收集到伙伴，去扫描贴纸吧';
    tplCards.appendChild(e);
  }
}

/* 「继续寻找」：回扫描页 */
function collectLater(){
  overEl.classList.add('hide');
  bootScan();
}

/* =========================================================================
/* =========================================================================
   9. 拍照：全屏实景 + 可拖动伙伴贴纸
   ========================================================================= */
/* 成片尺寸：跟随屏幕比例（长边 1350），这样贴纸从屏幕映射到成片是
   统一等比缩放，不会被压扁/拉长。之前固定 1080×1350（4:5），而手机屏幕
   接近 9:19.5，两个比例不同导致贴纸横向 scale 大于纵向 scale → 照片里的
   贴纸被压变形。 */
function outSize(){
  const maxDim = 1350;
  const k = maxDim / Math.max(W, H);
  return { w: Math.max(1, Math.round(W * k)), h: Math.max(1, Math.round(H * k)) };
}

let shotDataUrl = '';
let placedStickers = [];        // { key, el, x, y, w }  x/y = 左上角(CSS px)，w = 宽
let stickerSeq = 0;

/* 伙伴贴纸默认尺寸（CSS px，占画面宽比例） */
const STICKER_W = () => Math.round(Math.min(W, H) * 0.28);

/* 清空所有已摆放贴纸 */
function clearStickers(){
  placedStickers.forEach(s => { if(s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el); });
  placedStickers = [];
}

/* 底部伙伴栏：收集了谁就显示谁 */
function buildStickerBar(){
  stickerBarRow.innerHTML = '';
  const has = ORDER.filter(k => G.collected[k]);
  if(!has.length){
    document.getElementById('stickerBarHint').textContent = '还没有收集到伙伴，先去扫描贴纸吧';
    return;
  }
  document.getElementById('stickerBarHint').textContent = '把伙伴拖出来一起合照';
  has.forEach(k => {
    const c = CHARS[k];
    const b = document.createElement('div');
    b.className = 'stickerSrc';
    b.dataset.key = k;
    b.innerHTML = '<img src="' + c.img + Q + '" alt="' + c.name + '">';
    b.addEventListener('pointerdown', e => onStickerSrcDown(e, k));
    stickerBarRow.appendChild(b);
  });
}

/* 从伙伴栏按下：生成一个跟随手指的贴纸 */
function onStickerSrcDown(e, key){
  e.preventDefault();
  const c = CHARS[key];
  const w = STICKER_W();
  const img = CHAR_IMG(key);
  const rect = img.naturalWidth ? (img.naturalWidth / Math.max(img.naturalHeight,1)) : 1;
  const h = Math.round(w / Math.max(rect, 0.3));
  const el = document.createElement('div');
  el.className = 'sticker dragging';
  el.innerHTML = '<img src="' + c.img + Q + '" alt="' + c.name + '">';
  el.style.width = w + 'px';
  el.style.height = h + 'px';
  stickerLayer.appendChild(el);

  const layerRect = stickerLayer.getBoundingClientRect();
  moveAt(e, el, w, h);
  el.style.zIndex = 20;

  const onMove = ev => { ev.preventDefault(); moveAt(ev, el, w, h); };
  const onUp = ev => {
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.removeEventListener('pointercancel', onUp);
    el.classList.remove('dragging');
    el.style.zIndex = '';
    // 落点：中心在 layer 内则落位，否则弹回（移除）
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    if(cx >= layerRect.left && cx <= layerRect.right && cy >= layerRect.top && cy <= layerRect.bottom){
      const s = { key, el, x: r.left - layerRect.left, y: r.top - layerRect.top, w: r.width, h: r.height };
      el.style.left = s.x + 'px';
      el.style.top  = s.y + 'px';
      el.style.transform = '';
      bindStickerDrag(el, s);
      placedStickers.push(s);
    } else {
      el.parentNode.removeChild(el);
    }
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
  };
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
  document.addEventListener('pointercancel', onUp);
}

function moveAt(ev, el, w, h){
  const layerRect = stickerLayer.getBoundingClientRect();
  el.style.left = (ev.clientX - layerRect.left - w/2) + 'px';
  el.style.top  = (ev.clientY - layerRect.top - h/2) + 'px';
}

/* 统一应用贴纸位置与尺寸 */
function applyStickerPos(el, s){
  el.style.left = s.x + 'px';
  el.style.top  = s.y + 'px';
  el.style.width  = s.w + 'px';
  el.style.height = s.h + 'px';
}

/* 已摆放的贴纸：单指拖动位置，双指缩放大小 */
function bindStickerDrag(el, s){
  const pointers = new Map();   // pointerId -> {x, y}
  let startDist = 0, startW = 0, startH = 0;
  let dragBase = null;          // 单指拖动基准
  let pinchBase = null;         // 双指缩放基准

  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    el.classList.add('dragging');
    el.style.zIndex = 20;

    if(pointers.size === 1){
      const p = pointers.get(e.pointerId);
      dragBase = { px: p.x, py: p.y, ox: s.x, oy: s.y };
      pinchBase = null;
    } else if(pointers.size === 2){
      const pts = [...pointers.values()];
      startDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      startW = s.w; startH = s.h;
      const mx = (pts[0].x + pts[1].x) / 2;
      const my = (pts[0].y + pts[1].y) / 2;
      pinchBase = { mx, my, ox: s.x + s.w/2, oy: s.y + s.h/2 };
      dragBase = null;
    }
  });

  el.addEventListener('pointermove', e => {
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(pointers.size === 1 && dragBase){
      // 单指拖动
      const p = pointers.get(e.pointerId);
      s.x = dragBase.ox + (p.x - dragBase.px);
      s.y = dragBase.oy + (p.y - dragBase.py);
      s.x = clamp(s.x, -s.w*0.5, stickerLayer.offsetWidth  - s.w*0.5);
      s.y = clamp(s.y, -s.w*0.5, stickerLayer.offsetHeight - s.h*0.5);
      applyStickerPos(el, s);
    } else if(pointers.size === 2 && pinchBase){
      // 双指缩放（以两指中心为锚点）
      const pts = [...pointers.values()];
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const ratio = startDist > 0 ? dist / startDist : 1;
      const maxW = Math.min(stickerLayer.offsetWidth, stickerLayer.offsetHeight) * 0.9;
      const nw = clamp(startW * ratio, 44, maxW);
      const nh = nw * (startH / startW);
      s.w = nw; s.h = nh;
      s.x = pinchBase.ox - nw/2;
      s.y = pinchBase.oy - nh/2;
      s.x = clamp(s.x, -s.w*0.5, stickerLayer.offsetWidth  - s.w*0.5);
      s.y = clamp(s.y, -s.w*0.5, stickerLayer.offsetHeight - s.h*0.5);
      applyStickerPos(el, s);
    }
  });

  const onUp = e => {
    if(!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if(pointers.size === 0){
      el.classList.remove('dragging');
      el.style.zIndex = '';
      dragBase = null; pinchBase = null;
    } else if(pointers.size === 1){
      // 从双指回到单指：重新校准拖动基准
      const p = pointers.values().next().value;
      dragBase = { px: p.x, py: p.y, ox: s.x, oy: s.y };
      pinchBase = null;
    }
  };
  el.addEventListener('pointerup', onUp);
  el.addEventListener('pointercancel', onUp);
  el.addEventListener('lostpointercapture', onUp);
}

/* 打开拍照页 */
async function openCapture(){
  ensureAudio();
  G.state = 'capture';
  overEl.classList.add('hide');
  scanSheet.classList.add('hide');
  shotEl.classList.add('hide');
  showEl.classList.add('hide');
  capEl.classList.remove('hide');
  document.body.classList.add('capturing');

  clearStickers();
  buildStickerBar();
  // 画面初始留空，伙伴从底部白框手动拖出来摆放

  if(!camStream){
    await openCam(camFacing);
  } else {
    await ensureCamBg();
  }
}

/* 关闭拍照页，回结算 */
async function closeCapture(){
  capEl.classList.add('hide');
  shotEl.classList.add('hide');
  document.body.classList.remove('capturing');
  overEl.classList.remove('hide');
  G.state = 'over';
  if(!camStream){
    await openCam('environment');
  } else {
    await ensureCamBg();
  }
}

/* 快门：相机帧 + 所有贴纸 → 成片 → 直接「拍好啦」 */
function shoot(){
  const v = camEl;
  const { w: OUT_W, h: OUT_H } = outSize();
  const cc = document.createElement('canvas');
  cc.width = OUT_W; cc.height = OUT_H;
  const g = cc.getContext('2d');

  // 背景：相机画面 cover 铺满 4:5
  if(v && v.videoWidth){
    const vw = v.videoWidth, vh = v.videoHeight;
    const sc = Math.max(OUT_W / vw, OUT_H / vh);
    const dw = vw * sc, dh = vh * sc;
    const dx = (OUT_W - dw) / 2, dy = (OUT_H - dh) / 2;
    if(camFacing === 'user'){
      g.save(); g.translate(OUT_W, 0); g.scale(-1, 1);
      g.drawImage(v, OUT_W - dx - dw, dy, dw, dh);
      g.restore();
    } else {
      g.drawImage(v, dx, dy, dw, dh);
    }
  } else {
    g.fillStyle = '#EFE8DE';
    g.fillRect(0, 0, OUT_W, OUT_H);
  }

  // 贴纸：屏幕坐标 → 成片坐标。成片已按屏幕比例生成，横向/纵向 scale 一致，
  // 用统一 scale 等比放大，贴纸不被压扁。
  const layerRect = stickerLayer.getBoundingClientRect();
  const sc = OUT_W / layerRect.width;
  placedStickers.forEach(s => {
    const img = CHAR_IMG(s.key);
    if(!img || !img.naturalWidth) return;
    const dw = s.w * sc;
    const dh = (s.h != null) ? s.h * sc : dw * (img.naturalHeight / img.naturalWidth);
    g.drawImage(img, s.x * sc, s.y * sc, dw, dh);
  });

  shotDataUrl = cc.toDataURL('image/jpeg', 0.92);
  shotImg.src = shotDataUrl;

  SFX.shutter();
  capEl.classList.add('hide');
  shotEl.classList.remove('hide');
}

/* 重新拍摄 */
function retake(){
  ensureAudio();
  shotEl.classList.add('hide');
  capEl.classList.remove('hide');
  if(!camStream) openCam(camFacing); else ensureCamBg();
}

function CHAR_IMG(key){
  const k = typeof key === 'string' ? key : key.key;
  if(!_charImgs[k]){
    const im = new Image();
    im.src = CHARS[k].img + Q;
    _charImgs[k] = im;
  }
  return _charImgs[k];
}
const _charImgs = {};

/* =========================================================================
   10. 主循环
   ========================================================================= */
let lastTs = 0, crashed = false, camHealAt = 0;

function render(){
  ctx.clearRect(0, 0, W, H);
  const needBg = (G.state === 'scan' || G.state === 'show' || G.state === 'capture');
  if(needBg) drawCamBg();

  if(G.state === 'show' && R3.flat) drawFlatShow();
}

function safeRender(){
  if(crashed) return;
  try{ render(); }
  catch(err){
    crashed = true;
    console.error('[render]', err);
    const el = document.createElement('div');
    el.id = 'crash';
    el.textContent = '渲染出错：' + (err && err.message ? err.message : err);
    document.body.appendChild(el);
  }
}

function loop(ts){
  const dt = Math.min((ts - lastTs) / 1000 || 0, 0.05);
  lastTs = ts;

  if(G.state === 'scan') updateScan(dt);
  if(G.state === 'show') syncShow(dt);

  /* 摄像头自愈 */
  if(camStream && (camEl.paused || !camEl.videoWidth) && G.state !== 'capture' && ts > camHealAt){
    camHealAt = ts + 1200;
    ensureCamBg().catch(() => {});
  }

  if(R3.ok){
    R3.renderer.render(R3.scene, R3.camera);
  }
  safeRender();
  requestAnimationFrame(loop);
}

/* =========================================================================
   11. 绑定与启动
   ========================================================================= */
showNextBtn.addEventListener('click', () => { ensureAudio(); showNext(); });
showReplayBtn.addEventListener('click', () => { ensureAudio(); replayShow(); });
scanGoBtn.addEventListener('click', () => { ensureAudio(); showOver(); });
$('photoBtn').addEventListener('click', () => { openCapture(); });
$('laterBtn').addEventListener('click', () => { ensureAudio(); collectLater(); });
$('resetBtn').addEventListener('click', () => {
  // 清空进度，回到全新状态（应对"没收集却显示已收集"的残留）
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  ORDER.forEach(k => { G.collected[k] = false; });
  G.idx = 0;
  overEl.classList.add('hide');
  ensureAudio();
  bootScan();
});
camFailBtn.addEventListener('click', () => {
  // 没摄像头也能看流程：直接把当前目标标记为已收集（演示用）
  onFound(targetKey());
});
capBackBtn.addEventListener('click', () => {
  ensureAudio();
  closeCapture();
});
shutterBtn.addEventListener('click', () => { ensureAudio(); shoot(); });
$('shotDone').addEventListener('click', () => { ensureAudio(); closeCapture(); });
$('retakeBtn').addEventListener('click', retake);

/* 演示模式：?demo=1 扫描页出现"直接收集"按钮 */
if(/[?&]demo=1/.test(location.search || '')){
  const b = document.createElement('button');
  b.className = 'btn ghost';
  b.type = 'button';
  b.textContent = '直接收集（演示）';
  b.style.marginTop = '6px';
  b.addEventListener('click', () => { ensureAudio(); onFound(targetKey()); });
  document.querySelector('#scanSheet .scanFoot').appendChild(b);
}

window.__WORK = {
  G, CONFIG, CHARS, ORDER, SCAN, R3,
  bootScan, analyzeShapes, onFound, showCharacter, showOver, openCapture,
  shoot, closeCapture,
  get showingKey(){ return showingKey; },
  get placedStickers(){ return placedStickers; },
};

loadStore();
initScan();
/* 没有 WebGL 也能上课：3D 只是展示手段，缺了就切 2D 立绘（R3.flat） */
R3.flat = !initR3();
if(R3.flat) threeCv.style.display = 'none';
resize();
requestAnimationFrame(ts => { lastTs = ts; loop(ts); });
bootScan();

})();
</script>
